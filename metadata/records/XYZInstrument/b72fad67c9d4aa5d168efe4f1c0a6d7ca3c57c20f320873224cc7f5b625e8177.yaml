description: 'case-e is a self-contained Electronic Case Report Form (eCRF) application
  packaged to run locally. It bundles a FastAPI backend, a Vue.js frontend, an embedded
  database, and a web server so researchers or clinicians can design study forms,
  collect subject data, review entries, and export results without installing or configuring
  external services.


  Downloads for macOS and Windows are provided. It’s MIT-licensed and intended as
  an easy-to-deploy tool for managing clinical/experimental study data.'
