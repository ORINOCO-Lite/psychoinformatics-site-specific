description: The Collaboration Hub of the TRR379 is a central collaboration platform.
  It runs an enhanced variant of the [Forgejo](https://forgejo.org/) software that
  is designed for maximum interoperability with the RDM solution [DataLad](https://www.datalad.org/).
  It allows for hosting arbitrarily large data on the same site. The integration with
  the [git-annex](https://git-annex.branchable.com/) software makes it ideal for the
  federated, multi-site nature of TRR379. The full software-stack is free and open
  source software, and can be deployed at any collaborating site with minimal effort.
  This aspect is essential for supporting the decentralized RDM approach of the TRR.
