description: 'datasalad is a pure-Python library with a collection of utilities for
  working with data in the vicinity of Git and git-annex. While this is a foundational
  library from and for the DataLad project, its implementations are standalone, and
  are meant to be equally well usable outside the DataLad system.


  A focus of this library is efficient communication with subprocesses, such as Git
  or git-annex commands, which read and produce data in some format.'
