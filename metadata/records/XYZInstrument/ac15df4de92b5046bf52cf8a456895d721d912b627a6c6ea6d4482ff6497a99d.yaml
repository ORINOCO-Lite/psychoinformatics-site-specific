description: 'Git-annex is written in Haskell and plenty of installation methods are
  available. However, for deploying git-annex as a dependency of a Python library/application,
  like DataLad or AnnexRemote, system packages are a lot less flexible than Python''s
  virtual environments, and other methods are more complex and fragile.


  With git-annex being available from PyPi, versioned dependencies and deployment
  in application-specific environments are possible via standard means of Python packaging.'
