description: 'This software is a DataLad extension that equips DataLad with a set
  of commands to track XNAT projects.


  XNAT is an open source imaging informatics platform developed by the Neuroinformatics
  Research Group at Washington University. It facilitates common management, productivity,
  and quality assurance tasks for imaging and associated data. XNAT can be used to
  support a wide range of neuro/medical imaging-based projects.'
