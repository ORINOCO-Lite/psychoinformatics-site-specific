description: 'Extension of the dataset published in [Hanke et al. (2014)](https://www.psychoinformatics.de/publications/f9a11f66-f71c-4dcb-964e-8a2954cef094)
  with additional acquisitions for 15 of the original 20 participants. These additions
  include: retinotopic mapping, a localizer paradigm for higher visual areas (FFA,
  EBA, PPA), and another 2h movie recording with 3T full-brain BOLD fMRI with simultaneous
  1000 Hz eyetracking. This is an extension of the studyforrest project, all participants
  previously volunteered for the audio-only Forrest Gump study. The dataset is structured
  in BIDS format, details of the files and metadata can be found in [Sengupta, et
  al. (2016)](https://www.psychoinformatics.de/publications/50f24bfa-4371-4f74-a57f-d62d71553ecb)
  and [Hanke, et al. (2016)](https://www.psychoinformatics.de/publications/06688308-2c40-49a6-88e3-ba7bfca73a1e).
  These publications also report on validation analyses that these data support modeling
  specific properties of the complex natural stimulus, as well as a substantial within-subject
  BOLD response congruency in brain areas related to the processing of auditory inputs,
  speech, and narrative when compared to the existing fMRI data for audio-only stimulation.


  The dataset also provides participants'' eye gaze location as recorded simultaneously
  with fMRI, together with an additional sample of 15 control participants whose eye
  gaze trajectories for the entire movie were recorded in a lab setting—to enable
  studies on attentional processes and comparative investigations on the potential
  impact of the stimulation setting on these processes.


  For more information about the project visit: [studyforrest.org](http://studyforrest.org).


  We acknowledge the support of the Combinatorial NeuroImaging Core Facility at the
  Leibniz Institute for Neurobiology in Magdeburg, and the German federal state of
  Saxony-Anhalt, Project: Center for Behavioral Brain Sciences. This research was,
  in part, also supported by the German Federal Ministry of Education and Research
  (BMBF) as part of a US-German collaboration in computational neuroscience (CRCNS),
  co-funded by the BMBF and the US National Science Foundation (BMBF 01GQ1112; NSF
  1129855). Work on the data-sharing technology employed for this research was supported
  by US-German CRCNS project, co-funded by the BMBF and the US National Science Foundation
  (BMBF 01GQ1411; NSF 1429999).'
