description: 'Movie stimulus annotations for the research cut of the "Forrest Gump"
  movie used in the studyforrest.org project. Annotations are collected from various
  contributors and publications.


  Annotations are typically provided as plain text tables, using a tab-separated-value
  markup with a header row. Table usually contain a onset and a duration column to
  indicate the timing of an event. All other columns contain variables that describe
  properties of an event.'
