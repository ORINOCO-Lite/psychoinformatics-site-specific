description: 'A Drittmittelanzeige is (in German academic/administrative contexts)
  a notification or declaration that a researcher or university employee files to
  report third-party funding (Drittmittel) received (or applied for) for research
  or projects. It typically serves these purposes:


  - Documents the source, amount, and purpose of external funds (e.g., grants from
  industry, foundations, EU, government agencies).

  - Ensures compliance with institutional rules on acceptance and use of third-party
  funds (conflict-of-interest checks, approval by the employer/institution).

  - Triggers administrative handling (accounting, budgeting, cost-center assignment,
  overhead/indirect cost processing).

  - Records any obligations or restrictions attached to the funding (reporting, IP/ownership,
  publication embargoes).


  Format and procedures vary by institution: some use an online form, others a written
  request to the department or research office. If you want, I can draft a sample
  Drittmittelanzeige form or checklist tailored to a university.'
name: Drittmittelanzeige
