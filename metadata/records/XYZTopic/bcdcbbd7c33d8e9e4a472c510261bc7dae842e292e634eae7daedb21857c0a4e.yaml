description: 'Naturalistic neuroimaging refers to neuroimaging studies that use ecologically
  valid, dynamic and often multimodal stimuli or interactions (e.g., movies, stories,
  real social exchanges, continuous visual searching) during brain recording (fMRI,
  EEG, MEG, etc.) to study brain activity as it unfolds in real-life–like conditions
  rather than through brief, highly controlled trial-based tasks. It aims to capture
  richer temporal dynamics, social and perceptual processing, and between-subject
  similarities (e.g., inter-subject correlations), and is used to improve ecological
  validity and discover network-level or event-driven brain responses relevant to
  cognition and clinical conditions. '
display_label: Naturalistic neuroimaging
