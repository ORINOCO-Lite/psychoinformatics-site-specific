description: 'This annotation can be used to assign a record name within the namespace
  used by the psychoinformatics project and its knowledge pool. This is useful for
  two main use cases:


  1. A record has a random PID, and a human-readable identifier for a URL slug is
  desirable.

  2. A record has a non-random PID with outdated semantics (e.g., name of the subject
  changed) and should be presented under a different name.


  This tag is similar to `psyinf-ns-id`. The difference is that only the last "path
  segment" of the PID is changed (e.g. `persons/<uuid>` would be replaced with `persons/<annotation-value>`).'
display_label: Psychoinformatics namespace record name
pid: xyzrins:annotation-tags/psyinf-ns-name
schema_type: dlthings:AnnotationTag
