description: 'This annotation can be used to assign a record identifier within the
  namespace used by the psychoinformatics project and its knowledge pool. This is
  useful for three main use cases:


  1. A record has a PID in a global namespace, but should also be presented within
  the psyinf domain (e.g., with a page on the project website). Example: A Person
  record using an ORCID identifier as the PID.

  2. A record has a random PID, and a human-readable identifier for a URL slug is
  desirable.

  3. A record has a non-random PID with outdated semantics (e.g., name of the subject
  changed) and should be presented under a different name.'
display_label: Psychoinformatics namespace identifier
pid: xyzrins:annotation-tags/psyinf-ns-id
schema_type: dlthings:AnnotationTag
