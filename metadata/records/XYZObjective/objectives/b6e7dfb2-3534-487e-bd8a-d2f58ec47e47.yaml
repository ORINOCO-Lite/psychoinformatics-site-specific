description: Advocates studying cognition and perception using complex, ecologically
  valid stimuli and rich multivariate measurements rather than only simplified lab
  tasks. This can involve designing and analyzing high-dimensional experiments (e.g.,
  continuous naturalistic stimulus paradigms, multimodal recordings) to capture more
  realistic neural representations and to improve generalizability of findings to
  real-world behavior.
