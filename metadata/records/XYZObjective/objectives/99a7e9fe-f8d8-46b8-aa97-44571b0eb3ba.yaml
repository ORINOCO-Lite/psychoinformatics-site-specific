description: This objective focuses on combining theoretical and experimental approaches
  from psychology and neuroscience with computational methods from machine learning
  and informatics. Concretely, this can involve developing and applying algorithms,
  classifiers, and representational models to extract meaningful patterns from behavioral
  and neural data, enabling more powerful hypothesis testing, prediction, and interpretation
  of cognitive processes.
