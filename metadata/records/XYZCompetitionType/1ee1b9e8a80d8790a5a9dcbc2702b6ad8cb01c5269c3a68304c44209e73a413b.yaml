description: "Collaborative Research Centres are long-term university-based research\
  \ institutions, established for up to 12 years, in which researchers work together\
  \ within a multidisciplinary research programme.\n\nThey allow researchers to tackle\
  \ innovative, challenging, complex and long-term research undertakings through the\
  \ coordination and concentration of individuals and resources within the applicant\
  \ universities. They therefore enable institutional priority area development and\
  \ structural development. Cooperations with non-university research institutions\
  \ are expressly encouraged.\n\nCollaborative Research Centres consist of a large\
  \ number of projects. The number and scope of these projects depend on the research\
  \ programme. Individual projects are led by one researcher or jointly by several\
  \ researchers.\n "
