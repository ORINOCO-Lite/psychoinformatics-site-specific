description: A formal recognition (title, prize, honor, grant, or certificate) granted
  to an individual, team, work, or organization on the basis of demonstrated merit,
  measured by predefined evaluative criteria such as excellence, originality, impact,
  technical quality, or service—determined through an adjudication process (e.g.,
  jury or peer review). Recipients are selected from candidates submitted via self-nomination
  or third-party nomination, application, or curated consideration, and selection
  is documented by the awarding body according to stated eligibility and evaluation
  procedures.
