description: The project aims to create a new standard for brain atlases from the
  micro- to the macro-scale, link foundational multi-level data and connectomes in
  the healthy and pathological brain with atlases and models, create digital twins
  through modelling and simulation as well as unique, excellent, and preferred services
  for FAIR neuroscience data. The overarching goal of EBRAINS 2.0 is to foster a deeper
  understanding of brain structure and function with dedicated and mature software
  tools, to facilitate the development of more effective treatments, new drugs, diagnostics
  and preventive measures for neuro-psychiatric disorders.
