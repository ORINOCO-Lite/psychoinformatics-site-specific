description: The Case-E project aims to develop a flexible, cost-effective open-source
  solution for Electronic Case Report Forms (eCRFs) that, in particular, facilitates
  standardised, secure and quality-assured data collection and data exchange in multicentre
  clinical trials. To this end, JTrack’s expertise in clinical trials and digital
  data collection (biomarker development) is being combined with DataLad’s expertise
  in data management (psychoinformatics). Case-E is designed to be easily adaptable
  to different trials and to be deployed alongside existing clinical IT infrastructures.
