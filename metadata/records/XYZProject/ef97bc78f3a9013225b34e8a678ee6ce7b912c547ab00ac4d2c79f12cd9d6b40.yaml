description: HELIA is developing a mobile robotic assistance system designed to provide
  flexible support to healthcare professionals in their day-to-day clinical work.
  At its core is a no-code approach (EPG system), which enables clinical staff without
  programming knowledge to create new tasks for a service robot, based on AI models
  such as vision-language and large-language models. In parallel, the development
  and testing of the HELIA system are being subjected to a comprehensive ethical,
  legal and medical analysis, particularly with regard to data protection, transparency
  and its use with vulnerable patient groups. This analysis takes into account current
  and future regulatory frameworks such as the GDPR, the AI Act and the European Health
  Data Space, and links them to practical experience gained from clinical trials.
  The aim is to develop practical ethical guidelines for the use of AI-supported robotics
  in medicine and to utilise these scientifically.
