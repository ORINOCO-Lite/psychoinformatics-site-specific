description: The project "Normative Molecular Imaging for identifying disease heterogeneity"
  (NorMImag) aims to use AI-based normative models to better capture the diversity
  of disease-specific brain alterations in Alzheimer’s patients. Using FDG-PET data,
  the models will predict typical brain activity patterns for healthy individuals
  based on their demographic characteristics, enabling the detection of pathological
  deviations at the regional level in patients. This approach supports more individualized
  and automated diagnostics and lays the groundwork for personalized treatment strategies.
