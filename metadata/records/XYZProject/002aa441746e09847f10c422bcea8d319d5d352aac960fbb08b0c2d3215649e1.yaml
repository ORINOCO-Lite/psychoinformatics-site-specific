description: The research project aims to investigate the organisation of neurochemistry
  in the brains of humans and macaques by characterising neurotransmitter receptor
  systems. The focus is on identifying potential evolutionary trade-offs, which are
  to be discovered using a specific dimensionality reduction technique called ParTI.
  The aim is to gain insights into neurological and psychiatric disorders and to validate
  these findings using multimodal imaging, behavioural data and gene expression data,
  whilst also carrying out interspecies comparisons between humans and macaques to
  identify evolutionary differences.
