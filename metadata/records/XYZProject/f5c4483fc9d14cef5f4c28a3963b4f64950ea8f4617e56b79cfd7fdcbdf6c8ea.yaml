description: This project will consolidate fragmented research-information workflows
  at INM-7 into a curated, FAIRer, interoperable knowledge base. Using a co-design
  approach with scientists, administrators, and RDM experts, we will adapt an open-source,
  domain-agnostic linked-data tool stack to capture funding opportunities, application
  intents, project deliverables, outputs, and associated documents via browser forms
  and APIs. Submitted records undergo curation and access control, enabling validated,
  machine-readable metadata and routine automated queries for reporting, reminders,
  and discovery. Integration with Helmholtz knowledge-graph efforts ensures semantic
  alignment. The outcome is a reusable, self-hostable system improving transparency,
  reducing duplication, and preserving institutional memory for funded research.
