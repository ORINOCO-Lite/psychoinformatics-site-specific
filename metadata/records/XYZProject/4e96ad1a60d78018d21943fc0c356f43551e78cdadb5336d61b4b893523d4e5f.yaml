description: With the support of the Federal Ministry of Education and Research (BMBF),
  the Research Hub Neuroethics (RHUNE) aims to help better connect research in the
  field of neuroethics in Germany, increase its international visibility and provide
  a contact point for policymakers, industry and civil society. On behalf of the University
  of Mannheim, iRights.Lab supports the establishment of a digital information and
  contact centre and facilitates networking activities to improve the integration
  of relevant actors.
