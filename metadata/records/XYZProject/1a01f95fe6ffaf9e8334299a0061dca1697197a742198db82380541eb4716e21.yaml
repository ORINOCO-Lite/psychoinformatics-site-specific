description: Project B05 in SFB 1451 investigates multivariate patterns of associations
  between motor performance and behavioral and brain phenotypes using machine-learning
  approaches. This endeavor builds upon the work in the first funding period demonstrating
  that successful predictions of motor phenotypes primarily reflected learning of
  broader manifolds of individual variation. In the second funding period, these overarching
  dimensions are now identified, characterized, and related to their underlying neurobiology
  in health and diseases. The models build and evaluated by project B05 characterize
  the relationships between different levels of motor performance, socio-demographic,
  neuropsychological and mental health measures, as well multimodal neuroimaging data,
  drawing on the resources collected by Z03 and organized by INF.
