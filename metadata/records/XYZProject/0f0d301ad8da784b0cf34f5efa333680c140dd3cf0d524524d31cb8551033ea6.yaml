description: BRAINTREE investigates the ethical aspects of machine learning-based
  brain age estimation. Conveniently, the difference between estimated brain age and
  chronological age – the brain age gap – is generally interpreted as relevant to
  individuals’ health and as an indicator of disease progression. A growing body of
  evidence supports the potential utility of brain age for diagnosis, prognosis and
  as a tool for monitoring treatment. However, there are still significant ethical
  and interpretative questions that remain unanswered. The BrainTree project aims
  to systematically address these outstanding questions in order to provide an ethical
  framework for clinically relevant applications of brain age estimates. The consortium
  project comprises three work packages, each led by a different partner. Forschungszentrum
  Jülich acts as coordinator and leads Work Package 3.
