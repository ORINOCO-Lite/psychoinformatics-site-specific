description: The ONCOverse project addresses the inadequate and often delayed care
  provided to patients with pancreatic cancer, an oncological emergency. At its core
  is the development of a nationwide, interoperable digital platform that systematically
  records tumour, host and clinical course data and connects stakeholders from the
  fields of healthcare, research and the patient perspective. By integrating modern
  diagnostics, wearables, patient reports and AI-based analyses, the aim is to gain
  a better understanding of individual disease progression and to personalise treatment
  decisions. ONCOverse also promotes patient-centred involvement, facilitates access
  to expertise and clinical trials, and supports the implementation of new technologies
  in an ethical and user-centred manner. The aim is to bring about a paradigm shift
  towards data-driven, precision medicine-based and comprehensively standardised care
  for patients with pancreatic cancer.
