description: 'The T‑CARE consortium will reproduce three complementary rodent models
  of autoimmune limbic encephalitis (ALE) and Rasmussen’s encephalitis (RE) across
  independent epileptology and neuroimmunology labs, run parallel blinded experiments
  without and with modified non‑mitogenic/non‑depleting/non‑Fc‑binding anti‑CD3 antibodies
  (mouse 145‑2C11; rat G4.18), and harmonize SOPs to capture standardized clinical,
  electrophysiological, imaging, histological and immunophenotyping readouts. By validating
  model signatures against human ALE/RE tissue and comparing preventive versus therapeutic
  dosing and routes (i.v., i.n., i.p.), the project seeks to define causal links between
  T cell–driven antigen presentation, IFN‑γ/STAT1/CCL2‑mediated recruitment of phagocytes,
  synaptic stripping, neurodegeneration and epileptogenesis, and to identify robust
  paraclinical biomarkers (exhausted vs regulatory T cell fractions, MRI, EEG, histology)
  of treatment effect.


  Translationally, the consortium aims to demonstrate that anti‑CD3 immunomodulation
  induces exhaustion/apoptosis of autoreactive T cells and expands regulatory T cells
  to reduce immune‑mediated neuronal injury, seizure burden, and the development of
  chronic focal epilepsy; success will generate a multimodal, FAIR‑aligned preclinical
  dataset supporting orphan‑designation applications and rapid initiation of clinical
  proof‑of‑concept trials to repurpose agents such as teplizumab or foralumab for
  AEAE. Projected outputs include reproducible multicenter preclinical evidence, open‑science
  dissemination (open‑access publications, society platforms, symposia, patient engagement)
  and structured pathways for industry and regulatory engagement toward clinical development.'
