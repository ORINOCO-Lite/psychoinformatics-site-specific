description: The project aims (1) to investigate the extent to which geometric attributes
  of brain structures capture individual-level information and (2) to enhance the
  interpretability of mathematical descriptors, particularly the Laplace-Beltrami
  operator (LBO) spectrum or LB Shape Descriptor (LBSD), in order to gain novel insights
  into the brain's geometry and its relation to individual characteristics.
