description: 'The Joint Lab (JL) Supercomputing and Modeling for the Human Brain (SMHB)
  addresses key issues regarding the analysis, simulation and visualization of extremely
  large and complex data sets derived from the human brain, and thus will contribute
  to solving the scientific, societal and technical challenges of the digitization.
  The highly interdisciplinary character of the SMHB will leverage synergy potentials
  at the interface of supercomputing, machine learning, neuroscience and brain medicine. '
