description: This first distribits meeting took place in 2024 in Düsseldorf (Germany)
  at Haus der Universität. The aim of the meeting was to bring together enthusiasts
  of tools and workflows in the domain of distributed data. It was organized by the
  people behind the git-annex and DataLad projects. The event comprised a two-day
  conference and an additional hackathon day.
