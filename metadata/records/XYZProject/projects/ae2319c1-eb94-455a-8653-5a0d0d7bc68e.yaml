description: The project investigates how age-dependent modulation of microglial network
  states influences excitability and connectivity in the thalamocortical system, a
  key centre for sensorimotor integration in multiple sclerosis (MS). Using animal
  models, human tissue, co-cultures and large patient datasets, we are analysing immune-glia-neuron
  interactions at multiple levels. The aim is to identify molecular and network-based
  signatures that explain MS progression and clinical heterogeneity and pave the way
  for new therapies.
