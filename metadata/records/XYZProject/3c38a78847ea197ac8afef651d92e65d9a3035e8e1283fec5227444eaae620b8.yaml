description: 'This project brings together a team of researchers from various German
  universities to identify transdiagnostic biosignatures of aggressive behavior to
  enable more specific prevention and treatment. A longitudinal, developmental, multidimensional,
  transdiagnostic approach is applied to address three primary objectives: 1) transdiagnostic
  characterization of agression, 2) multilevel mechanistic understanding of biosignatures
  of aggression, and 3) investigation of the developmental and longitudinal stability
  of aggression in mental disorders.'
