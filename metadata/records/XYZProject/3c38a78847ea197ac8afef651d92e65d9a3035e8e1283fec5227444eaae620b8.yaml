  description: '[Forschungszentrum Jülich](https://www.fz-juelich.de/en) (FZJ) is
    a German national research institution that pursues interdisciplinary research
    in the fields of energy, information, and bioeconomy. It operates a broad range
    of research infrastructures like supercomputers, an atmospheric simulation chamber,
    electron microscopes, a particle accelerator, cleanrooms for nanotechnology, among
    other things. As a member of the [Helmholtz Association](https://www.helmholtz.de/en)
    with roughly 6,800 employees in ten institutes and 80 subinstitutes, Jülich is
    one of the largest research institutions in Europe.nnFZJ collaborates with [RWTH
    Aachen](https://www.rwth-aachen.de/) within JARA-BRAIN, one of five divisions
    of the [Jülich Aachen Research Alliance](https://www.jara.org/en/) (JARA). In
    JARA-BRAIN, researchers of RWTH and FZJ have joined forces to work on improving
    the diagnosis and treatment of mental and neurological disorders. JARA-BRAIN is
    dedicated to improving the translational aspect of neuropsychiatric research.'
