description: As part of its Programme-oriented Funding (PoF), the Helmholtz Association
  does not invest its resources in individual institutions, but rather in cross-centre
  research programmes that address the major societal challenges of our time. These
  programmes and their scientific questions are divided into thematical units ("Topics").
  The fifth period of programme-oriented funding (PoF V) is running from 2028-2034.
