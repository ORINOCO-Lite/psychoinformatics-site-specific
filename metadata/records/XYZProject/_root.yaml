attributes:
- predicate: foaf:homepage
  schema_type: dlthings:AttributeSpecification
  value: https://www.psychoinformatics.de
description: 'We develop open, reproducible tools and datasets to advance computational
  neuroscience and psychological research. Our projects create and maintain software
  for distributed data-versioning and provenance, stable neuroimaging platforms, and
  analysis/data-format libraries, while also curating large, shareable naturalistic
  neuroimaging and behavioral datasets. We prioritize FAIR principles, provenance
  capture, and decentralized research-data management.


  Our goal is to make complex neuroimaging and behavioral data easier to discover,
  access, reproduce, and reuse across labs by integrating data, code, and workflows.
  Through tool development, open data releases, and methodological research, we aim
  to improve replicability in cognitive and brain sciences and to lower the technical
  barriers for collaborative, large-scale computational studies.'
