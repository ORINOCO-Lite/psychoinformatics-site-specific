description: The I-CHECK-HEART collaborative project is developing an AI-powered app
  for cardio-oncological follow-up care for cancer patients being treated with immune
  checkpoint inhibitors. The aim is to detect cardiovascular side effects at an early
  stage and to better assess individual risk using a data-driven risk score. To achieve
  this, data from smartwatches, sensors, questionnaires, as well as clinical and laboratory
  tests, are combined and analysed using machine learning. The resulting risk score
  is presented using an easy-to-understand traffic-light system, integrated into the
  electronic health record and guides risk-adapted follow-up care. At the same time,
  the app enhances patients’ health literacy, self-management and quality of life,
  whilst relieving pressure on the healthcare system through more efficient follow-up
  processes.
