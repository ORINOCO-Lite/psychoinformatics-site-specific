description: This project aims to improve our understanding of neurotransmitter system
  development in the human brain, especially in children and adolescents with attention-deficit/hyperactivity
  disorder (ADHD) and autism spectrum disorder (ASD). By combining non-invasive brain
  imaging with normative modeling, the project investigates typical and atypical developmental
  trajectories of neurotransmitter systems, potentially paving the way for new diagnostic
  and therapeutic strategies in neurodevelopmental disorders.
