  description: DataLad is a free and open source software for data version control
    and provenance tracking. DataLad tracks files, agnostic of data formats or sizes,
    and provides transport logistics to distribute and retrieve these data - if needed,
    using encryption and credentials. Therefore, it is an ideal tool to manage and
    publish your own data, or to obtain others shared data. While DataLad does not
    store data, it integrates with various storage services, from local hardware to
    university infrastructure to commercial cloud provider. In addition, it provides
    utilities for linking datasets, associating them with software containers, and
    running computationally reproducible data analyses. By capturing structured provenance
    records, DataLad allows to easily rerun and reproducible results.
