description: The ABCD-J platform provides an integrated collection and analysis environment
  for digital biomarkers & mobile health in North Rhine-Westphalia. The overarching
  goal of ABCD-J is to elevate existing technical solutions for research practice
  adoption. To this end, we develop interoperable technologies JTrack (https://jtrack.readthedocs.io),
  DataLad (https://www.datalad.org, and julearn (https://juaml.github.io/julearn/main/index.html)
  for data collection, data management and machine learning-based data analysis. From
  the social perspective, the ABCD-J project aims to promote and facilitate collaboration
  between multiple research centers, while from the technical perspective the project
  will accelerate research through homogenization of workflows and processes, with
  particular emphasis on digital biomarker development.
