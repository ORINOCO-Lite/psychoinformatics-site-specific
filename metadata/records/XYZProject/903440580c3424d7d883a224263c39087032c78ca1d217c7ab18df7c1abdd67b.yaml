description: The NAViStem3D project examines the ethical, epistemological, and societal
  issues surrounding neural organoids—that is, three-dimensional brain models derived
  from human stem cells. These organoids offer great potential for research into brain
  development and diseases such as Alzheimer’s and autism, but at the same time raise
  questions about moral status, data protection, and risks to donors.
