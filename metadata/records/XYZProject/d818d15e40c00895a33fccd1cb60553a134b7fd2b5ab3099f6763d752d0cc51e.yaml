description: The VINNIE project develops a blended therapy approach for children aged
  7 to 12, which combines digital learning resources with a smart therapeutic toy.
  Via an online platform, the children work alongside a virtual character to learn
  about their condition and develop coping strategies designed to help them in everyday
  life. These strategies are transferred to a smart soft toy, which offers practical
  support in stressful situations and uses biofeedback (e.g. heart rate variability)
  to visualise learning progress. Supported by neuroethical expertise, the aim is
  to create effective, practical and potentially transdiagnostic support for psychosomatic,
  anxiety and obsessive-compulsive disorders.
