description: Das Forschungsprojekt zielt darauf ab, die Organisation der Neurochemie
  im Gehirn von Menschen und Makaken durch die Charakterisierung von Neurotransmitter-Rezeptorsystemen
  zu untersuchen. Der Fokus liegt auf der Identifizierung potenzieller evolutionärer
  Trade-offs, die durch eine spezielle Dimensionalitätsreduktionstechnik namens ParTI
  entdeckt werden sollen. Ziel ist es, Einblicke in neurologische und psychiatrische
  Störungen zu gewinnen und die Erkenntnisse durch multimodale Bildgebung, Verhaltensdaten
  und Genexpressionsdaten zu validieren, wobei auch interspezifische Vergleiche zwischen
  Menschen und Makaken vorgenommen werden, um evolutionäre Unterschiede zu identifizieren.
