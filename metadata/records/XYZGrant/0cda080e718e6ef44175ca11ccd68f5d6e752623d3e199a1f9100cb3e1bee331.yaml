description: Das Verbundprojekt I-CHECK-HEART entwickelt eine KI-gestützte App zur
  kardio-onkologischen Nachsorge von Krebspatient:innen, die mit Immuncheckpoint-Inhibitoren
  behandelt werden. Ziel ist es, kardiovaskuläre Nebenwirkungen frühzeitig zu erkennen
  und das individuelle Risiko mithilfe eines datenbasierten Risikoscores besser einzuschätzen.
  Dafür werden Smartwatch-, Sensor-, Fragebogen- sowie klinische und Labor­daten kombiniert
  und mittels maschinellen Lernens ausgewertet. Der resultierende Risikoscore wird
  in einem verständlichen Ampelsystem dargestellt, in die elektronische Patientenakte
  integriert und steuert eine risikoadaptierte Nachsorge. Gleichzeitig stärkt die
  App die Gesundheitskompetenz, das Selbstmanagement und die Lebensqualität der Patient:innen
  und entlastet das Gesundheitssystem durch effizientere Nachsorgeprozesse.
