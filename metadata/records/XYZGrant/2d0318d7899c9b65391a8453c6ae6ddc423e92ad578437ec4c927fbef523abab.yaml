description: Das Projekt B05 untersucht multivariate Muster der Assoziationen zwischen
  motorischer Leistung und Verhaltens- und Gehirnphänotypen mit Hilfe von Machine-Learning-Ansätzen.
  Dieses Vorhaben baut auf der Arbeit der ersten Förderperiode auf, die gezeigt hat,
  dass erfolgreiche Vorhersagen von motorischen Phänotypen in erster Linie auf das
  Erlernen breiter gefächerter individueller Variationen zurückzuführen sind. Im Rahmen
  der zweiten Förderperiode werden diese übergreifenden Dimensionen nun identifiziert,
  charakterisiert und mit der ihnen zugrunde liegenden Neurobiologie bei Gesundheit
  und Krankheit in Verbindung gebracht. Die vom Projekt B05 erstellten und ausgewerteten
  Modelle charakterisieren die Beziehungen zwischen verschiedenen Ebenen der motorischen
  Leistung, soziodemografischen, neuropsychologischen und psychiatrischen Informationen
  sowie multimodalen Neuroimaging-Daten und stützen sich dabei auf die von Z03 gesammelten
  und von INF organisierten Ressourcen.
