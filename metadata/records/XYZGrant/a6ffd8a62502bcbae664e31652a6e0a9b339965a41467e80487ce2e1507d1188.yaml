description: Das Projekt NAViStem3D untersucht die ethischen, epistemischen und gesellschaftlichen
  Fragen rund um neuronale Organoide, also dreidimensionale Gehirnmodelle aus menschlichen
  Stammzellen. Diese Organoide bieten großes Potenzial für die Erforschung von Gehirnentwicklung
  und Erkrankungen wie Alzheimer oder Autismus, werfen aber zugleich Fragen nach moralischem
  Status, Datenschutz und Risiken für Spender:innen auf. Ein interdisziplinäres Konsortium
  entwickelt zunächst eine differenzierte Typologie neuronaler Organoide und bewertet
  darauf aufbauend systematisch deren Nutzen und Risiken. Darauf basierend wird ein
  praxisnaher, ethisch und rechtlich fundierter Code of Conduct für Forschung, Regulierung
  und gesellschaftlichen Umgang mit Organoiden erarbeitet. Ziel ist es, realistische
  Erwartungen an die Technologie zu fördern, verantwortungsvolle Leitlinien bereitzustellen
  und den Dialog zwischen Wissenschaft, Politik und Öffentlichkeit zu stärken.
