description: Projekt B06 untersucht die neuralen Mechanismen von fehler- und belohnungs-basiertem
  motorischen Adaptationslernen von Greifbewegungen im menschlichen Gehirn. Mit Hilfe
  aufgabenbasierter funktioneller Magnetresonanztomographie (fMRT) und der Analyse
  effektiver Konnektivität wird die Interaktion kortiko-basalganglien-zerebellärer
  Netzwerke während motorischer Adaptation mit und ohne monetäre Belohnung erforscht.
  Der Einschluss von Menschen verschiedenen Alters und die longitudinale Untersuchung
  von Schlaganfallpatienten ermöglicht uns, den Einfluss von Alterungsprozessen und
  erhöhter motorischer Plastizität nach einem Schlaganfall auf diese Netzwerkinteraktionen
  zu untersuchen.
