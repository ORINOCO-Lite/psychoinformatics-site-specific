description: Dieses Projekt zielt darauf ab, die Entwicklung von Neurotransmittersystemen
  im menschlichen Gehirn besser zu verstehen – insbesondere bei Kindern und Jugendlichen
  mit Aufmerksamkeitsdefizit-/Hyperaktivitätsstörung (ADHS) und Autismus-Spektrum-Störung
  (ASS). Durch die Kombination nicht-invasiver Bildgebungsverfahren mit Normwertmodellen
  soll untersucht werden, wie sich typische und atypische Entwicklungsverläufe von
  Neurotransmittersystemen unterscheiden, um neue Wege für Diagnose und Therapie neuroentwicklungsbedingter
  Störungen zu eröffnen.
