description: 'Dieses Projekt untersucht die Wahrnehmung und neuronale Repräsentation
  von Primärverstärkern (Geschmack), deren visuelle Pendants (Sekundärverstärker)
  und deren (in)kongruente Kombination im menschlichen Gehirn. Ziele sind: (1) Identifikation
  der motivationalen, hedonischen und katego-riespezifischen (süß, sauer etc.) Repräsentationen
  von Primärverstärkern, (2) Identifikation des Einflusses von Sekundärverstärken
  auf diese Repräsentationen und (3) Identifikation der Effekte von neuen und überlernten
  visuogustatorischen Kombinationen und deren funktionales Zusammenspiel mit univariaten
  fMRT-Analysen, Konnektivatitäts-, Klassifikationsanalysen und Hyperalignment.'
