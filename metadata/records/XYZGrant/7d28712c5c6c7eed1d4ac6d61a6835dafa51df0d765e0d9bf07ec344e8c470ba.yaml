description: Das Projekt VINNIE adressiert den steigenden Bedarf an psychotherapeutischer
  Unterstützung für Kinder mit psychosomatischen Beschwerden während langer Wartezeiten
  auf eine stationäre Behandlung. Es entwickelt einen Blended-Therapy-Ansatz für Kinder
  im Alter von 7 bis 12 Jahren, der digitale Lernangebote mit einem intelligenten
  Therapiespielzeug kombiniert. Über eine Online-Plattform erlernen die Kinder gemeinsam
  mit einem virtuellen Charakter Krankheitsverständnis und Bewältigungsstrategien,
  die im Alltag helfen sollen. Diese Strategien werden auf ein smartes Kuscheltier
  übertragen, das in belastenden Situationen konkrete Hilfen anbietet und über Biofeedback
  (z. B. Herzratenvariabilität) Lernerfolge sichtbar macht. Begleitet durch neuroethische
  Expertise soll so eine wirksame, alltagsnahe und potenziell transdiagnostische Unterstützung
  für psychosomatische, angst- und zwangsspezifische Störungen geschaffen werden.
