description: A Behavioral Experimental Paradigm in which, in at least one of the conditions,
  Subjects view various visual stimuli and make no response. Stimuli include houses,
  faces, objects, fractals, letter strings, line drawings, complex scenes, etc. If
  the presented stimuli were faces, the experiments are co-coded with Face Monitor/Discrimination.
name: Passive Viewing Paradigm
