description: A Behavioral Experimental Paradigm in which, in at least one of the conditions,
  Subjects are presented with human faces and are instructed to view them passively
  or discriminate according to their order, gender, location, emotion, or appearance.
  If the subjects view the faces passively, then the experiment is NOT co-coded with
  Passive Viewing.
name: Face Monitor or Discrimination Paradigm
