description: A web page is an online document available (at least initially) on the
  world wide web. A web page is written first and foremost to appear on the web, as
  distinct from other online resources such as books, manuscripts or audio documents
  which use the web primarily as a distribution mechanism alongside other more traditional
  methods such as print.
