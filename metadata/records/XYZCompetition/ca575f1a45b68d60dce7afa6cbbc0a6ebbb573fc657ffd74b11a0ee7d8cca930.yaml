description: 'Helmholtz Imaging invites researchers across the Helmholtz Association
  to submit proposals for the Helmholtz Imaging Project Call 2026. The call supports
  collaborative, cross-disciplinary research projects that advance imaging science
  and strengthen the connection between imaging and information & data science.


  Researchers from at least two Helmholtz Centers, with optional participation of
  external partners, are encouraged to join forces and develop innovative solutions
  along the imaging pipeline – from data acquisition to knowledge extraction.


  Proposals can be submitted via the Helmholtz Imaging project portal: https://projects.helmholtz-imaging.de/site/index.php'
