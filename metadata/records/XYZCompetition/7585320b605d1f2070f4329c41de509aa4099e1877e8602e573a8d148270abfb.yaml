description: 'KonsortSWD – NFDI4Society is the consortium for the social, behavioral,
  educational

  and economic sciences within the National Research Data Infrastructure (NFDI). Its
  goal is

  to support researchers in research data management (RDM) and to establish RDM as
  an

  integral part of scientific practice.

  To achieve this goal, KonsortSWD supports the further development and integration

  of tools for RDM (software, scripts, workflows, portals, etc.), especially for sensitive
  data,

  as well as the solution of multidisciplinary challenges (multidisciplinary use cases)
  in

  research data management. 1

  We fund projects that contribute to the improvement, expansion or sustainable use
  of RDM

  tools, particularly for sensitive data. The submissions are evaluated according
  to the

  following criteria:

  • Quality of the project, in particular the status of preliminary work (the project
  builds

  on robust preliminary work or already existing mature tools) and connectivity, e.g.
  to

  services of KonsortSWD

  • Robustness of the strategy for setting up and operating the project

  • Appropriateness of the schedule and the requested resources

  • Expected long-term added value for researchers in the social, behavioral, educational

  and economic sciences

  • Contribution to the improvement of research data management for sensitive data

  and/or to the solution of multidisciplinary challenges (multidisciplinary use

  cases) in research data management.

  Applications with innovative approaches to supporting RDM (tools, workflows, etc.),
  e.g. AIbased approaches, are particularly welcome.

  The call is aimed at:

  • Researchers who wish to develop or further develop methods or software for RDM,

  • Infrastructure providers who wish to complement existing services or introduce
  new

  components into NFDI consortia.'
