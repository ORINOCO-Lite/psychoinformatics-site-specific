description: 'The Feodor Lynen Research Fellowship enables researchers at various
  stages of their career to conduct their research abroad in cooperation with a host
  of their choice from the Humboldt Network worldwide.


  Postdocs may apply for a 6- to 24-month fellowship, experienced researchers for
  a 6- to 18-month fellowship that can be split into up to three stays over the course
  of three years.


  Applications are accepted online throughout the year. To ensure timely processing,
  all required documents should be submitted 4 to 7 months before the intended selection
  date.

  The Selection Committee responsible for reviewing applications to this programme
  meets every February, June and October.


  '
