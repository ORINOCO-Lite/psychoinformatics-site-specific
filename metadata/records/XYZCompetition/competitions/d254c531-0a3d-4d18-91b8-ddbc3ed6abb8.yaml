description: 'The NSTC (Taiwan) Research Fellowship supports researchers from Germany
  in conducting a research stay in Taiwan, regardless of discipline. The Alexander
  von Humboldt Foundation conducts the preselection in Germany, while NSTC (Taiwan)
  funds the recipient’s stay at a university or non-university research institute
  in Taiwan. Any researcher or scholar in Taiwan who has received project funding
  through the National Science and Technology Council (NSTC) is eligible to serve
  as a host.


  Postdocs and experienced researchers up to 12 years after completing their doctorate
  may apply for a 3- to 12-month fellowship. Applications are accepted online throughout
  the year, and to ensure timely processing, all required documents should be submitted
  4 to 7 months before the intended selection date. The Selection Committee responsible
  for reviewing applications meets every February, June, and October.'
