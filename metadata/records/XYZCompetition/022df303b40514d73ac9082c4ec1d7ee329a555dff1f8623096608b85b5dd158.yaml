description: "The programme funds short-term stays of early career researchers, whose\
  \ PhD was completed no more than five years ago (at the time of project start, plus\
  \ accepted break periods e.g. for parental leave). Depending on the partner country,\
  \ different target groups may apply. The aim is to initiate or strengthen bilateral\
  \ research collaborations. DAAD funding is limited exclusively to the German project\
  \ participants, covering mobility expenses, the foreign partner must apply for parallel\
  \ funding in their own country.\n\n \n\nMinimum project team size: On the German\
  \ side, at least two participants must be involved, including at least one early\
  \ career researcher. Applicants are required to hold a PhD. PhD students cannot\
  \ submit an application or act as principal investigators.\n\nApplications must\
  \ be submitted via the DAAD programme website: https://www.daad.de/de/infos-services-fuer-hochschulen/programme-der-projektfoerderung/detail/detail/ppp-joint-research-bilateral-collaboration/?pfp-id=57299799"
