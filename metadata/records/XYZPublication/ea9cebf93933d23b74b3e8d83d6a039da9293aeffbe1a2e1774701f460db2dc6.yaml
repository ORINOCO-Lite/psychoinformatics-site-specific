attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Exposome-wide patterns predict brain health in aging
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Promoting brain health is vital for well-being and reducing healthcare burdens.
    Brain health as measured with the Brain Age Gap (BAG) - the difference between
    chronological and predicted brain age- relates to many factors. However, a holistic
    view, integrating the range of factors an individual brain is exposed to, is missing
    for understanding how the exposome shapes brain health. After computing BAG as
    an indicator of grey matter (GM) health, we predicted it using machine learning
    based on 261 exposome variables (spanning biomedical, environmental, lifestyle,
    socio-affective, and early life domains) in UK Biobank participants. Exposome
    data can predict GM health with factors pertaining to cardiovascular and bone
    health, along with alcohol and smoking, nutrition and diabetes showing greater
    contribution to the prediction. In such domains, life period and duration of exposure
    appeared crucial. These findings call for early prevention in cardiovascular and
    metabolic health to promote life-long brain health. '
