attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Sex classification from functional brain connectivity: Generalization to
    multiple datasets'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Machine learning (ML) approaches are increasingly being applied to neuroimaging
    data. Studies in neuroscience typically have to rely on a limited set of training
    data which may impair the generalizability of ML models. However, it is still
    unclear which kind of training sample is best suited to optimize generalization
    performance. In the present study, we systematically investigated the generalization
    performance of sex classification models trained on the parcelwise connectivity
    profile of either single samples or a compound sample containing data from four
    different datasets. Generalization performance was quantified in terms of mean
    across-sample classification accuracy and spatial consistency of accurately classifying
    parcels. Our results indicate that generalization performance of pwCs trained
    on single dataset samples is dependent on the specific test samples. Certain datasets
    seem to “match” in the sense that classifiers trained on a sample from one dataset
    achieved a high accuracy when tested on the respected other one and vice versa.
    The pwC trained on the compound sample demonstrated overall highest generalization
    performance for all test samples, including one derived from a dataset not included
    in building the training samples. Thus, our results indicate that a big and heterogenous
    training sample comprising data of multiple datasets is best suited to achieve
    generalizable results.
