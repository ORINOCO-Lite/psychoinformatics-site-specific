attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Sex differences in functional cortical organization reflect differences in
    network topology rather than cortical morphometry
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Differences in brain size between the sexes are consistently reported. However,
    the consequences of this anatomical difference on sex differences in intrinsic
    brain function remain unclear. In the current study, we investigate whether sex
    differences in intrinsic cortical functional organization may be associated with
    differences in cortical morphometry, namely different measures of brain size,
    microstructure, and the geodesic distance of connectivity profiles. For this,
    we compute a low dimensional representation of functional cortical organization,
    the sensory-association axis, and identify widespread sex differences. Contrary
    to our expectations, sex differences in functional organization do not appear
    to be systematically associated with differences in total surface area, microstructural
    organization, or geodesic distance, despite these morphometric properties being
    per se associated with functional organization and differing between sexes. Instead,
    functional sex differences in the sensory-association axis are associated with
    differences in functional connectivity profiles and network topology. Collectively,
    our findings suggest that sex differences in functional cortical organization
    extend beyond sex differences in cortical morphometry.
