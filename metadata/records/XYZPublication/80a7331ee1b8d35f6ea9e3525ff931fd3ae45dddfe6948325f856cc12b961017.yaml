attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: The Link between Brain age and Alzheimer’s Disease development using different
    neuroimaging modalities
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Brain age (BA) provides a proxy of general brain health through the prediction
    of chronological age (CA) from neuroimaging data of healthy individuals. During
    aging, the adult brain undergoes changes both on the morphological and metabolic
    level. Here, we compare the link between BA predicted from morphology (structural
    MRI) or metabolism (18F-FDG-PET) and cognitive function, as well as pathophysiological
    measures of Alzheimer’s disease (AD) in cognitively normal individuals (CN) and
    patients with mild cognitive impairment (MCI).
