- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Despite the high clinical burden, little is known about pathophysiology underlying
    autism spectrum disorder(ASD). Recent resting-state functional magnetic resonance
    imaging (rs-fMRI) studies have found atypical synchro-nization of brain activity
    in ASD. However, no consensus has been reached on the nature and clinical relevance
    ofthese alterations. Here, we addressed these questions in four large ASD cohorts.
    Using rs-fMRI, we identified func-tional connectivity alterations associated with
    ASD. We tested for associations of these imaging phenotypes withclinical and demographic
    factors such as age, sex, medication status, and clinical symptom severity. Our
    resultsshowed reproducible patterns of ASD-associated functional hyper- and hypoconnectivity.
    Hypoconnectivity wasprimarily restricted to sensory-motor regions, whereas hyperconnectivity
    hubs were predominately located inprefrontal and parietal cortices. Shifts in
    cortico-cortical between-network connectivity from outside to withinthe identified
    regions were shown to be a key driver of these abnormalities. This reproducible
    pathophysiologicalphenotype was partially associated with core ASD symptoms related
    to communication and daily living skills andwas not affected by age, sex, or medication
    status. Although the large effect sizes in standardized cohorts areencouraging
    with respect to potential application as a treatment and for patient stratification,
    the moderate linkto clinical symptoms and the large overlap with healthy controls
    currently limit the usability of identified altera-tions as diagnostic or efficacy
    readout.
