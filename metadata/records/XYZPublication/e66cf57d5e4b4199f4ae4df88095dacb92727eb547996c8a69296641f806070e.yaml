- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: <p>This component contains the data of the analysis that we ran as a validation
    of the annotation of speech spoken in the research cut (Hanke et al., 2016) of
    the movie "Forrest Gump" (Zemeckis, 1994) and its audio-description. The corresponding
    paper is hosted on github (https://github.com/psychoinformatics-de/studyforrest-paper-speechannotation)&nbsp;and
    published in f1000research (https://doi.org/10.12688/f1000research.27621.1).</p>
