attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Neural correlates of affective control regions induced by common therapeutic
    strategies in major depressive disorders: An activation likelihood estimation
    meta-analysis study'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: In major depressive disorder (MDD), not only the pathophysiology of this
    disease is unknown but also the mechanisms of clinical efficacy across its therapeutic
    strategies are unclear. Although neuroimaging studies adopted activation likelihood
    estimation (ALE) approach to identify the convergent abnormalities of human brain
    in the MDD patients, the common alterations after antidepressant therapies were
    not summarized. Thus, we extracted the coordinates of brain regions in the MDD
    patients that showed differences in resting-state function, gray matter morphometry,
    and task-evoked neuronal responses after therapies. The ALE algorithm (GingerALE2.0.3)
    was employed in all 53 studies (64 experiments with 1406 MDD patients). Consistent
    results across treatment therapies were reported in the affective control network,
    including the bilateral thalamus, bilateral amygdala/parahippocampal gyrus, right
    anterior cingulate cortex/middle frontal gyrus, and right insular cortex/claustrum.
    Only electroconvulsive therapy partially replicated above findings. Our results
    indicate the antidepressant therapies efficiently influence core structures of
    the affective control network, which might be the underlying mechanism of remission
    in depression and provides potential targets for further treatment strategies.
