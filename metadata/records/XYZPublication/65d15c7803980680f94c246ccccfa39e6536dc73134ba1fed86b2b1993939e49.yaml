attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Comparison of different group-level templates in gradient-based multimodal
    connectivity analysis
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The study of large-scale brain connectivity is increasingly adopting unsupervised
    approaches that derive low-dimensional spatial representations from high-dimensional
    connectomes, referred to as gradient analysis. When translating this approach
    to study interindividual variations in connectivity, one technical issue pertains
    to the selection of an appropriate group-level template to which individual gradients
    are aligned. Here, we compared different group-level template construction strategies
    using functional and structural connectome data from neurotypical controls and
    individuals with autism spectrum disorder (ASD) to identify between-group differences.
    We studied multimodal magnetic resonance imaging data obtained from the Autism
    Brain Imaging Data Exchange (ABIDE) Initiative II and the Human Connectome Project
    (HCP). We designed six template construction strategies that varied in whether
    (1) they included typical controls in addition to ASD; or (2) they mapped from
    one dataset onto another. We found that aligning a combined subject template of
    the ASD and control subjects from the ABIDE Initiative onto the HCP template exhibited
    the most pronounced effect size. This strategy showed robust identification of
    ASD-related brain regions for both functional and structural gradients across
    different study settings. Replicating the findings on focal epilepsy demonstrated
    the generalizability of our approach. Our findings will contribute to improving
    gradient-based connectivity research.
