attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Predicting Hair Cortisol and Cortisone Concentration in Postpartum Women
    through Repeated Measurements of Perceived Stress
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: To investigate whether hair cortisol (HCC) and hair cortisone (HCNC) can
    be predicted by repeated stress reports from postpartum women in different mental
    health conditions (non-depressed, ND, adjustment disorder, AD, postpartum depression,
    PPD), 240 mothers (mean age 31.8 years; SD = 4.7) were monitored from within 1
    to 6 days of childbirth over a period of three months. HCC and HCNC in 3 cm hair
    samples were assessed via triple mass spectrometry after liquid chromatographic
    separation. Every second day, participants reported their stress levels online.
    The summed perceived stress scores were not found to be predictive of HCC. However,
    perceived stress predicted a decrease in HCNC (rSpearman = -0.153, p = 0.035)
    and an increase in the HCC/HCNC ratio (rSpearman = 0.304, p < 0.001) in the ND
    group. With AD in the first few weeks after childbirth, an inverse effect appeared
    for HCNC (rSpearman = 0.318, p = 0.011), suggesting an overall downregulation
    of the HPA axis owing to the stressful experience of adjusting to the new situation.
    No effects were found for mothers developing PPD. The indirect results of HPA-axis
    activity are better indicators of the experience of psychological stress in postpartum
    women than the absolute HCC value.
