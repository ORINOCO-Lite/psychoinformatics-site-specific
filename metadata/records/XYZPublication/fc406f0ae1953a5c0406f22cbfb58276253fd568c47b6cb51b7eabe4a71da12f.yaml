attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Predicting Mental and Neurological Illnesses Based on Cerebellar Normative
    Features
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: BackgroundMental and neurological conditions have been linked to structural
    brain variations. However, aside from dementia, the value of brain structural
    characteristics derived from brain scans for prediction is relatively low. One
    reason for this limitation is the clinical and biological heterogeneity inherent
    to such conditions. Recent studies have implicated aberrations in the cerebellum,
    a relatively understudied brain region, in these clinical conditions.MethodsHere,
    we used machine learning to test the value of individual deviations from normative
    cerebellar development across the lifespan (based on trained data from >27,000
    participants) for prediction of autism spectrum disorder (ASD) (n = 317), bipolar
    disorder (n = 238), schizophrenia (SZ) (n = 195), mild cognitive impairment (n
    = 122), and Alzheimer's disease (n = 116); individuals without diagnoses were
    matched to the clinical cohorts. We applied several atlases and derived median,
    variance, and percentages of extreme deviations within each region of interest.ResultsThe
    results show that lobular and voxelwise cerebellar data can be used to discriminate
    reference samples from individuals with ASD and SZ with moderate accuracy (the
    area under the receiver operating characteristic curves ranged from 0.56 to 0.65).
    Contributions to these predictive models originated from both anterior and posterior
    regions of the cerebellum.ConclusionsOur study highlights the utility of cerebellar
    normative modeling in predicting ASD and SZ, aided by 4 cerebellar atlases that
    enhanced the interpretability of the findings.
