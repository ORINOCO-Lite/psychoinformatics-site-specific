  value: Whole-brain structural connectome asymmetry in autism
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Autism spectrum disorder is a common neurodevelopmental condition that manifests
    as a disruption in sensory and social skills. Although it has been shown that
    the brain morphology of individuals with autism is asymmetric, how this differentially
    affects the structural connectome organization of each hemisphere remains under-investigated.
    We studied whole-brain structural connectivity-based brain asymmetry in individuals
    with autism using diffusion magnetic resonance imaging obtained from the Autism
    Brain Imaging Data Exchange initiative. By leveraging dimensionality reduction
    techniques, we constructed low-dimensional representations of structural connectivity
    and calculated their asymmetry index. Comparing the asymmetry index between individuals
    with autism and neurotypical controls, we found atypical structural connectome
    asymmetry in the sensory and default-mode regions, particularly showing weaker
    asymmetry towards the right hemisphere in autism. Network communication provided
    topological underpinnings by demonstrating that the inferior temporal cortex and
    limbic and frontoparietal regions showed reduced global network communication
    efficiency and decreased send-receive network navigation in the inferior temporal
    and lateral visual cortices in individuals with autism. Finally, supervised machine
    learning revealed that structural connectome asymmetry could be used as a measure
    for predicting communication-related autistic symptoms and nonverbal intelligence.
    Our findings provide insights into macroscale structural connectome alterations
    in autism and their topological underpinnings.
