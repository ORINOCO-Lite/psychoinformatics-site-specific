- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'This dataset contains the data supporting the findings of the manuscript
    ''Assessment of neurotransmitter-related structural brain changes in borderline
    personality disorder: an MRI study''. The dataset includes clinical measures,
    gray matter (GM) measures derived from voxel-based morphometry analyses, and measures
    of spatial correlation between GM maps and PET/SPECT-derived neurotransmitter
    atlases using the JuSpace toolbox. Structural MRI data were processed using standard
    pipelines implemented in SPM12 and CAT12.  Reuse notes. The data can be reused
    for secondary analyses, meta-analyses, or methodological validation studies, provided
    that appropriate citation of the original manuscript and/or this dataset is given.'
description: 'This dataset contains the data supporting the findings of the manuscript
  ''Assessment of neurotransmitter-related structural brain changes in borderline
  personality disorder: an MRI study''. The dataset includes clinical measures, gray
  matter (GM) measures derived from voxel-based morphometry analyses, and measures
  of spatial correlation between GM maps and PET/SPECT-derived neurotransmitter atlases
  using the JuSpace toolbox. Structural MRI data were processed using standard pipelines
  implemented in SPM12 and CAT12.  Reuse notes. The data can be reused for secondary
  analyses, meta-analyses, or methodological validation studies, provided that appropriate
  citation of the original manuscript and/or this dataset is given.'
