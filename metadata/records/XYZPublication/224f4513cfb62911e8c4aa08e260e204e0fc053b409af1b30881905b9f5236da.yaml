attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Combining lifestyle risks to disentangle brain structure and functional connectivity
    differences in older adults
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Lifestyle contributes to inter-individual variability in brain aging, but
    previous studies focusedon the effects of single lifestyle variables. Here, we
    studied the combined and individualcontributions of four lifestyle variables -
    alcohol consumption, smoking, physical activity,and social integration - to brain
    structure and functional connectivity in a population-basedcohort of 549 older
    adults. A combined lifestyle risk score was associated with decreasedgyrification
    in left premotor and right prefrontal cortex, and higher functional connectivityto
    sensorimotor and prefrontal cortex. While structural differences were driven by
    alcoholconsumption, physical activity, and social integration, higher functional
    connectivity wasdriven  by  smoking.  Results  suggest  that  combining  differentially  contributing  lifestylevariables
    may be more than the sum of its parts. Associations generally were neither alteredby
    adjustment for genetic risk, nor by depressive symptomatology or education, underliningthe
    relevance of daily habits for brain health.
