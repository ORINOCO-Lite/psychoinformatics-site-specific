attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Inter-subject and inter-parcellation variability of resting-state whole-brain
    dynamical modeling
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Modern approaches to investigate complex brain dynamics suggest to represent
    the brain as a functional network of brain regions defined by a brain atlas, while
    edges represent the structural or functional connectivity among them. This approach
    is also utilized for mathematical modeling of the resting-state brain dynamics,
    where the applied brain parcellation plays an essential role in deriving the model
    network and governing the modeling results. There is however no consensus and
    empirical evidence on how a given brain atlas affects the model outcome, and the
    choice of parcellation is still rather arbitrary. Accordingly, we explore the
    impact of brain parcellation on inter-subject and inter-parcellation variability
    of model fitting to empirical data. Our objective is to provide a comprehensive
    empirical evidence of potential influences of parcellation choice on resting-state
    whole-brain dynamical modeling. We show that brain atlases strongly influence
    the quality of model validation and propose several variables calculated from
    empirical data to account for the observed variability. A few classes of such
    data variables can be distinguished depending on their inter-subject and inter-parcellation
    explanatory power.
