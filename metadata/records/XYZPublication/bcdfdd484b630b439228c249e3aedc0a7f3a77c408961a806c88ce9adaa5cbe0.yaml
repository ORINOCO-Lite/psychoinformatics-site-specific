attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Simulated brain networks reflecting progression of Parkinson’s disease
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Neurodegenerative progression of Parkinson’s disease affects brain structure
    and function and, concomitantly, alters topological properties of brain networks.
    The network alteration accompanied with motor impairment and duration of the disease
    is not yet clearly demonstrated in the disease progression. In this study, we
    aim at resolving this problem with a modeling approach based on large-scale brain
    networks from cross-sectional MRI data. Optimizing whole-brain simulation models
    allows us to discover brain networks showing unexplored relationships with clinical
    variables. We observe that simulated brain networks exhibit significant differences
    between healthy controls (n=51) and patients with Parkinson’s disease (n=60) and
    strongly correlate with disease severity and disease duration of the patients.
    Moreover, the modeling results outperform the empirical brain networks in these
    clinical measures. Consequently, this study demonstrates that utilizing simulated
    brain networks provides an enhanced view on network alterations in the progression
    of motor impairment and potential biomarkers for clinical indices.
