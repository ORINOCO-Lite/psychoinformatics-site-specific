attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Relationship Between Prediction Accuracy and Feature Importance Reliability:
    an Empirical and Theoretical Study'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: There is significant interest in using neuroimaging data to predict behavior.
    The predictive models are often interpreted by the computation of feature importance,
    which quantifies the predictive relevance of an imaging feature. Tian and Zalesky
    (2021) suggest that feature importance estimates exhibit low split-half reliability,
    as well as a trade-off between prediction accuracy and feature importance reliability
    across parcellation resolutions. However, it is unclear whether the trade-off
    between prediction accuracy and feature importance reliability is universal. Here,
    we demonstrate that, with a sufficient sample size, feature importance (operationalized
    as Haufe-transformed weights) can achieve fair to excellent split-half reliability.
    With a sample size of 2600 participants, Haufe-transformed weights achieve average
    intra-class correlation coefficients of 0.75, 0.57 and 0.53 for cognitive, personality
    and mental health measures respectively. Haufe-transformed weights are much more
    reliable than original regression weights and univariate FC-behavior correlations.
    Original regression weights are not reliable even with 2600 participants. Intriguingly,
    feature importance reliability is strongly positively correlated with prediction
    accuracy across phenotypes. Within a particular behavioral domain, there is no
    clear relationship between prediction performance and feature importance reliability
    across regression models. Furthermore, we show mathematically that feature importance
    reliability is necessary, but not sufficient, for low feature importance error.
    In the case of linear models, lower feature importance error is mathematically
    related to lower prediction error. Therefore, higher feature importance reliability
    might yield lower feature importance error and higher prediction accuracy. Finally,
    we discuss how our theoretical results relate with the reliability of imaging
    features and behavioral measures. Overall, the current study provides empirical
    and theoretical insights into the relationship between prediction accuracy and
    feature importance reliability.
