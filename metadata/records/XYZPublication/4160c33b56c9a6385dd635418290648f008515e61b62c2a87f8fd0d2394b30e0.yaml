attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: The many dimensions of human hippocampal organization and (dys)function
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Magnetic resonance imaging–based parcellation of the hippocampal formation
    and gradient mapping are data-driven techniques that can capture many dimensions
    of hippocampal organization and provide readily usable outcomes.    Features of
    cortical architecture, such as local connectivity and microstructure, reveal differentiation
    within the hippocampal formation along the medial–lateral axis. This organizational
    dimension seemingly reflects local information-processing organization.    Neuroimaging
    markers tapping into hippocampal integration into large-scale networks (i.e.,
    whole-brain connectivity) highlight the long-axis differentiation.    The long-axis
    organization corresponds to a molecular gradient and differential integration
    across distinct behavioral systems.    Capitalizing on gradients and parcellations
    maps, the long-axis organization of the hippocampal formation can be related to
    behavioral phenotypes in healthy and clinical populations.
