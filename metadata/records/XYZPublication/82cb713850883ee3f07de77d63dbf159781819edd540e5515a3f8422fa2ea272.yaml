  value: Large‐Area Synthesis of Ferromagnetic Fe 5− x GeTe 2 /Graphene van der Waals
    Heterostructures with Curie Temperature above Room Temperature
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Van der Waals (vdW) heterostructures combining layered ferromagnets and other
    2D crystals are promising building blocks for the realization of ultracompact
    devices with integrated magnetic, electronic, and optical functionalities. Their
    implementation in various technologies depends strongly on the development of
    a bottom-up scalable synthesis approach allowing for realizing highly uniform
    heterostructures with well-defined interfaces between different 2D-layered materials.
    It is also required that each material component of the heterostructure remains
    functional, which ideally includes ferromagnetic order above room temperature
    for 2D ferromagnets. Here, it is demonstrated that the large-area growth of Fe5−xGeTe2/graphene
    heterostructures is achieved by vdW epitaxy of Fe5−xGeTe2 on epitaxial graphene.
    Structural characterization confirms the realization of a continuous vdW heterostructure
    film with a sharp interface between Fe5−xGeTe2 and graphene. Magnetic and transport
    studies reveal that the ferromagnetic order persists well above 300 K with a perpendicular
    magnetic anisotropy. In addition, epitaxial graphene on SiC(0001) continues to
    exhibit a high electronic quality. These results represent an important advance
    beyond nonscalable flake exfoliation and stacking methods, thus marking a crucial
    step toward the implementation of ferromagnetic 2D materials in practical applications.
