  value: 'Code for Science: Bessere Forschung durch bessere Forschungssoftwarekompetenzen'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Die Bedeutung von Forschungssoftware im wissenschaftlichen Erkenntnisprozess
    nimmtzu. Die Entwicklung und der Umgang mit Forschungssoftware erfordern jedoch
    Kompetenzen, die derzeit im deutschen Wissenschaftssystem noch nicht in genügendem
    Maße und inausreichender Breite vorhanden sind. Dieses Problem wurde in einem
    Workshop mit Unterstützung der Volkswagen-Stiftung adressiert. Die Veranstaltung
    fand im Dezember 2024 statt und entwickelte Handlungsempfehlungen für verschiedene
    Akteure, die der Förderung vonForschungssoftwarekompetenzen an deutschen Wissenschaftsinstitutionen
    dienen
