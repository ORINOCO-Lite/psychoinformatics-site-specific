attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Neural mechanisms of deliberate dishonesty: Dissociating deliberation from
    other control processes during dishonest behaviors'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Numerous studies have sought proof of whether people are genuinely honest
    by testing whether cognitive control mechanisms are recruited during honest and
    dishonest behaviors. The underlying assumption is: Deliberate behaviors require
    cognitive control to inhibit intuitive responses. However, cognitive control during
    honest and dishonest behaviors can be required for other reasons than deliberation.
    Across 58 neuroimaging studies (1,211 subjects), we investigated different forms
    of honest and dishonest behaviors and demonstrated that many brain regions previously
    implicated in dishonesty may reflect more general cognitive mechanisms. We argue
    that the motivational/volitional dimension is central to deliberation and provide
    evidence that motivated dishonest behaviors recruit the perigenual anterior cingulate
    cortex. This work questions the view that cognitive control is a hallmark of dishonesty.'
