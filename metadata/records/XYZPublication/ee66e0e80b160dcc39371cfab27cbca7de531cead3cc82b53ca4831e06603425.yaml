- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Mapping the principal gradient onto the corpus callosum
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Gradients capture some of the variance of the resting-state functional magnetic
    resonance imaging (rsfMRI) signal. Amongst these, the principal gradient depicts
    a functional processing hierarchy that spans from sensory-motor cortices to regions
    of the default-mode network. While the cortex has been well characterised in terms
    of gradients little is known about its underlying white matter. For instance,
    comprehensive mapping of the principal gradient on the largest white matter tract,
    the corpus callosum, is still missing. Here, we mapped the principal gradient
    onto the midsection of the corpus callosum using the 7T human connectome project
    dataset. We further explored how quantitative measures and variability in callosal
    midsection connectivity relate to the principal gradient values. In so doing,
    we demonstrated that the extreme values of the principal gradient are located
    within the callosal genu and the posterior body, have lower connectivity variability
    but a larger spatial extent along the midsection of the corpus callosum than mid-range
    values. Our results shed light on the relationship between the brain's functional
    hierarchy and the corpus callosum. We further speculate about how these results
    may bridge the gap between functional hierarchy, brain asymmetries, and evolution.
