attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Ethical Implications of e-Health Applications in Early Preventive Healthcare
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: As a means of preventive medicine early detection and prevention examinations
    can identify and treat possible health disorders or abnormalities from an early
    age onwards. However, pediatric examinations are often widely spaced, and thus
    only snapshots of the children's and adolescents' developments are obtained. With
    e-health applications parents and adolescents could record developmental parameters
    much more frequently and regularly and transmit data directly for ongoing evaluation.
    AI technologies could be used to search for new and previously unknown patterns.
    Although e-health applications could improve preventive healthcare, there are
    serious concerns about the unlimited use of big data in medicine. Such concerns
    range from general skepticism about big data in medicine to specific challenges
    and risks in certain medical areas. In this paper, we will focus on preventive
    health care in pediatrics and explore ethical implications of e-health applications.
    Specifically, we will address opportunities and risks of app-based data collection
    and AI-based data evaluation for complementing established early detection and
    prevention examinations. To this end, we will explore the principle of the best
    interest of the child. Furthermore, we shall argue that difficult trade-offs need
    to be made between group benefit on the one hand and individual autonomy and privacy
    on the other.
