  value: 'Elevating sleep to a global health priority: The One Sleep Health framework'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Sleep is a non-negotiable necessity for humans and animals and a cornerstone
    of health. Research is recently undergoing a paradigm shift, moving from a focus
    on individual factors to macro-level influences on sleep health. The physical,
    social, and lifestyle exposome increasingly disrupts human and animal sleep, highlighting
    shared vulnerabilities and potential health risks across species within shared
    ecosystems. Yet, the interactions among sleep, whole-body health, and exposome
    factors remain elusive. Here, we propose a novel integrative One Sleep Health
    framework that recognizes sleep as a fundamental pillar of planetary health and
    highlights how environmental factors influence it in the modern era. It incorporates
    the sleep capital concept—the cumulative health, social, and economic benefits
    of high sleep quality—into a global sleep health agenda. By adopting a transdisciplinary
    lens encompassing neuroscience, medicine, environmental science, and public health,
    this framework aims to bridge critical gaps in global sleep research and diplomacy.
