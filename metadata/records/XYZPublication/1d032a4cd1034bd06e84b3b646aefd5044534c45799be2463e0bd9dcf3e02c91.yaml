attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Age differences in predicting working memory performance from network-based
    functional connectivity
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Deterioration in working memory capacity (WMC) has been associated with
    normal aging, but it remains unknown how age affects the relationship between
    WMC and connectivity within functional brain networks. We therefore examined the
    predictability of WMC from fMRI-based resting-state functional connectivity (RSFC)
    within eight meta-analytically defined functional brain networks and the connectome
    in young and old adults using relevance vector machine in a robust cross-validation
    scheme. Particular brain networks have been associated with mental functions linked
    to WMC to a varying degree and are associated with age-related differences in
    performance. Comparing prediction performance between the young and old sample
    revealed age-specific effects: In young adults, we found a general unpredictability
    of WMC from RSFC in networks subserving WM, cognitive action control, vigilant
    attention, theory-of-mind cognition, and semantic memory, whereas in older adults
    each network significantly predicted WMC. Moreover, both WM-related and WM-unrelated
    networks were differently predictive in older adults with low versus high WMC.
    These results indicate that the within-network functional coupling during task-free
    states is specifically related to individual task performance in advanced age,
    suggesting neural-level reorganization. In particular, our findings support the
    notion of a decreased segregation of functional brain networks, deterioration
    of network integrity within different networks and/or compensation by reorganization
    as factors driving associations between individual WMC and within-network RSFC
    in older adults. Thus, using multivariate pattern regression provided novel insights
    into age-related brain reorganization by linking cognitive capacity to brain network
    integrity.'
