attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Developing a novel tool to assess the ability to self‑administer medication
    in non‑demented in‑hospital patients: ABLYMED study protocol'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Background: Older people often suffer from multimorbidity resulting in polypharmacy.
    The correct administration of medication is a crucial factor influencing treatment
    efficacy. However, tools for evaluating the ability to self-administer different
    dosage forms of medications are lacking. The objectives of the ABLYMED study are
    to 1) assess the ability to self-administer different dosage forms of medication
    in older non-demented in-hospital patients who report autonomous management of
    medication, 2) identify factors influencing the ability to self-administer medication,
    and 3) develop a standardized tool to validly assess the ability to self-administer
    different dosage forms of medications based on the final study results. Methods:
    One hundred in-patients from the department of orthopedics and trauma surgery
    of the University Hospital Düsseldorf  ≥ 70 years of age and regularly taking
    ≥ 5 different drugs autonomously will be prospectively recruited into the observational
    cross-sectional single-center ABLYMED study. Patients undergo an interview addressing
    demographic and clinical information, medication history (which medications are
    taken since when, in which dose and dosage form, and subjective proficiency of
    taking these medications), medication adherence, and factors possibly influencing
    adherence including personality traits and perceived quality of the medication
    regimen. Quality of the medication regimen is also rated by clinicians according
    to validated lists. Further, patients receive a comprehensive geriatric assessment
    including measures of cognition, mobility, and functional status. The ability
    to self-administer medication is assessed by having patients perform different
    tasks related to medication self-administration, which are video recorded and
    rated by different experts. The patients’ self-reported ability will be correlated
    with the observed performance in the self-administration tasks. Further, factors
    correlating with the reported and observed ability to self-administer medication
    will be evaluated using correlation and regression models. Based on the final
    study results, a novel tool to assess the ability of older patients to self-administer
    medication will be developed. Discussion: In addition to guideline-based pharmacotherapy,
    correct intake of prescribed medication is crucial for optimal therapy of multimorbidity
    in older people. Tools to validly assess the ability of older patients to self-administer
    different dosage forms of medications are lacking, but should be included in comprehensive
    geriatric assessments to secure functional health.'
