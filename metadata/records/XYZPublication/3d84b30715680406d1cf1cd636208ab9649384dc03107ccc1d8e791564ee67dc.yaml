attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Human cortical dynamics reflect graded contributions of local geometry and
    network topography
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The brain is a physically embedded and heavily interconnected system that
    expresses neural rhythms across multiple time scales. While these dynamics result
    from the complex interplay of local and inter-regional factors, the relative contribution
    of such mechanisms across the cortex remains unclear. Our study explores geometric,
    microstructural, and connectome-level constraints on cortex-wide neural activity.
    We leverage intracranial electroencephalography recordings to derive a coordinate
    system of human cortical dynamics. Using multimodal neuroimaging, we could then
    demonstrate that these patterns are largely explainable by geometric properties
    indexed by inter-regional distance. However, dynamics in transmodal association
    regions are additionally explainable by incorporation of inter-regional microstructural
    similarity and connectivity information. Our findings are generally consistent
    when cross-referencing electroencephalography and imaging data from large-scale
    atlases and when using data obtained in the same individuals, suggesting subject-specificity
    and population-level generalizability. Together, our results suggest that the
    relative contribution of local and macroscale constraints on cortical dynamics
    varies systematically across the cortical sheet, specifically highlighting the
    role of transmodal networks in inter-regional cortical coordination.
