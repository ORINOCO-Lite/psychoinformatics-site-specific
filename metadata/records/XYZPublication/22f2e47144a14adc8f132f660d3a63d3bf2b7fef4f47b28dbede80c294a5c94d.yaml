attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Is the PPA a visual area? BOLD responses to incidental spatial cues in naturalistic
    stimulation
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: We re-used fMRI data taken from the studyforrest-dataset (studyforrest.com)
    to investigate if BOLD responses of the parahippocampal place area (PPA; Epstein
    & Kanwisher, 1998, A cortical representation of the local visual environment)
    correlate with incidential spatial speech cues given by an audio drama's narrator
    (audio-only variant of the movie "Forrest Gump"). Results suggest a standard general
    linear model (GLM) applied to a complex, auditory stimulus can be used to localize
    a "visual area" in individual subjects.
