attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Pitfalls in using ML to predict cognitive function performance
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Machine learning analyses are widely used for predicting cognitive abilities,
    yet there are pitfalls that need to be considered during their implementation
    and interpretation of the results. Hence, the present study aimed at drawing attention
    to the risks of erroneous conclusions incurred by confounding variables illustrated
    by a case example predicting executive function performance by prosodic features.
    Healthy participants (n = 231) performed speech tasks and EF tests. From 264 prosodic
    features, we predicted EF performance using 66 variables, controlling for confounding
    effects of age, sex, and education. A reasonable model fit was apparently achieved
    for EF variables of the Trail Making Test. However, in-depth analyses revealed
    indications of confound leakage, leading to inflated prediction accuracies, due
    to a strong relationship between confounds and targets. These findings highlight
    the need to control confounding variables in ML pipelines and caution against
    potential pitfalls in ML predictions.
