attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: A machine learning approach for the factorization of psychometric data with
    application to the Delis Kaplan Executive Function System
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: While a replicability crisis has shaken psychological sciences, the replicability
    of multivariate approaches for psychometric data factorization has received little
    attention. In particular, Exploratory Factor Analysis (EFA) is frequently promoted
    as the gold standard in psychological sciences. However, the application of EFA
    to executive functioning, a core concept in psychology and cognitive neuroscience,
    has led to divergent conceptual models. This heterogeneity severely limits the
    generalizability and replicability of findings. To tackle this issue, in this
    study, we propose to capitalize on a machine learning approach, OPNMF (Orthonormal
    Projective Non-Negative Factorization), and leverage internal cross-validation
    to promote generalizability to an independent dataset. We examined its application
    on the scores of 334 adults at the Delis-Kaplan Executive Function System (D-KEFS),
    while comparing to standard EFA and Principal Component Analysis (PCA). We further
    evaluated the replicability of the derived factorization across specific gender
    and age subsamples. Overall, OPNMF and PCA both converge towards a two-factor
    model as the best data-fit model. The derived factorization suggests a division
    between low-level and high-level executive functioning measures, a model further
    supported in subsamples. In contrast, EFA, highlighted a five-factor model which
    reflects the segregation of the D-KEFS battery into its main tasks while still
    clustering higher-level tasks together. However, this model was poorly supported
    in the subsamples. Thus, the parsimonious two-factors model revealed by OPNMF
    encompasses the more complex factorization yielded by EFA while enjoying higher
    generalizability. Hence, OPNMF provides a conceptually meaningful, technically
    robust, and generalizable factorization for psychometric tools.
