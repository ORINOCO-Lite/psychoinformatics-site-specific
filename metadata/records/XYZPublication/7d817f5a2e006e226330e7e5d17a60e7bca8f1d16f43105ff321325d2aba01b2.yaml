attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Spatio-molecular profiles shape the human cerebellar hierarchy along the
    sensorimotor-association axis
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Cerebellar involvement in both motor and non-motor functions manifests in
    specific regions of the human cerebellum, revealing the functional heterogeneity
    within it. One compelling theory places the heterogeneity within the cerebellar
    functional hierarchy along the sensorimotor-association (SA) axis. Despite extensive
    neuroimaging studies, evidence for the cerebellar SA axis from different modalities
    and scales was lacking. Thus, we establish a significant link between the cerebellar
    SA axis and spatio-molecular profiles. Utilizing the gene set variation analysis,
    we find the intermediate biological principles the significant genes leveraged
    to scaffold the cerebellar SA axis. Interestingly, we find these spatio-molecular
    profiles notably associated with neuropsychiatric dysfunction and recent evolution.
    Furthermore, cerebello-cerebral interactions at genetic and functional connectivity
    levels mirror the cerebral cortex and cerebellum''s SA axis. These findings can
    provide a deeper understanding of how the human cerebellar SA axis is shaped and
    its role in transitioning from sensorimotor to association functions.Keywords:
    CP: Neuroscience; brain evolution; functional hierarchy; gene expression; human
    cerebellum; neuropsychiatric disorder.'
