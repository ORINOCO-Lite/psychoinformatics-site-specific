attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Naturalistic viewing increases individual identifiability based on connectivity
    within functional brain networks
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Naturalistic viewing (NV) is currently considered a promising paradigm for
    studying individual differences in functional brain organization. While whole
    brain functional connectivity (FC) under NV has been relatively well characterized,
    so far little work has been done on a network level.Here, we extend current knowledge
    by characterizing the influence of NV on FC in fourteen meta-analytically derived
    brain networks considering three different movie stimuli in comparison to resting-state
    (RS). We show that NV increases identifiability of individuals over RS based on
    functional connectivity in certain, but not all networks. Furthermore, movie stimuli
    including a narrative appear more distinct from RS. In addition, we assess individual
    variability in network FC by comparing within- and between-subject similarity
    during NV and RS. We show that NV can evoke individually distinct NFC patterns
    by increasing inter-subject variability while retaining within-subject similarity.
    Crucially, our results highlight that this effect is not observable across all
    networks, but rather dependent on the network-stimulus combination. Our results
    confirm that NV can improve the detection of individual differences over RS and
    underline the importance of selecting the appropriate combination of movie and
    cognitive network for the research question at hand.
