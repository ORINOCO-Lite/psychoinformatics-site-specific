attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Cerebral electrometabolic coupling in disordered and normal states of consciousness
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: We assess cerebral integrity with cortical and subcortical FDG-PET and cortical
    electroencephalography (EEG) within the mesocircuit model framework in patients
    with disorders of consciousness (DoCs). The mesocircuit hypothesis proposes that
    subcortical activation facilitates cortical function. We find that the metabolic
    balance of subcortical mesocircuit areas is informative for diagnosis and is associated
    with four EEG-based power spectral density patterns, cortical metabolism, and
    α power in healthy controls and patients with a DoC. Last, regional electrometabolic
    coupling at the cortical level can be identified in the θ and α ranges, showing
    positive and negative relations with glucose uptake, respectively. This relation
    is inverted in patients with a DoC, potentially related to altered orchestration
    of neural activity, and may underlie suboptimal excitability states in patients
    with a DoC. By understanding the neurobiological basis of the pathophysiology
    underlying DoCs, we foresee translational value for diagnosis and treatment of
    patients with a DoC.
