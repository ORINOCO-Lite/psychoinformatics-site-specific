description: Theoretical models of insomnia disorder recognise an emotional component
  in the main-tenance of the disorder. Nonetheless, the field of emotions is vast
  and different pro-cesses are involved in psychological well-being. The present narrative
  review focusseson emotion regulation and affect dynamics, synthesising some of the
  most recent andrelevant evidence on emotions in relationto the quality of sleep
  and to insomnia disor-der. The literature underlines the close association between
  impaired sleep quality anddifficulties in regulating emotions. Impairedsleep quality
  is also associated with reducedpositive affect and increased negative affect,but
  little evidence supports a bi-directionalassociation between affective states and
  sleep. Affect variability in relation to sleep hasbeen less investigated. Initial
  evidence suggests that high variability in positive affect hasa negative impact
  on sleep. Neurobiological and behavioural evidence indicates thatinsomnia disorder
  is associated with emotion dysregulation, negative affect, and a dis-tinct daily
  profile of affective states. Moreresearch is needed on the affective experi-ence
  of patients with insomnia disorder, adopting multiple sampling of affect across
  theday and the week. Understanding how the unfolding of emotions over time interact
  withsleep alterations may help to improve the tailoring and monitoring of treatments
  addres-sing disturbed emotional processes in insomnia disorder.
