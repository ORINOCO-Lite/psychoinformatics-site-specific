  schema_type: dlthings:AttributeSpecification
  value: 'Machine learning for psychiatry: getting doctors at the black box?'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Recent developments in the field of machine-learning have spurred high hopes
    for diagnostic support for psychiatric patients based on brain MRI. But while
    technical advances are undoubtedly remarkable, the current trajectory of mostly
    proof-of-concept studies performed on retrospective, often repository-derived
    data, may not be well suited to yield a substantial impact in clinical practice.
    Here we review these developments and challenges, arguing for the need of stronger
    involvement of and input from medical doctors in order to pave the way for machine-learning
    in clinical psychiatry.
