  value: Rats respond to aversive emotional arousal of human handlers with the activation
    of the basolateral and central amygdala
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Reading danger signals may save an animal’s life, and learning about threats
    from others allows avoiding first-hand aversive and often fatal experiences. Fear
    expressed by other individuals, including those belonging to other species, may
    indicate the presence of a threat in the environment and is an important social
    cue. Humans and other animals respond to conspecifics’ fear with increased activity
    of the amygdala, the brain structure crucial for detecting threats and mounting
    an appropriate response to them. It is unclear, however, whether the cross-species
    transmission of threat information involves similar mechanisms, e.g., whether
    animals respond to the aversively induced emotional arousal of humans with activation
    of fear-processing circuits in the brain. Here, we report that when rats interact
    with a human caregiver who had recently undergone fear conditioning, they show
    risk assessment behavior and enhanced amygdala activation. The amygdala response
    involves its two major parts, the basolateral and central, which detect a threat
    and orchestrate defensive responses. Further, we show that humans who learn about
    a threat by observing another aversively aroused human, similar to rats, activate
    the basolateral and centromedial parts of the amygdala. Our results demonstrate
    that rats detect the emotional arousal of recently aversively stimulated caregivers
    and suggest that cross-species social transmission of threat information may involve
    similar neural circuits in the amygdala as the within-species transmission.
