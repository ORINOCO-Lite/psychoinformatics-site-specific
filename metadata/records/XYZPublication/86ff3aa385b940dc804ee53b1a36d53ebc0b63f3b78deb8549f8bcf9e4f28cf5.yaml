attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Chronotype-Dependent Sleep Loss Is Associated with a Lower Amplitude in Circadian
    Rhythm and a Higher Fragmentation of REM Sleep in Young Healthy Adults
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: In modern society, the time and duration of sleep on workdays are primarily
    determined by external factors, e.g., the alarm clock. This can lead to a misalignment
    of the intrinsically determined sleep timing, which is dependent on the individual
    chronotype, resulting in reduced sleep quality. Although this is highly relevant
    given the high incidence of sleep disorders, little is known about the effect
    of this misalignment on sleep architecture. Using Fitbit trackers and questionnaire
    surveys, our study aims to elucidate sleep timing, sleep architecture, and subjective
    sleep quality in young healthy adults (n = 59) under real-life conditions (average
    of 82.4 ± 9.7 days). Correlations between variables were calculated to identify
    the direction of relationships. On workdays, the midpoint of sleep was earlier,
    the sleep duration was shorter, and tiredness upon waking was higher than on free
    days. A higher discrepancy between sleep duration on workdays and free days was
    associated with a lower stability of the circadian rhythm of REM sleep and also
    with a higher fragmentation of REM sleep. Similarly, a higher tiredness upon waking
    on free days, thus under intrinsically determined sleep timing conditions, was
    associated with a lower proportion and a higher fragmentation of REM sleep. This
    suggests that the misalignment between extrinsically and intrinsically determined
    sleep timing affects the architecture of sleep stages, particularly REM sleep,
    which is closely connected to sleep quality.
