attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Network and state specificity in connectivity‐based predictions of individual
    behavior
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Predicting individual behavior from brain functional connectivity (FC) patterns
    can contribute to our understanding of human brain functioning. This may apply
    in particular if predictions are based on features derived from circumscribed,
    a priori defined functional networks, which improves interpretability. Furthermore,
    some evidence suggests that task-based FC data may yield more successful predictions
    of behavior than resting-state FC data. Here, we comprehensively examined to what
    extent the correspondence of functional network priors and task states with behavioral
    target domains influences the predictability of individual performance in cognitive,
    social, and affective tasks. To this end, we used data from the Human Connectome
    Project for large-scale out-of-sample predictions of individual abilities in working
    memory (WM), theory-of-mind cognition (SOCIAL), and emotion processing (EMO) from
    FC of corresponding and non-corresponding states (WM/SOCIAL/EMO/resting-state)
    and networks (WM/SOCIAL/EMO/whole-brain connectome). Using root mean squared error
    and coefficient of determination to evaluate model fit revealed that predictive
    performance was rather poor overall. Predictions from whole-brain FC were slightly
    better than those from FC in task-specific networks, and a slight benefit of predictions
    based on FC from task versus resting state was observed for performance in the
    WM domain. Beyond that, we did not find any significant effects of a correspondence
    of network, task state, and performance domains. Together, these results suggest
    that multivariate FC patterns during both task and resting states contain rather
    little information on individual performance levels, calling for a reconsideration
    of how the brain mediates individual differences in mental abilities.Keywords:
    brain‐based prediction; brain–behavior relationships; fMRI; functional connectivity;
    interindividual differences; machine learning.'
