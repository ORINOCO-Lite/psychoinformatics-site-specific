  value: Ethische Aspekte des Einsatzes von künstlicher Intelligenz in der Medizin
    - Ethical aspects of the use of artificial intelligence in medicine
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: BackgroundApplications of artificial intelligence (AI) are now widely used
    in medicine and are becoming increasingly more important.ObjectiveSome of the
    ethical challenges associated with the use of AI applications in medicine are
    highlighted.Material and methodsAgainst the backdrop of established ethical principles,
    several recent studies are cited and discussed from an ethical perspective.ConclusionThe
    AI is a disruptive technology that offers great benefits but also entails certain
    risks. Medical ethics provide principles that can be used to identify risks and
    develop strategies for the responsible implementation of AI applications.
