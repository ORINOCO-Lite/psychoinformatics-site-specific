attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'The effect of task complexity on the neural network for response inhibition:
    An ALE meta-analysis'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Response inhibition is classically investigated using the go/no-go (GNGT)
    and stop-signal task (SST), which conceptually measure different subprocesses
    of inhibition. Further, different task versions with varying levels of additional
    executive control demands exist, making it difficult to identify the core neural
    correlates of response inhibition independent of variations in task complexity.
    Using neuroimaging meta-analyses, we show that a divergent pattern of regions
    is consistently involved in the GNGT versus SST, arguing for different mechanisms
    involved when performing the two tasks. Further, for the GNGT a strong effect
    of task complexity was found, with regions of the multiple demand network (MDN)
    consistently involved particularly in the complex GNGT. In contrast, both standard
    and complex SST recruited the MDN to a similar degree. These results complement
    behavioral evidence suggesting that inhibitory control becomes automatic after
    some practice and is performed without input of higher control regions in the
    classic, standard GNGT, but continues to be implemented in a top-down controlled
    fashion in the SST.
