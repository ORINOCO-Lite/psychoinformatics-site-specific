  value: 'Laterality 2020: Response to the article commentaries'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'In our recent opinion paper “Laterality 2020: entering the next decade”,
    we highlighted trends that we thought are likely to shape laterality research
    in the 2020s. Our opinion paper inspired 11 commentaries by experts from several
    disciplines which discussed a wide range of topics complementing the 10 trends
    we identified in the opinion paper. In this reply, we summarize and discuss the
    11 commentaries by clustering them into 3 different main topics. The topic that
    was covered by the largest number of commentaries was the role of comparative
    and evolutionary approaches in laterality research. Moreover, several comments
    focused on the ontogenesis of hemispheric asymmetries and the importance of reliability
    and validity in laterality research. Embracing the technical advances, research
    trends and controversies laid out in the commentaries will significantly improve
    our understanding of several of the core questions of laterality research.'
