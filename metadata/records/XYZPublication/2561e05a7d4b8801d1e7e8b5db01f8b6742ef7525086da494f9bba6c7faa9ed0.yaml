  value: Probabilistic cytoarchitectonic map of Area 6d2 (PreCG) (v4.0)
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'This dataset contains the distinct probabilistic cytoarchitectonic map of
    Area 6d2 (PreCG) in the individual, single subject template of the MNI Colin 27
    reference space. As part of the JuBrain cytoarchitectonic atlas, the area was
    identified using cytoarchitectonic analysis on cell-body-stained histological
    sections of 10 human postmortem brains obtained from the body donor program of
    the University of Düsseldorf. The results of the cytoarchitectonic analysis were
    then mapped to the reference space, where each voxel was assigned the probability
    to belong to Area 6d2 (PreCG). The probability map of Area 6d2 (PreCG) is provided
    in NifTi format for each hemisphere in the reference space. The JuBrain atlas
    relies on a modular, flexible and adaptive framework containing workflows to create
    the probabilistic brain maps for these structures. Note that methodological improvements
    and updated probability estimates for new brain structures may in some cases lead
    to measurable but negligible deviations of existing probability maps, as compared
    to earlier released datasets. Other available data versions of Area 6d2 (PreCG):
    Sigl et al. (2019) [Data set, v4.1] [DOI: 10.25493/KXHS-N90](https://doi.org/10.25493%2FKXHS-N90)
    The most probable delineation of Area 6d2 (PreCG) derived from the calculation
    of a maximum probability map of all currently released JuBrain brain structures
    can be found here: Amunts et al. (2019) [Data set, v18] [DOI: 10.25493/8EGG-ZAR](https://doi.org/10.25493%2F8EGG-ZAR)'
