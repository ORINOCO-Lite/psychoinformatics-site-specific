  value: Atypical structural connectome asymmetry and associations with network communication
    in autism spectrum disorder
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Autism spectrum disorder is a common neurodevelopmental condition showing
    connectome disorganization in sensory and transmodal cortices. However, alterations
    in the inter-hemispheric asymmetry of structural connectome are remained to be
    investigated. Here, we studied structural connectome asymmetry in individuals
    with autism using dimensionality reduction techniques and assessed its topological
    underpinnings by associating with network communication measures. We found that
    the sensory and heteromodal association regions showed significant between-group
    differences in inter-hemispheric asymmetry between individuals with autism and
    neurotypical controls. In addition, the network communication ability was particularly
    altered between visual and limbic areas. Our findings provide insights for understanding
    structural connectome alteration in autism and its topological underpinnings.Clinical
    Relevance— This study provides insights into the understanding of atypical macroscale
    structural connectome organization in individuals with autism.
