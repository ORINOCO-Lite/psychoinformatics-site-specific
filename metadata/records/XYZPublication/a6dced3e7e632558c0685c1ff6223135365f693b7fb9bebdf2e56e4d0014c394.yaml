attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Meta-topologies define distinct anatomical classes of brain tumours linked
    to histology and survival
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The current World Health Organization classification integrates histological
    and molecular features of brain tumours. The aim of this study was to identify
    generalizable topological patterns with the potential to add an anatomical dimension
    to the classification of brain tumours. We applied non-negative matrix factorization
    as an unsupervised pattern discovery strategy to the fine-grained topographic
    tumour profiles of 936 patients with neuroepithelial tumours and brain metastases.
    From the anatomical features alone, this machine learning algorithm enabled the
    extraction of latent topological tumour patterns, termed meta-topologies. The
    optimal part-based representation was automatically determined in 10 000 split-half
    iterations. We further characterized each meta-topology's unique histopathologic
    profile and survival probability, thus linking important biological and clinical
    information to the underlying anatomical patterns. In neuroepithelial tumours,
    six meta-topologies were extracted, each detailing a transpallial pattern with
    distinct parenchymal and ventricular compositions. We identified one infratentorial,
    one allopallial, three neopallial (parieto-occipital, frontal, temporal) and one
    unisegmental meta-topology. Each meta-topology mapped to distinct histopathologic
    and molecular profiles. The unisegmental meta-topology showed the strongest anatomical-clinical
    link demonstrating a survival advantage in histologically identical tumours. Brain
    metastases separated to an infra- and supratentorial meta-topology with anatomical
    patterns highlighting their affinity to the cortico-subcortical boundary of arterial
    watershed areas.Using a novel data-driven approach, we identified generalizable
    topological patterns in both neuroepithelial tumours and brain metastases. Differences
    in the histopathologic profiles and prognosis of these anatomical tumour classes
    provide insights into the heterogeneity of tumour biology and might add to personalized
    clinical decision-making.
