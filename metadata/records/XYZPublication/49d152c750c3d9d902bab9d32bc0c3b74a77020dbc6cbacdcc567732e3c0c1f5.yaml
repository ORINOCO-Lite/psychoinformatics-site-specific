attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Hippocampus-Centered Network Is Associated With Positive Symptom Alleviation
    in Patients With First-Episode Psychosis
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: BackgroundPrevious functional magnetic resonance imaging studies have reported
    widespread brain functional connectivity alterations in patients with psychosis.
    These studies have mostly used either resting-state or simple-task paradigms,
    thereby compromising experimental control or ecological validity, respectively.
    Additionally, in a conventional functional magnetic resonance imaging intrasubject
    functional connectivity analysis, it is difficult to identify which connections
    relate to extrinsic (stimulus-induced) and which connections relate to intrinsic
    (non–stimulus-related) neural processes.MethodsTo mitigate these limitations,
    we used intersubject functional connectivity (ISFC) to analyze longitudinal functional
    magnetic resonance imaging data collected while 36 individuals with first-episode
    psychosis (FEP) and 29 age- and sex-matched population control participants watched
    scenes from the fantasy movie Alice in Wonderland at baseline and again at 1-year
    follow-up. Furthermore, to allow unconfounded comparison and to overcome possible
    circularity of ISFC, we introduced a novel approach wherein ISFC in both the FEP
    and population control groups was calculated with respect to an independent group
    of participants (not included in the analyses).ResultsUsing this independent-reference
    ISFC approach, we found an interaction effect wherein the independent-reference
    ISFC in individuals with FEP, but not in the control group participants, was significantly
    stronger at baseline than at follow-up in a network centered in the hippocampus
    and involving thalamic, striatal, and cortical regions, such as the orbitofrontal
    cortex. Alleviation of positive symptoms, particularly delusions, from baseline
    to follow-up was correlated with decreased network connectivity in patients with
    FEP.ConclusionsThese findings link deviation of naturalistic information processing
    in the hippocampus-centered network to positive symptoms.
