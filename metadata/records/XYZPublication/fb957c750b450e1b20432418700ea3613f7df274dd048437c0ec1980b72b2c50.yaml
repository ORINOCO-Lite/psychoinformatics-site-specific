attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Macroscopic information-based taste representations in insular cortex are
    shaped by stimulus concentration
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Taste processing is an essential ability in all animals signaling potential
    harm or benefit of ingestive behavior. However, current evidence for cortical
    taste representations remains contradictory. To address this issue, high-resolution
    functional MRI (fMRI) and multivariate pattern analysis were used to characterize
    taste-related informational content in human insular cortex, which contains primary
    gustatory cortex. Human participants judged pleasantness and intensity of low-
    and high-concentration tastes (salty, sweet, sour, and bitter) in two fMRI experiments
    on two different days to test for task- and concentration-invariant taste representations.
    We observed patterns of fMRI activity within insular cortex narrowly tuned to
    specific tastants consistently across tasks in all participants. Fewer patterns
    responded to more than one taste category. Importantly, changes in taste concentration
    altered the spatial layout of putative taste-specific patterns with distinct,
    almost nonoverlapping patterns for each taste category at different concentration
    levels. Together, our results point at macroscopic representations in human insular
    cortex as a complex function of taste category and concentration rather than representations
    based solely on taste identity.
