description: Here we present a high-resolution functional magnetic resonance (fMRI)
  dataset – 20 participants recorded at high field strength (7 Tesla) during prolonged
  stimulation with an auditory feature film (“Forrest Gump”). In addition, a comprehensive
  set of auxiliary data (T1w, T2w, DTI, susceptibility-weighted image, angiography)
  as well as measurements to assess technical and physiological noise components have
  been acquired. An initial analysis confirms that these data can be used to study
  common and idiosyncratic brain response patterns to complex auditory stimulation.
  Among the potential uses of this dataset are the study of auditory attention and
  cognition, language and music perception, and social perception. The auxiliary measurements
  enable a large variety of additional analysis strategies that relate functional
  response patterns to structural properties of the brain. Alongside the acquired
  data, we provide source code and detailed information on all employed procedures
  – from stimulus creation to data analysis. In order to facilitate replicative and
  derived works, only free and open-source software was utilized.
