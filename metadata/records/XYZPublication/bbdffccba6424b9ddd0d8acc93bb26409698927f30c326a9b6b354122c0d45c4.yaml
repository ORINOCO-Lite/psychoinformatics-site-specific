attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Predicting brain volumes from anthropometric and demographic features: insights
    from UK biobank neuroimaging data'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Brain size measures are well-studied and often treated as a confound in
    volumetric neuroimaging analyses. Yet their relationship with body anthropometric
    measures and demographics remains underexplored. In this study, we examined those
    relationships alongside age- and sex-related differences in global brain volumes.
    Using brain magnetic resonance imaging (MRI) of healthy participants in the UK
    Biobank, we derived global measures of brain morphometry, including total intracranial
    volume (TIV), total brain volume (TBV), gray matter volume (GMV), white matter
    volume (WMV), and cerebrospinal fluid (CSF). We extracted these measures using
    the Computational Anatomy Toolbox (CAT) and FreeSurfer. Our analyses were structured
    in three approaches: across-sex analysis, sex-specific analysis, and impact of
    age analysis. Employing machine learning (ML), we found that TIV was strongly
    predicted by sex (across-sex formula image 0.68), reflecting sex difference. On
    the other hand, TBV, GMV, WMV, and CSF were more sensitive to age, with higher
    prediction accuracy when age was included as a feature, highlighting age-related
    changes in the brain structure, such as fluid expansion. Sex-specific models showed
    reduced TIV prediction (formula image 0.25) but improved TBV accuracy (formula
    image 0.44), underscoring sex-specific body-brain relationships. Anthropometric
    measures, particularly seated height and weight, improved prediction of TIV and
    TBV, while waist and hip circumference showed negative associations, though their
    effects generally remained secondary to age and sex. These findings advance our
    understanding of brain-body scaling relationships and underscore the necessity
    of accounting for age and sex in neuroimaging studies of brain morphology.'
