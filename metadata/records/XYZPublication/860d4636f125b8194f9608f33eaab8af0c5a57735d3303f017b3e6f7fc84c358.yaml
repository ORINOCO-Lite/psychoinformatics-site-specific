  value: 'Manage your data with DataLad: From local version control to data publication'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Workshop slides for a 2-hour DataLad workshop in Frankfurt at the CuttingGardens
    conference 2023. https://cuttinggardens2023.org/gardens/frankfurt/#LT_AW Workshop
    abstract: Manage your Data with DataLad: From local version control to data publication
    Many open source software tools assist with the complex task of data management.
    This workshop introduces one of them, the data management and data publication
    tool DataLad (https://www.datalad.org). If you have always wanted to get going
    with version control, are curious to find out how to use DataLad, or want to see
    simple workflows for data management routines, this workshop is for you. You will
    learn about core concepts of research data management and how to implement them
    – from local version control for all parts of your research to data publication.
    With a focus on technical and conceptual aspects alike, the workshop aims to equip
    you with skills you could transfer to real-world data, with a mix of theoretical
    input and interactive hands-on applications.   The workshop will provide a cloud-computing
    environment for interactive participation, but participants should bring their
    own computers in order to access it.'
