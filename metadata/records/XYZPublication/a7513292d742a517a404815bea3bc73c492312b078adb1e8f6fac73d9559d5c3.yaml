attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: A systematic comparison of VBM pipelines and their application to age prediction
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Voxel-based morphometry (VBM) analysis is commonly used for localized quantification
    of gray matter volume (GMV). Several alternatives exist to implement a VBM pipeline.
    However, how these alternatives compare and their utility in applications, such
    as the estimation of aging effects, remain largely unclear. This leaves researchers
    wondering which VBM pipeline they should use for their project. In this study,
    we took a user-centric perspective and systematically compared five VBM pipelines,
    together with registration to either a general or a study-specific template, utilizing
    three large datasets (n each). Considering the known effect of aging on GMV, we
    first compared the pipelines in their ability of individual-level age prediction
    and found markedly varied results. To examine whether these results arise from
    systematic differences between the pipelines, we classified them based on their
    GMVs, resulting in near-perfect accuracy. To gain deeper insights, we examined
    the impact of different VBM steps using the region-wise similarity between pipelines.
    The results revealed marked differences, largely driven by segmentation and registration
    steps. We observed large variability in subject-identification accuracies, highlighting
    the interpipeline differences in individual-level quantification of GMV. As a
    biologically meaningful criterion we correlated regional GMV with age. The results
    were in line with the age-prediction analysis, and two pipelines, CAT and the
    combination of fMRIPrep for tissue characterization with FSL for registration,
    reflected age information better.
