attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Scaffolding Bad Moral Agents
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Recent work on ecological accounts of moral responsibility and agency have
    argued for the importance of social environments for moral reasons responsiveness.
    Moral audiences can scaffold individual agents’ sensitivity to moral reasons and
    their motivation to act on them, but they can also undermine it. In this paper,
    we look at two case studies of ‘scaffolding bad’, where moral agency is undermined
    by social environments: street gangs and online incel communities. In discussing
    these case studies, we draw both on recent situated cognition literature and on
    scaffolded responsibility theory. We show that the way individuals are embedded
    into a specific social environment changes the moral considerations they are sensitive
    to in systematic ways because of the way these environments scaffold affective
    and cognitive processes, specifically those that concern the perception and treatment
    of ingroups and outgroups. We argue that gangs undermine reasons responsiveness
    to a greater extent than incel communities because gang members are more thoroughly
    immersed in the gang environment.'
