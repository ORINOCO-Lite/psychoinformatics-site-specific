attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Patients’ Perspectives on the Implementation of AI in Radiological Diagnostics:
    Focus Group Study'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Background: Rapid developments in artificial intelligence (AI) will enable
    its widespread use in radiological diagnostics in the near future. Patients will
    then be confronted with findings generated with the help of AI. Understanding
    patients’ perspectives on the use of this technology is one of the key factors
    for its successful implementation.Objective: This qualitative study aimed to gain
    insight into patients’ reasoning about the opportunities and risks of using AI
    in radiological diagnosis, to identify prerequisites for its acceptance, and to
    identify aspects that can promote trust in AI diagnoses, especially in scenarios
    of high personal concern.Methods: A total of 7 focus groups were conducted with
    34 patients (n=15, 44% female participants) aged between 23 and 85 years (mean
    49.06, SD 17.08 y), recruited using purposive sampling strategies. Each focus
    group was audiotaped, transcribed, and analyzed using the method of structured
    qualitative content analysis.Results: Study findings show that patients are open
    to the use of AI in radiological diagnostics. The basic prerequisites for this
    are (1) scientific evidence of safe outcomes that are more accurate and faster
    than those without AI; (2) recognizable added value in patient care; (3) transparency
    in the use of AI and disclosure to the patient; (4) comprehensive, binding measures
    for quality assurance; and (5) the use of AI solely to support the physician.
    However, the results indicate that further criteria are important for patients
    to be willing to choose a radiologist who uses AI and to trust AI diagnoses. In
    situations where they are personally affected, patients fear that physicians will
    place too much trust in the AI result and that the physician-patient relationship
    will become dehumanized. Therefore, the physicians’ abilities and functions that
    inspire trust from the patients’ perspective must come into play. These include
    (1) an independent diagnosis by the physician that takes into account not only
    the clinical context but also the individuality of the patient, (2) a comprehensible
    explanation of the pros and cons of using AI for patients and clear communication
    of AI output, and (3) a humane and empathetic physician-patient relationship,
    which shows that the physician continues to feel responsible for the patient.Conclusions:
    The results of the study underscore that a high quality of the entire “sociotechnical”
    system is an essential prerequisite for patient acceptance of the use of AI in
    radiological diagnostics and for trust in AI diagnoses. The further development
    of AI performance must go hand in hand with the creation of framework conditions
    for its use that meet patients’ expectations of the role of the physician and
    ensure a trust-building physician-patient relationship. The study provides valuable
    insights into how such integration of AI into radiological practice can be achieved.'
