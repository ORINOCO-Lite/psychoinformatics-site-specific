- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Anosognosia and default mode subnetwork dysfunction in Alzheimer's disease
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Research on the neural correlates of anosognosia in Alzheimer''s disease
    varied accordingto methods and objectives: they compared different measures, used
    diverse neuroimag-ing modalities, explored connectivity between brain networks,
    addressed the role of spe-cific brain regions or tried to give support to theoretical
    models of unawareness. Weused resting-state fMRI connectivity with two different
    seed regions and two measuresof anosognosia in different patient samples toinvestigate
    consistent modifications ofdefault mode subnetworks and we aligned the results
    with the Cognitive AwarenessModel. In a first study, patients and their relatives
    were presented with the MemoryAwareness Rating Scale. Anosognosia was measured
    as a patient-relative discrepancyscore and connectivity was investigated with
    a parahippocampal seed. In a second study,anosognosiawasmeasuredinpatientswithbrainamyloid(takenasadiseasebiomarker)by
    comparing self-reported rating with memory performance, and connectivity wasexamined
    with a hippocampal seed. In both studies, anosognosia was consistently relatedto
    disconnection within the medial temporal subsystem of the default mode network,subserving
    episodic memory processes. Importantly, scores were also related to discon-nection
    between the medial temporal and boththecoresubsystem(participating to self-reflection)
    and the dorsomedial subsystem of the default mode network (the middle tem-poral
    gyrus that might subserve a personal database in the second study). We suggestthat
    disparity in connectivity within and between subsystems of the default mode net-work
    may reflect impaired functioning of pathways in cognitive models of awareness.'
