attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Disentangling the influences of pre- and postnatal periods on human cortical
    microstructure
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: During late gestation and early postnatal development a combination of intrinsic
    and extrinsic factors drive the maturation of the human cortex. This process is
    regionally heterogeneous, with cortical areas developing at different paces and
    trajectories. Leveraging submillimetre T1-weighted/T2w-weighted (T1w/T2w) magnetic
    resonance imaging (MRI) from pre- and full-term neonates (n = 599, 0-7 weeks),
    we sampled intracortical microstructure profiles across the cortex and characterised
    the profiles’ shapes according to their central moments. We found that gestational
    age at birth dominated the effects on early cortical development, with significant,
    global increases in microstructural density, increasing intracortical homogeneity
    and a bimodal change of the microstructural balance between superficial and deeper
    cortical layers. On the other hand, weeks since birth (i.e. postnatal age) exhibited
    different effects on microstructure, with density increasing at a slower pace,
    increasing intracortical heterogeneity, and intracortical balance only shifting
    towards deeper layers in posterior temporal, occipital, medial parietal areas
    and some prefrontal areas. These effects align with low spatial-frequency geometric
    eigenmodes of the human cortex, specifically the anterior-posterior, superior-inferior
    and central-polar axes. Our findings demonstrate that separating prenatal from
    postnatal influences, and analysing intracortical profiles rather than macroscale
    features, provides finer-grained insights into how human cortical microstructure
    changes during perinatal development and lays the groundwork for investigating
    the biological underpinnings that govern normative cortical maturation.
