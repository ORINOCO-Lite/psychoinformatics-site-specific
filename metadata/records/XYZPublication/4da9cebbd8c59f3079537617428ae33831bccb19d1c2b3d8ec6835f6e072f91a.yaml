  value: Parcellation-based resting-state blood-oxygen-level-dependent (BOLD) signals
    of a healthy cohort (v1.0)
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Resting-state functional connectivity (FC) is frequently used to predict
    behavioral, clinical and demographic subject traits. This type of brain connectome
    can be derived from blood-oxygen-level-dependent (BOLD) signals that reflect the
    activation of individual brain regions parcellated according to a given brain
    atlas. Deriving FC from BOLD signals typically involves the estimation of the
    amount of synchronized coactivations between the BOLD time series of different
    brain regions. However, several measures of synchronization exist and which one
    of these metrics is suited best may deviate from study to study. In parallel,
    the appropriate selection of the brain parcellation is nowadays also still an
    open issue. This dataset hence comprises the region-based BOLD signals extracted
    from the resting-state functional magnetic resonance imaging (fMRI) data of 200
    healthy subjects included in the Human Connectome Project. The time series were
    extracted for 20 different state-of-the-art parcellations. The neuroimaging community
    may use the data of this repository to study, for example, how different measures
    of synchronization affect the resting-state FC under various parcellation conditions.
description: Resting-state functional connectivity (FC) is frequently used to predict
  behavioral, clinical and demographic subject traits. This type of brain connectome
  can be derived from blood-oxygen-level-dependent (BOLD) signals that reflect the
  activation of individual brain regions parcellated according to a given brain atlas.
  Deriving FC from BOLD signals typically involves the estimation of the amount of
  synchronized coactivations between the BOLD time series of different brain regions.
  However, several measures of synchronization exist and which one of these metrics
  is suited best may deviate from study to study. In parallel, the appropriate selection
  of the brain parcellation is nowadays also still an open issue. This dataset hence
  comprises the region-based BOLD signals extracted from the resting-state functional
  magnetic resonance imaging (fMRI) data of 200 healthy subjects included in the Human
  Connectome Project. The time series were extracted for 20 different state-of-the-art
  parcellations. The neuroimaging community may use the data of this repository to
  study, for example, how different measures of synchronization affect the resting-state
  FC under various parcellation conditions.
