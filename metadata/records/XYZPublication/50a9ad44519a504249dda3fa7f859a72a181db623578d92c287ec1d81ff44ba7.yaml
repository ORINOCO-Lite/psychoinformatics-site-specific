attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Longitudinal variation in resilient psychosocial functioning is associated
    with ongoing cortical myelination and functional reorganization during adolescence
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Adolescence is a period of dynamic brain remodeling and susceptibility to
    psychiatric risk factors, mediated by the protracted consolidation of association
    cortices. Here, we investigated whether longitudinal variation in adolescents'
    resilience to psychosocial stressors during this vulnerable period is associated
    with ongoing myeloarchitectural maturation and consolidation of functional networks.
    We used repeated myelin-sensitive Magnetic Transfer (MT) and resting-state functional
    neuroimaging (n = 141), and captured adversity exposure by adverse life events,
    dysfunctional family settings, and socio-economic status at two timepoints, one
    to two years apart. Development toward more resilient psychosocial functioning
    was associated with increasing myelination in the anterolateral prefrontal cortex,
    which showed stabilized functional connectivity. Studying depth-specific intracortical
    MT profiles and the cortex-wide synchronization of myeloarchitectural maturation,
    we further observed wide-spread myeloarchitectural reconfiguration of association
    cortices paralleled by attenuated functional reorganization with increasingly
    resilient outcomes. Together, resilient/susceptible psychosocial functioning showed
    considerable intra-individual change associated with multi-modal cortical refinement
    processes at the local and system-level.
