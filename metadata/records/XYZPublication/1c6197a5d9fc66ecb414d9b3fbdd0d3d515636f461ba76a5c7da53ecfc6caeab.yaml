- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Multimodal precision MRI of the individual human brain at ultra-high fields
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Multimodal neuroimaging, in particular magnetic resonance imaging (MRI),
    allows for non-invasive examination of human brain structure and function across
    multiple scales. Precision neuroimaging builds upon this foundation, enabling
    the mapping of brain structure, function, and connectivity patterns with high
    fidelity in single individuals. Highfield MRI, operating at magnetic field strengths
    of 7 Tesla (T) or higher, increases signal-to-noise ratio and opens up possibilities
    for gains spatial resolution. Here, we share a multimodal Precision Neuroimaging
    and Connectomics (PNI) 7 T MRI dataset. Ten healthy individuals underwent a comprehensive
    MRI protocol, including T1 relaxometry, magnetization transfer imaging, T2*-weighted
    imaging, diffusion MRI, and multi-state functional MRI paradigms, aggregated across
    three imaging sessions. Alongside anonymized raw MRI data, we release cortex-wide
    connectomes from different modalities across multiple parcellation scales, and
    supply “gradients” that compactly characterize spatial patterning of cortical
    organization. Our precision MRI dataset will advance our understanding of structure-function
    relationships in the individual human brain and is publicly available via the
    Open Science Framework.
