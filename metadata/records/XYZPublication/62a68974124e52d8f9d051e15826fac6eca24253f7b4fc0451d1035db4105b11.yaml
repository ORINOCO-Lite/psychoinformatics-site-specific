  value: Cortical and subcortical gray matter parcellations using output from CAT12.8.1.
    VBM preprocessing (mwp1) of the IXI dataset (see https://brain-development.org/ixi-dataset/)
    in all available parcellation resolutions using Schaefer cortical (Schaefer et
    al., 2018) and Tian (Tian et al., 2020) subcortical atlas. Site information is
    encoded in the subject-ID and therefore not part of the .csv files. Additionally
    the file collection contains a reduced version of demographics measurements with
    subjectIDs magic the brain data (SEX_ID (1=m, 2=f) , HEIGHT, WEIGHT, DOB ,  STUDY_DATE,
    AGE).
