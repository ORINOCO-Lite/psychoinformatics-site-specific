attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Linking brain structure and genetic risk in large-scale data: A comparison
    of shared versus predominantly disorder-specific genetic risk for neuropsychiatric
    disorders'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Shared and predominantly disorder-specific common genetic risk variants for
    neuropsychiatric disorders have been identified in previous studies. In particular,
    a large-scale genome-wide association study meta-analysis across eight neuropsychiatric
    disorders reported 23 highly pleiotropic single-nucleotide polymorphisms (SNPs)
    that are associated with at least four disorders as well as 22 SNPs that were
    predominantly associated with schizophrenia (SCZ) risk. Yet, their influences
    on brain structure which might be relevant for the increased vulnerability to
    multiple or specific neuropsychiatric disorders is not fully understood. In this
    study, we investigated and compared the cumulative influences of highly pleiotropic
    and predominantly SCZ-specific SNPs at the level of brain structure in the general
    population. Comparing their brain structural associations might point to brain
    regions of high transdiagnostic value as well as brain regions relevant to SCZ-specific
    risk pathways.
