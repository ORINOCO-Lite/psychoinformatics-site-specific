attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: The regional variation of laminar thickness in the human isocortex is related
    to cortical hierarchy and interregional connectivity
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The human isocortex consists of tangentially organized layers with unique
    cytoarchitectural properties. These layers show spatial variations in thickness
    and cytoarchitecture across the neocortex, which is thought to support function
    through enabling targeted corticocortical connections. Here, leveraging maps of
    the 6 cortical layers based on 3D human brain histology, we aimed to quantitatively
    characterize the systematic covariation of laminar structure in the cortex and
    its functional consequences. After correcting for the effect of cortical curvature,
    we identified a spatial pattern of changes in laminar thickness covariance from
    lateral frontal to posterior occipital regions, which differentiated the dominance
    of infra- versus supragranular layer thickness. Corresponding to the laminar regularities
    of cortical connections along cortical hierarchy, the infragranular-dominant pattern
    of laminar thickness was associated with higher hierarchical positions of regions,
    mapped based on resting-state effective connectivity in humans and tract-tracing
    of structural connections in macaques. Moreover, we show that regions with similar
    laminar thickness patterns have a higher likelihood of structural connections
    and strength of functional connections. In sum, here, we characterize the organization
    of laminar thickness in the human isocortex and its association with cortico-cortical
    connectivity, illustrating how laminar organization may provide a foundational
    principle of cortical function.
