attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Longitudinal trajectories of resilient psychosocial functioning link to ongoing
    cortical myelination and functional reorganization during adolescence
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Adolescence is a period of dynamic brain remodeling and susceptibility to
    psychiatric risk factors, mediated by the protracted consolidation of association
    cortices. Here, we investigated whether intra-individual trajectories of psychosocial
    functioning relative to environmental stressor exposure - including adverse life
    events, dysfunctional family settings, and socio-economic status - are tied to
    myeloarchitectural maturation and down-stream effects on intrinsic function. To
    this end, we employed longitudinal myelin-sensitive Magnetic Transfer (MT) and
    resting-state imaging in the NSPN cohort (aged 14-26y). Developing towards more
    resilient psychosocial functioning was linked to increasing myelination in the
    anterolateral prefrontal cortex, which exhibited stabilized functional connectivity.
    Studying depth-specific intracortical MT profiles and the cortex-wide synchronization
    of myeloarchitectural maturation, we further observed wide-spread myeloarchitectural
    re-configuration of association cortices paralleled by attenuated functional reorganization
    with increasingly resilient outcomes. Together, trajectories of resilient/susceptible
    psychosocial functioning showed considerable intra-individual change reflected
    in multi-modal cortical refinement processes at the local and system-level.
