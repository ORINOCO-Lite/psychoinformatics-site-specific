  value: Common and distinct brain activity associated with risky and ambiguous decision-making
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Two often-studied forms of uncertain decision-making (DM) are risky-DM (outcome
    probabilities known) and ambiguous-DM (outcome probabilities unknown). While DM
    in general is associated with activation of several brain regions, previous neuroimaging
    efforts suggest a dissociation between activity linked with risky and ambiguous
    choices. However, the common and distinct neurobiological correlates associated
    with risky- and ambiguous-DM, as well as their specificity when compared to perceptual-DM
    (as a ‘control condition’), remains to be clarified. We conducted multiple meta-analyses
    on neuroimaging results from 151 studies to characterize common and domain-specific
    brain activity during risky-, ambiguous-, and perceptual-DM. When considering
    all DM tasks, convergent activity was observed in brain regions considered to
    be consituents of the canonical salience, valuation, and executive control networks.
    When considering subgroups of studies, risky-DM (vs. perceptual-DM) was linked
    with convergent activity in the striatum and anterior cingulate cortex (ACC),
    regions associated with reward-related processes (determined by objective functional
    decoding). When considering ambiguous-DM (vs. perceptual-DM), activity convergence
    was observed in the lateral prefrontal cortex and insula, regions implicated in
    affectively-neutral mental processes (e.g., cognitive control and behavioral responding;
    determined by functional decoding). An exploratory meta-analysis comparing brain
    activity between substance users and non-users during risky-DM identified reduced
    convergent activity among users in the striatum, cingulate, and thalamus. Taken
    together, these findings suggest a dissociation of brain regions linked with risky-
    and ambiguous-DM reflecting possible differential functionality and highlight
    brain alterations potentially contributing to poor decision-making in the context
    of substance use disorders.
