attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Parcellation-based functional connectivity simulated by personalized whole-brain
    dynamical models (1.0)
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'This dataset contains functional connectomes generated by whole-brain dynamical
    models for a healthy cohort and 19 brain parcellations. The models were derived
    from and validated against the parcellation-based empirical structural (SC) and
    functional connectivities (FC) of individuals, respectively, which have been published
    as a separate dataset ([DOI: 10.25493/81EV-ZVT](https://doi.org/10.25493/81EV-ZVT)).
    In the current dataset, two particular models for local dynamics were considered
    for modeling the mean-field activities of the brain regions, in particular, the
    resting-state electrical and ultra-slow blood-oxygen-level-dependent dynamics
    of neuronal populations. Subsequently, the constructed models were simulated,
    which yielded the simulated activity time series for each brain region. From these
    time series, the corresponding simulated FC was calculated and compared with the
    empirical FC of the subject. Finally, the model parameters were optimized via
    a grid search so that the similarity between the empirical and simulated FC was
    maximized. The procedure was repeated for 200 subjects, the two models and 19
    parcellations, and this dataset includes the corresponding optimal model parameter
    settings as well as the respective simulated FCs.'
