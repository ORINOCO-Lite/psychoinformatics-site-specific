- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Challenging previous work (1), a recent metaanalysis suggests “that the neuronal
    circuitries activated by visual sexual stimuli are independent of biological sex”
    (ref. 2, p. 15671). Neuroimaging metaanalyses are indispensable for robust conclusions
    on neuronal correlates of mental functions (3). To attain this goal, best-practice
    guidelines have been jointly proposed by the developers of all major analytic
    approaches (3). A careful look at the aforementioned analysis reveals several
    issues that may have affected the outcome in nontrivial ways.
description: Challenging previous work (1), a recent metaanalysis suggests “that the
  neuronal circuitries activated by visual sexual stimuli are independent of biological
  sex” (ref. 2, p. 15671). Neuroimaging metaanalyses are indispensable for robust
  conclusions on neuronal correlates of mental functions (3). To attain this goal,
  best-practice guidelines have been jointly proposed by the developers of all major
  analytic approaches (3). A careful look at the aforementioned analysis reveals several
  issues that may have affected the outcome in nontrivial ways.
