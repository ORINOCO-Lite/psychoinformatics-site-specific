  value: Varieties of Decision-Making
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Starting with a broad use of the term, this chapter examines different types
    of decision-making and agents. A typology is proposed that can help to avoid confusion
    and promote understanding, especially in discussions between different scientific
    disciplines. The typology includes reporting/non-reporting agents, fully/partially
    transparent agents, and observer-/self-transparent agents. However, the most profound
    distinction turns out to be between non-discursive and discursive agents. This
    is mainly because discursivity and responsibility are closely linked. Discursive
    agents therefore have a special position: they must decide how they deal with
    other types of agents and what they use them for and how they use them in their
    own decision-making. So far, only humans can be considered as discursive agents.'
