attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Sender–receiver subdivisions of the default mode network in perceptual and
    memory-guided cognition
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Everyday cognition depends on the brain’s capacity to shift between sensing
    the external world and constructing it from memory. To achieve this, large-scale
    cortical systems must flexibly integrate incoming sensory signals with internally
    generated representations. Here, we show that this flexibility is reflected in
    the macroscale architecture of the default mode network (DMN). Using convergent
    analyses across three independent fMRI datasets spanning directional connectivity,
    intrinsic organization, and task-evoked responses, we identify spatially distinct
    DMN subregions that are preferentially engaged during perceptual decisions about
    faces or memory-guided decisions based on previously seen images. These subregions
    correspond to a microarchitectural distinction, captured via directional and intrinsic
    connectivity profiles: regions preferentially engaged during face perception align
    with receiver-like, afferent-biased zones that show strong intrinsic connectivity
    across the heteromodal cortex, a profile that might support information integration
    during perceptually guided decision-making. In contrast, memory-guided, perceptually
    decoupled decisions differentially engage sender-like, efferent-biased zones that
    show broader connectivity with perceptual-motor and attentional systems beyond
    the DMN. This double dissociation demonstrates a systematic association between
    DMN connectivity and engagement during perceptually coupled versus memory-guided
    cognitive processes, providing an organizational account of how DMN architecture
    relates to flexible human thought.'
