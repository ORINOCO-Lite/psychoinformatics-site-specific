- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Künstliche Intelligenz in der Medizin
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Anwendungen künstlicher Intelligenz (KI) halten Einzug inunseren Alltag,
    seien es nun automatisierte Entscheidungenim Bereich der Finanzdienstleistungen,
    die Nutzung vonGesichtserkennungsprogrammen durch Sicherheitsbehördenoder autonomes
    Fahren. Im Bereich der Medizin geht es umdie Optimierung von Diagnose und Therapie,
    die Nutzungvon Gesundheits-Apps verschiedenster Couleur, die Bereit-stellung von
    Instrumenten der personalisierten Medizin, dieMöglichkeiten roboterassistierter
    Chirurgie, ein optimiertesKrankenhausdatenmanagement, oder die Entwicklung undBereitstellung
    intelligenter Medizinprodukte. Aber handeltes sich bei diesen Konstellationen
    überhaupt um Beispie-le künstlicher Intelligenz? Und was bedeutet „Intelligenz“bzw.
    welche Bedingungen müssen erfüllt sein, um von „In-telligenz“ reden zu können?
    Diese Fragen werden je nachKontext und disziplinärer Verankerung äußerst unterschied-lich
    beantwortet, sodass sich im Ergebnis ein denkbar weit-reichender und facettenreicher
    Diskurs zeigt. Unumstrittenist hingegen der Befund, dass die Qualität und die
    Quantitätder unter KI firmierenden Anwendungen zahlreiche rechtli-che, ethische,
    soziale sowie auch naturwissenschaftliche Fra-gen aufwerfen, die bislang einer
    umfassenden Behandlungund befriedigender Lösungen harren.Während das Recht bei
    der Technikregulierung prakti-schen Entwicklungen meist hinterherhinkt, kommt
    es imBereich der KI zu einem Paradigmenwechsel: Ende April2021 hat die Europäische
    Kommission einen Entwurf ei-ner „Verordnung zur Festlegung harmonisierter Vorschrif-ten
    für künstliche Intelligenz (Gesetz über künstliche In-telligenz) und zur Änderung
    bestimmter Rechtsakte derUnion“2 vorgelegt (im Folgenden: VO-E). Die folgendenAusführungen
    stellen den diesem Entwurf zugrunde lie-genden Regelungsansatz sowie die sich
    daraus ergebendenzentralen Definitionen, Pflichtenkreise und Mechanismenvor. Im
    Interesse einer ganzheitlichen Betrachtung werdendarüber hinaus ebenso ethische,
    medizinisch-naturwissen-schaftliche und gesellschaftliche Betrachtungen angestellt.'
