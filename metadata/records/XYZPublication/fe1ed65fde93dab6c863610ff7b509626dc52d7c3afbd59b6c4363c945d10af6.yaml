attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Early neurotransmitters changes in prodromal frontotemporal dementia: A
    GENFI study'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: BackgroundNeurotransmitters deficits in Frontotemporal Dementia (FTD) are
    still poorly understood. Better knowledge of neurotransmitters impairment, especially
    in prodromal disease stages, might tailor symptomatic treatment approaches.MethodsIn
    the present study, we applied JuSpace toolbox, which allowed for cross-modal correlation
    of Magnetic Resonance Imaging (MRI)-based measures with nuclear imaging derived
    estimates covering various neurotransmitter systems including dopaminergic, serotonergic,
    noradrenergic, GABAergic and glutamatergic neurotransmission.We included 392 mutation
    carriers (157 GRN, 164 C9orf72, 71 MAPT), together with 276 non-carrier cognitively
    healthy controls (HC). We tested if the spatial patterns of grey matter volume
    (GMV) alterations in mutation carriers (relative to HC) are correlated with specific
    neurotransmitter systems in prodromal (CDR® plus NACC FTLD = 0.5) and in symptomatic
    (CDR® plus NACC FTLD≥1) FTD.ResultsIn prodromal stages of C9orf72 disease, voxel-based
    brain changes were significantly associated with spatial distribution of dopamine
    and acetylcholine pathways; in prodromal MAPT disease with dopamine and serotonin
    pathways, while in prodromal GRN disease no significant findings were reported
    (p < 0.05, Family Wise Error corrected). In symptomatic FTD, a widespread involvement
    of dopamine, serotonin, glutamate and acetylcholine pathways across all genetic
    subtypes was found. Social cognition scores, loss of empathy and poor response
    to emotional cues were found to correlate with the strength of GMV colocalization
    of dopamine and serotonin pathways (all p < 0.01).ConclusionsThis study, indirectly
    assessing neurotransmitter deficits in monogenic FTD, provides novel insight into
    disease mechanisms and might suggest potential therapeutic targets to counteract
    disease-related symptoms.
