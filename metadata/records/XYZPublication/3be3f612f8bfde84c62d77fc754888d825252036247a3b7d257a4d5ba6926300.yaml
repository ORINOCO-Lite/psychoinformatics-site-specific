attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: The coming decade of digital brain research - A vision for neuroscience at
    the intersection of technology and computing
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Brain research has in recent years indisputably entered a new epoch, driven
    by substantial methodological advances and digitally enabled data integration
    and modeling at multiple scales – from molecules to the whole system. Major advances
    are emerging at the intersection of neuroscience with technology and computing.
    This new science of the brain integrates high-quality basic research, systematic
    data integration across multiple scales, a new culture of large-scale collaboration
    and translation into applications. A systematic approach, as pioneered in Europe’s
    Human Brain Project (HBP), will be essential in meeting the pressing medical and technological
    challenges of the coming decade. The aims of this paper are To develop a concept
    for the coming decade of digital brain research To discuss it with the research
    community at large, with the aim of identifying points of convergence and common
    goals To provide a scientific framework for current and future development of
    EBRAINS To inform and engage stakeholders, funding organizations and research
    institutions regarding future digital brain research To identify and address key
    ethical and societal issues While we do not claim that there is a ‘one size fits
    all’ approach to addressing these aspects, we are convinced that discussions around
    the theme of digital brain research will help drive progress in the broader field
    of neuroscience.
