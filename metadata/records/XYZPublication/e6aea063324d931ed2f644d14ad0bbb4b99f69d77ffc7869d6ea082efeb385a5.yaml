- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Software competencies - as a user, developer, or proponent - become indispensible
    in today's digital scientific conduct. Yet, these competencies are not universally
    fostered in the German academic system. In a workshop hosted by the Volkswagen
    Stiftung in November 2024, 33 participants from different scientific fields and
    positions developed actionable recommendations for different target groups in
    or around academia to improve digital competency in science. The resulting white
    paper was published in German at doi.org/10.5281/zenodo.14273366. This poster
    is a visual presentation of the recommendations in this whitepaper and was prepared
    for the InformatikFestival 2025.  The sources for this poster (as an inkscape
    svg) can be found at https://hub.psychoinformatics.de/adina/FSKompPoster.
