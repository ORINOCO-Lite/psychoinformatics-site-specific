  value: Event-related potentials of social comparisons in depression and social anxiety
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Social comparison is central in human life and can be especially challenging
    in depression and social anxiety. We assessed event-related potentials and emotions
    when receiving feedback on both their own and a co-player’s performance, in participants
    with depression and/or social anxiety (n=63) and healthy controls (n=72). Participants
    reported more negative emotions for downward (being better than someone else)
    and upward (being worse) comparisons vs. even outcomes, with these effects being
    stronger in depression and social anxiety. At the Medial Frontal Negativity, both
    controls and depressed participants showed enhanced negativity for upward (participant
    wrong, co-player correct) comparison vs. both the participant and co-player performing
    wrong. Socially anxious subjects showed the opposite effect, possibly due to greater
    expectations about being worse than others. The P300 decreased for downward and
    upward comparisons compared to even outcomes, which may relate to the higher levels
    of conflict of social inequality. Depressed and socially anxious subjects showed
    a blunted P300 increase over time in response to the task outcomes, suggesting
    deficits in allocating resources for the attention of incoming social information.
    This may relate to difficulties in these disorders in learning how to deal with
    the cognitive/emotional demands of social comparison.
