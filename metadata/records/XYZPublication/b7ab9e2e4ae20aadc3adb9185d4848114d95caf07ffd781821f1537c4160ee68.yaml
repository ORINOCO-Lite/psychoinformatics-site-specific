attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Behavioral, Anatomical and Heritable Convergence of Affect and Cognition
    in Superior Frontal Cortex
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Cognitive abilities and affective experience are key human traits that are
    interrelated in behavior and brain. Individual variation of cognitive and affective
    traits, as well as brain structure, has been shown to partly underlie genetic
    effects. However, to what extent affect and cognition have a shared genetic relationship
    with local brain structure is incompletely understood. Here we studied phenotypic
    and genetic correlations of cognitive and affective traits in behavior and brain
    structure (cortical thickness, surface area and subcortical volumes) in the pedigree-based
    Human Connectome Project sample (N = 1091). Both cognitive and affective trait
    scores were highly heritable and showed significant phenotypic correlation on
    the behavioral level. Cortical thickness in the left superior frontal cortex showed
    a phenotypic association with both affect and cognition. Decomposing the phenotypic
    correlations into genetic and environmental components showed that the associations
    were accounted for by shared genetic effects between the traits. Quantitative
    functional decoding of the left superior frontal cortex further indicated that
    this region is associated with cognitive and emotional functioning. This study
    provides a multi-level approach to study the association between affect and cognition
    and suggests a convergence of both in superior frontal cortical thickness.
