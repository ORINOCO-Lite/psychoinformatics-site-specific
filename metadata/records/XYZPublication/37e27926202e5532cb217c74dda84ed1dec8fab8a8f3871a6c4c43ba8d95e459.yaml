attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Local activity alterations in individuals with autism correlate with neurotransmitter
    properties and ketamine-induced brain changes
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Autism is a neurodevelopmental condition associated with altered resting-state
    brain function. An increased excitation-inhibition ratio is discussed as a pathomechanism
    but in-vivo evidence of disturbed neurotransmission underlying functional alterations
    remains scarce. We compare local resting-state brain activity and neurotransmitter
    co-localizations between autism (N = 405, N = 395) and neurotypical controls (N
    = 473, N = 474) in two independent cohorts and correlate them with excitation-inhibition
    changes induced by glutamatergic (ketamine) and GABAergic (midazolam) medication.
    Autistic individuals exhibit consistent reductions in local activity, particularly
    in default mode network regions. The whole-brain differences spatially overlap
    with glutamatergic and GABAergic, as well as dopaminergic and cholinergic neurotransmission.
    Functional changes induced by NMDA-antagonist ketamine resemble the spatial pattern
    observed in autism. Our findings suggest that consistent local activity alterations
    in autism reflect widespread disruptions in neurotransmission and may be resembled
    by pharmacological modulation of the excitation-inhibition balance. These findings
    advance understanding of the neurophysiological basis of autism. Trial registration
    number: ACTRN12616000281493.'
