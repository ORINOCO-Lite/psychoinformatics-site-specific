attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Noninvasive brain stimulation in autism: review and outlook for personalized
    interventions in adult patients'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Noninvasive brain stimulation (NIBS) has been increasingly investigated during
    the last decade as a treatment option for persons with autism spectrum disorder
    (ASD). Yet, previous studies did not reach a consensus on a superior treatment
    protocol or stimulation target. Persons with ASD often suffer from social isolation
    and high rates of unemployment, arising from difficulties in social interaction.
    ASD involves multiple neural systems involved in perception, language, and cognition,
    and the underlying brain networks of these functional domains have been well documented.
    Aiming to provide an overview of NIBS effects when targeting these neural systems
    in late adolescent and adult ASD, we conducted a systematic search of the literature
    starting at 631 non-duplicate publications, leading to six studies corresponding
    with inclusion and exclusion criteria. We discuss these studies regarding their
    treatment rationale and the accordingly chosen methodological setup. The results
    of these studies vary, while methodological advances may allow to explain some
    of the variability. Based on these insights, we discuss strategies for future
    clinical trials to personalize the selection of brain stimulation targets taking
    into account intersubject variability of brain anatomy as well as function.
