- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'The general theme of this article is the connection between two topics which
    are well-researched on their own, but are hardly linked to each other: the debate
    on human enhancement and the meaning in life debate. More precisely, the article
    explores the claim whether there is reason to believe that enhancement techniques
    can undermine the meaning of one’s life.'
