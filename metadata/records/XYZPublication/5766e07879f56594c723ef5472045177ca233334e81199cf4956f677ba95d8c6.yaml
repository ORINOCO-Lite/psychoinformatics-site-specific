attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Individual characteristics outperform resting-state fMRI for the prediction
    of behavioral phenotypes
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: In this study, we aimed to compare imaging-based features of brain function,
    measured by resting-state fMRI (rsfMRI), with individual characteristics such
    as age, gender, and total intracranial volume to predict behavioral measures.
    We developed a machine learning framework based on rsfMRI features in a dataset
    of 20,000 healthy individuals from the UK Biobank, focusing on temporal complexity
    and functional connectivity measures. Our analysis across four behavioral phenotypes
    revealed that both temporal complexity and functional connectivity measures provide
    comparable predictive performance. However, individual characteristics consistently
    outperformed rsfMRI features in predictive accuracy, particularly in analyses
    involving smaller sample sizes. Integrating rsfMRI features with demographic data
    sometimes enhanced predictive outcomes. The efficacy of different predictive modeling
    techniques and the choice of brain parcellation atlas were also examined, showing
    no significant influence on the results. To summarize, while individual characteristics
    are superior to rsfMRI in predicting behavioral phenotypes, rsfMRI still conveys
    additional predictive value in the context of machine learning, such as investigating
    the role of specific brain regions in behavioral phenotypes.
