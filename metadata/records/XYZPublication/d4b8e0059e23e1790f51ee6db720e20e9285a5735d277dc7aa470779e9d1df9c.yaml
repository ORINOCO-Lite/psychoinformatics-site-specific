- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The mesiotemporal lobe (MTL) is implicated in many cognitive processes, is
    compromised in numerous brain disorders, and exhibits a gradual cytoarchitectural
    transition from six-layered parahippocampal isocortex to three-layered hippocampal
    allocortex. Leveraging an ultra-high-resolution histological reconstruction of
    a human brain, our study showed that the dominant axis of MTL cytoarchitectural
    differentiation follows the iso-to-allocortical transition and depth-specific
    variations in neuronal density. Projecting the histology-derived MTL model to
    in-vivo functional MRI, we furthermore determined how its cytoarchitecture underpins
    its intrinsic effective connectivity and association to large-scale networks.
    Here, the cytoarchitectural gradient was found to underpin intrinsic effective
    connectivity of the MTL, but patterns differed along the anterior-posterior axis.
    Moreover, while the iso-to-allocortical gradient parametrically represented the
    multiple-demand relative to task-negative networks, anterior-posterior gradients
    represented transmodal versus unimodal networks. Our findings establish that the
    combination of micro- and macrostructural features allow the MTL to represent
    dominant motifs of whole-brain functional organisation.
