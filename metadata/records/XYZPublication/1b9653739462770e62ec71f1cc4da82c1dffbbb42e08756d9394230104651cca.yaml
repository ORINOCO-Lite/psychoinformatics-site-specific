  value: Linking interindividual variability in brain structure to behaviour
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: What are the brain structural correlates of interindividual differences in
    behaviour? More than a decade ago, advances in structural MRI opened promising
    new avenues to address this question. The initial wave of research then progressively
    led to substantial conceptual and methodological shifts, and a replication crisis
    unveiled the limitations of traditional approaches, which involved searching for
    associations between local measurements of neuroanatomy and behavioural variables
    in small samples of healthy individuals. Given these methodological issues and
    growing scepticism regarding the idea of one-to-one mapping of psychological constructs
    to brain regions, new perspectives emerged. These not only embrace the multivariate
    nature of brain structure-behaviour relationships and promote generalizability
    but also embrace the representation of the relationships between brain structure
    and behavioural data by latent dimensions of interindividual variability. Here,
    we examine the past and present of the study of brain structure-behaviour associations
    in healthy populations and address current challenges and open questions for future
    investigations.
