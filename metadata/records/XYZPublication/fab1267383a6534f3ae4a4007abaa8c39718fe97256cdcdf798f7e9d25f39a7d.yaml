attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Profile of sleep disturbances in patients with recurrent depressive disorder
    or bipolar affective disorder in a tertiary sleep disorders service
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Bidirectional relationship between sleep disturbances and affective disorders
    is increasingly recognised, but its underlying mechanisms are far from clear,
    and there is a scarcity of studies that report on sleep disturbances in recurrent
    depressive disorder (RDD) and bipolar affective disorder (BPAD). To address this,
    we conducted a retrospective study of polysomnographic and clinical records of
    patients presenting to a tertiary sleep disorders clinic with affective disorders.
    Sixty-three BPAD patients (32 female; mean age ± S.D.: 41.8 ± 12.4 years) and
    126 age- and gender-matched RDD patients (62 female; 41.5 ± 12.8) were studied.
    Whilst no significant differences were observed in sleep macrostructure parameters
    between BPAD and RDD patients, major differences were observed in comorbid sleep
    and physical disorders, both of which were higher in BPAD patients. Two most prevalent
    sleep disorders, namely obstructive sleep apnoea (OSA) (BPAD 50.8.0% vs RDD 29.3%,
    P = 0.006) and insomnia (BPAD 34.9% vs RDD 15.0%, P = 0.005) were found to be
    strongly linked with BPAD. In summary, in our tertiary sleep clinic cohort, no
    overt differences in the sleep macrostructure between BPAD and RDD patients were
    demonstrated. However, OSA and insomnia, two most prevalent sleep disorders, were
    found significantly more prevalent in patients with BPAD, by comparison to RDD
    patients. Also, BPAD patients presented with significantly more severe OSA, and
    with higher overall physical co-morbidity. Thus, our findings suggest an unmet/hidden
    need for earlier diagnosis of those with BPAD.'
