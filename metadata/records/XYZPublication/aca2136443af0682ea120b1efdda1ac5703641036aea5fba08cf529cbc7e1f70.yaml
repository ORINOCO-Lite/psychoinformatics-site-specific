attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'NFDI-Neuro: building a community for neuroscience research data management
    in Germany'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Increasing complexity and volume of research data pose increasing challenges
    for scientists to manage their data efficiently. At the same time, availability
    and reuse of research data are becoming more and more important in modern science.
    The German government has established an initiative to develop research data management
    (RDM) and to increase accessibility and reusability of research data at the national
    level, the Nationale Forschungsdateninfrastruktur (NFDI). The NFDI Neuroscience
    (NFDI-Neuro) consortium aims to represent the neuroscience community in this initiative.
    Here, we review the needs and challenges in RDM faced by researchers as well as
    existing and emerging solutions and benefits, and how the NFDI in general and
    NFDI-Neuro specifically can support a process for making these solutions better
    available to researchers. To ensure development of sustainable research data management
    practices, both technical solutions and engagement of the scientific community
    are essential. NFDI-Neuro is therefore focusing on community building just as
    much as on improving the accessibility of technical solutions.
