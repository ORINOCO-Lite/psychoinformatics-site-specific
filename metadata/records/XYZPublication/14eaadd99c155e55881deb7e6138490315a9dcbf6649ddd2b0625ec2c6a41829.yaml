- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Sensory target detection at local and global timescales reveals a hierarchy
    of supramodal dynamics in the human cortex
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: To ensure survival in a dynamic environment, the human neocortex monitors
    input streams from different sensory organs for important sensory events. Which
    principles govern whether different senses share common or modality-specific brain
    networks for sensory target detection? We examined whether complex targets evoke
    sustained supramodal activity while simple targets rely on modality-specific networks
    with short-lived supramodal contributions. In a series of hierarchical multisensory
    target detection studies (n = 77, of either sex) using EEG, we applied a temporal
    cross-decoding approach to dissociate supramodal and modality-specific cortical
    dynamics elicited by rule-based global and feature-based local sensory deviations
    within and between the visual, somatosensory, and auditory modality. Our data
    show that each sense implements a cortical hierarchy orchestrating supramodal
    target detection responses, which operate at local and global timescales in successive
    processing stages. Across different sensory modalities, simple feature-based sensory
    deviations presented in temporal vicinity to a monotonous input stream triggered
    a mismatch negativity-like local signal which decayed quickly and early, whereas
    complex rule-based targets tracked across time evoked a P3b-like global neural
    response which generalized across a late time window. Converging results from
    temporal cross-modality decoding analyses across different datasets, we reveal
    that global neural responses are sustained in a supramodal higher-order network,
    whereas local neural responses canonically thought to rely on modality-specific
    regions evolve into short-lived supramodal activity. Together, our findings demonstrate
    that cortical organization largely follows a gradient in which short-lived modality-specific
    as well as supramodal processes dominate local responses, whereas higher-order
    processes encode temporally extended abstract supramodal information fed forward
    from modality-specific cortices.
