  value: This dataset contains the distinct architectonic Area 6d1 (PreG) in the individual,
    single subject template of the MNI Colin 27 as well as the MNI ICBM 152 2009c
    nonlinear asymmetric reference space. As part of the JuBrain cytoarchitectonic
    atlas, the area was identified using cytoarchitectonic analysis on cell-body-stained
    histological sections of 10 human postmortem brains obtained from the body donor
    program of the University of Düsseldorf. The results of the cytoarchitectonic
    analysis were then mapped to both reference spaces, where each voxel was assigned
    the probability to belong to Area 6d1 (PreG). The probability map of Area 6d1
    (PreG) are provided in the NifTi format for each brain reference space and hemisphere.
    The JuBrain atlas relies on a modular, flexible and adaptive framework containing
    workflows to create the probabilistic brain maps for these structures. Note that
    methodological improvements and integration of new brain structures may lead to
    small deviations in earlier released datasets.
description: This dataset contains the distinct architectonic Area 6d1 (PreG) in the
  individual, single subject template of the MNI Colin 27 as well as the MNI ICBM
  152 2009c nonlinear asymmetric reference space. As part of the JuBrain cytoarchitectonic
  atlas, the area was identified using cytoarchitectonic analysis on cell-body-stained
  histological sections of 10 human postmortem brains obtained from the body donor
  program of the University of Düsseldorf. The results of the cytoarchitectonic analysis
  were then mapped to both reference spaces, where each voxel was assigned the probability
  to belong to Area 6d1 (PreG). The probability map of Area 6d1 (PreG) are provided
  in the NifTi format for each brain reference space and hemisphere. The JuBrain atlas
  relies on a modular, flexible and adaptive framework containing workflows to create
  the probabilistic brain maps for these structures. Note that methodological improvements
  and integration of new brain structures may lead to small deviations in earlier
  released datasets.
