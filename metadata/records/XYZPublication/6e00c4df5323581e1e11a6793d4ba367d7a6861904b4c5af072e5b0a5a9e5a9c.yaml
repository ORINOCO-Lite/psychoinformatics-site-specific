  value: Neural signatures underlying deliberation in human foraging decisions
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Humans have a remarkable capacity to mentally project themselves far ahead
    in time. This ability, which entails the mental simulation of events, is thought
    to be fundamental to deliberative decision making, as it allows us to search through
    and evaluatepossible choices. Many decisions that humans make are foraging decisions,
    in which one must decide whether an available offer is worth taking, when compared
    to unknown future possibilities (i.e., the background). Using a translational
    decision-makingparadigm designed to reveal decision preferences in rats, we found
    that humans engaged in deliberation when making foraging decisions. A key feature
    of this task is that preferences (and thus, value) are revealed as a function
    of serial choices. Like rats,humans also took longer to respond when faced with
    difficult decisions near their preference boundary, which was associated with
    prefrontal and hippocampal activation, exemplifying cross-species parallels in
    deliberation. Furthermore, we found thatvoxels within the visual cortices encoded
    neural representations of the available possibilities specifically following regretinducing
    experiences, in which the subject had previously rejected a good offer only to
    encounter a low-valued offer on thesubsequent trial.
