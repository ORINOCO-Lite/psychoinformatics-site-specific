  value: Neuroenhancement hat die Verbesserung der mentalen Eigenschaften, Fähigkeiten
    und Leistung einer Person zum Gegenstand. Die verschiedenen Techniken des Neuroenhancement
    bieten neuartige Möglichkeiten der Verbesserung, bergen jedoch auch signifikante
    Gefahren. Neuroenhancement stellt folglich sowohl Personen als auch die Gesellschaft
    im Ganzen vor umfassende normative Herausforderungen. Der vorliegende Sachstandsbericht
    bietet einen konzisen Überblick über die gegenwärtige Neuroenhancement-Debatte.
    Definition, Techniken und Zwecke des Neuroenhancement werden erörtert und Argumente
    für und wider seine Anwendung auf personaler, interpersonaler sowie sozialpolitischer
    Ebene untersucht
