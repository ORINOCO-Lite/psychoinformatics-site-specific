attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Testosterone and the Amygdala’s Functional Connectivity in Women and Men
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The amygdala contains androgen receptors and is involved in various affective
    and social functions. An interaction between testosterone and the amygdala’s functioning
    is likely. We investigated the amygdala’s resting-state functional connectivity
    (rsFC) network in association with testosterone in 94 healthy young adult women
    and men (final data available for analysis from 42 women and 39 men). Across the
    whole sample, testosterone was positively associated with the rsFC between the
    right amygdala and the right middle occipital gyrus, and it further predicted
    lower agreeableness scores. Significant sex differences appeared for testosterone
    and the functional connectivity between the right amygdala and the right superior
    frontal gyrus (SFG), showing higher testosterone levels with lower connectivity
    in women. Sex further predicted the openness and agreeableness scores. Our results
    show that testosterone modulates the rsFC between brain areas involved in affective
    processing and executive functions. The data indicate that the cognitive control
    of the amygdala via the frontal cortex is dependent on the testosterone levels
    in a sex-specific manner. Testosterone seems to express sex-specific patterns
    (1) in networks processing affect and cognition, and (2) in the frontal down-regulation
    of the amygdala. The sex-specific coupling between the amygdala and the frontal
    cortex in interaction with the hormone levels may drive sex-specific differences
    in a variety of behavioral phenomena that are further associated with psychiatric
    illnesses that show sex-specific prevalence rates.
