attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Subcortical structures and visual divergent thinking: a resting-state functional
    MRI analysis'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: An increasing number of studies have found that a few, specific subcortical
    regions are involved in creative visual divergent thinking. In addition, creative
    thinking is heavily reliant on the fronto-striatal dopaminergic pathways. This
    study aimed to explore whether spontaneous fluctuations in the subcortex, which
    contribute to our creative abilities, showed significant differences between individuals
    with different levels of creativity based on resting-state functional magnetic
    resonance imaging data. We calculated subcortical regions’ seed-wise and dynamic
    functional connectivity (dFC), and then examined the differences between the high
    and low visual creativity groups. Furthermore, the topological properties of the
    subcortical network were measured, and their relationship with creative visual
    divergent thinking was calculated using brain–behavior correlation analyses. The
    results showed that functional connectivity (FC) between the putamen, pallidum,
    and thalamus indicated group differences within the subcortex. Whole-brain FC
    results showed group differences across subcortical (i.e., the thalamus and pallidum)
    and cerebral regions (i.e., the insula, middle frontal gyrus, and middle temporal
    gyrus). In addition, subcortical FC demonstrated a positive correlation with visual
    divergent thinking scores across the pallidum, putamen, and thalamus. Our findings
    provide novel insights into the relationship between visual divergent thinking
    and the activities of the subcortex. It is likely that not only fronto-striatal
    dopaminergic pathways, but also “motor” pathways, are involved in creative visual
    divergent thinking processing.
