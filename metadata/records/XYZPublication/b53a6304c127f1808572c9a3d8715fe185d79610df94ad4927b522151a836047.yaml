  value: Characterizing the gradients of structural covariance in the human hippocampus
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The hippocampus is a plastic brain structure that has been associated with
    a range ofbehavioral aspects but also shows vulnerability to the most frequent
    neurocognitivediseases. Different aspects of its organization have been revealed
    by studies probingits different neurobiological properties. In particular, histological
    work has shown apattern of differentiation along the proximal-distal dimension,
    while studies examiningfunctional properties and large-scale functional integration
    have primarily highlighted apattern of differentiation along the anterior-posterior
    dimension. To better understandhow these organizational dimensions underlie the
    pattern of structural covariance (SC)in the human hippocampus, we here applied
    a non-linear decomposition approach,disentangling the major modes of variation,
    to the pattern of grey matter volumecorrelation of hippocampus voxels with the
    rest of the brain in a sample of 377 healthyyoung adults. We additionally investigated
    the consistency of the derived gradients inan independent sample of life-span
    adults and also examined the relationshipsbetween these major modes of variations
    and the patterns derived from microstructureand functional connectivity mapping.
    Our results showed that similar major modes ofSC-variability are identified across
    the two independent datasets. The major dimensionof variation found in SC runs
    along the hippocampal anterior-posterior axis andfollowed closely the principal
    dimension of functional differentiation, suggesting aninfluence of network level
    interaction in this major mode of morphological variability.The second main mode
    of variability in the SC showed a gradient along the dorsalventralaxis, and was
    moderately related to variability in hippocampal microstructuralproperties. Thus
    our results depicting relatively reliable patterns of SC-variability withinthe
    hippocampus show an interplay between the already known organizationalprinciples
    on the pattern of variability in hippocampus' macrostructural properties. Thisstudy
    hence provides a first insight on the underlying organizational forces generatingdifferent
    co-plastic modes within the human hippocampus that may, in turn, help tobetter
    understand different vulnerability patterns of this crucial structure in differentneurological
    and psychiatric diseases.
