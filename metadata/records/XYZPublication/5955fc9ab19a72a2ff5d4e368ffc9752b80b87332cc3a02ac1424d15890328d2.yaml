attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Shared and Specific Neural Correlates of Attention Deficit Hyperactivity
    Disorder and Autism Spectrum Disorder: A Meta-Analysis of 243 Task-Based Functional
    MRI Studies'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Objective:To investigate shared and specific neural correlates of cognitive
    functions in attention deficit hyperactivity disorder (ADHD) and autism spectrum
    disorder (ASD), the authors performed a comprehensive meta-analysis and considered
    a balanced set of neuropsychological tasks across the two disorders.Methods:A
    broad set of electronic databases was searched up to December 4, 2022, for task-based
    functional MRI studies investigating differences between individuals with ADHD
    or ASD and typically developing control subjects. Spatial coordinates of brain
    loci differing significantly between case and control subjects were extracted.
    To avoid potential diagnosis-driven selection bias of cognitive tasks, the tasks
    were grouped according to the Research Domain Criteria framework, and stratified
    sampling was used to match cognitive component profiles. Activation likelihood
    estimation was used for the meta-analysis.Results:After screening 20,756 potentially
    relevant references, a meta-analysis of 243 studies was performed, which included
    3,084 participants with ADHD (676 females), 2,654 participants with ASD (292 females),
    and 6,795 control subjects (1,909 females). ASD and ADHD showed shared greater
    activations in the lingual and rectal gyri and shared lower activations in regions
    including the middle frontal gyrus, the parahippocampal gyrus, and the insula.
    By contrast, there were ASD-specific greater and lower activations in regions
    including the left middle temporal gyrus and the left middle frontal gyrus, respectively,
    and ADHD-specific greater and lower activations in the amygdala and the global
    pallidus, respectively.Conclusions:Although ASD and ADHD showed both shared and
    disorder-specific standardized neural activations, disorder-specific activations
    were more prominent than shared ones. Functional brain differences between ADHD
    and ASD are more likely to reflect diagnosis-related pathophysiology than bias
    from the selection of specific neuropsychological tasks.
