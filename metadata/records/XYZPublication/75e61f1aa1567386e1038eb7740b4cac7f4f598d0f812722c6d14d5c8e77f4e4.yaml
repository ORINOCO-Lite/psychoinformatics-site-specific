- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Interindividual differences in matrix reasoning are linked to functional
    connectivity between brain regions nominated by Parieto-Frontal Integration Theory
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The Parieto-Frontal Integration Theory (P-FIT) predicts that human intelligence
    is closely linked to structural and functional properties of several brain regions
    mainly located in the parietal and frontal cortices. It also proposes that solving
    abstract reasoning tasks involves multiple processing stages and thus requires
    the harmonic interplay of these brain regions. However, empirical studies directly
    investigating the relationship between intellectual performance and the strength
    of individual functional connections related to the P-FIT network are scarce.
    Here we demonstrate, in two independent samples comprising a total of 1489 healthy
    individuals, that fMRI resting- state connectivity, especially between P-FIT regions,
    is associated with interindividual differences in matrix reasoning performance.
    Interestingly, respective associations were only present in the overall samples
    and the female subsamples but not in the male subsamples, indicating a sex-specific
    effect. We found five statistically significant connections which replicated across
    both samples. These were constituted by BAs 8, 10, 22, 39, 46, and 47 in the left
    as well as BAs 44 and 45 in the right hemisphere. Given that many of these brain
    regions are predominantly involved in language processing, we hypothesized that
    our results reflect the importance of inner speech for solving matrix reasoning
    tasks. Complementary to previous research investigating the association between
    intelligence and functional brain connectivity by means of comprehensive network
    metrics, our study is the first to identify specific connections from the P-FIT
    network whose functional connectivity strength at rest can be considered an indicator
    of intellectual capability.
