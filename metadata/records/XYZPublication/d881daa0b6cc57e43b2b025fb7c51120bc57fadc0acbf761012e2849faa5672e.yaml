- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Sleep deprivation (SD) is a common problem in modern societies, which leads
    to cognitive dysfunctions includingattention lapses, impaired working memory,
    hindering decision making, impaired emotional processing, and motorvehicle accidents.
    Numerous neuroimaging studies have investigated the neural correlates of SD, but
    these studieshave reported inconsistent results. Thus, we aimed to identify convergent
    patterns of abnormal brain functions due toacute SD. Based on the preferred reporting
    for systematic reviews and meta-analyses statement, we searched thePubMed database
    and performed reference tracking and finally retrieved 31 eligible functional
    neuroimaging studies.Then, we applied activation estimation likelihood meta-analysis
    and found reduced activity mainly in the rightintraparietal sulcus and superior
    parietal lobule. The functional decoding analysis using the BrainMap databaseindicated
    that this region is mostly related to visuospatial perception, memory and reasoning.
    The significant coactivationof this region using the BrainMap database were found
    in the left superior parietal lobule, intraparietalsulcus, bilateral occipital
    cortex, left fusiform gyrus and thalamus. This region also connected with the
    superior parietallobule, intraparietal sulcus, insula, inferior frontal gyrus,
    precentral, occipital and cerebellum through resting-statefunctional connectivity
    in healthy subjects. Taken together, our findings highlight the role of superior
    parietal cortex inSD.
