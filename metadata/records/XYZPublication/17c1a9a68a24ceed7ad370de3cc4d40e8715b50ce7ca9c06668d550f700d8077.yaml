attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Lifetime exposure to depression and neuroimaging measures of brain structure
    and function
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Importance  Despite decades of neuroimaging studies reporting brain structural
    and functional alterations in depression, discrepancies in findings across studies
    and limited convergence across meta-analyses have raised questions about the consistency
    and robustness of the observed brain phenotypes.Objective  To investigate the
    associations between 6 operational criteria of lifetime exposure to depression
    and functional and structural neuroimaging measures.Design, Setting, and Participants  This
    cross-sectional study analyzed data from a UK Biobank cohort of individuals aged
    45 to 80 years who were enrolled between January 1, 2014, and December 31, 2018.
    Participants included individuals with a lifetime exposure to depression and matched
    healthy controls without indications of psychosis, mental illness, behavior disorder,
    and disease of the nervous system. Six operational criteria of lifetime exposure
    to depression were evaluated: help seeking for depression; self-reported depression;
    antidepressant use; depression definition by Smith et al; hospital International
    Statistical Classification of Diseases and Related Health Problems, Tenth Revision
    (ICD-10) diagnosis codes F32 and F33; and Composite International Diagnostic Interview
    Short Form score. Six increasingly restrictive depression definitions and groups
    were defined based on the 6 depression criteria, ranging from meeting only 1 criterion
    to meeting all 6 criteria. Data were analyzed between January and October 2022.Main
    Outcomes and Measures  Functional measures were calculated using voxel-wise fractional
    amplitude of low-frequency fluctuation (fALFF), global correlation (GCOR), and
    local correlation (LCOR). Structural measures were calculated using gray matter
    volume (GMV).Results  The study included 20 484 individuals with lifetime depression
    (12 645 females [61.7%]; mean [SD] age, 63.91 [7.60] years) and 25 462 healthy
    controls (14 078 males [55.3%]; mean [SD] age, 65.05 [7.8] years). Across all
    depression criteria, individuals with lifetime depression displayed regionally
    consistent decreases in fALFF, LCOR, and GCOR (Cohen d range, −0.53 [95% CI, −0.88
    to −0.15] to −0.04 [95% CI, −0.07 to −0.01]) but not in GMV (Cohen d range, −0.47
    [95 % CI, −0.75 to −0.12] to 0.26 [95% CI, 0.15-0.37]). Hospital ICD-10 diagnosis
    codes F32 and F33 (median [IQR] difference in effect sizes, −0.14 [−0.17 to −0.11])
    and antidepressant use (median [IQR] difference in effect sizes, −0.12 [−0.16
    to −0.10]) were criteria associated with the most pronounced alterations.Conclusions
    and Relevance  Results of this cross-sectional study indicate that lifetime exposure
    to depression was associated with robust functional changes, with a more restrictive
    depression definition revealing more pronounced alterations. Different inclusion
    criteria for depression may be associated with the substantial variation in imaging
    findings reported in the literature.'
