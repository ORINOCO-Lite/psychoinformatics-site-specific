attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: How Machine Learning is Powering Neuroimaging to Improve Brain Health
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: This report presents an overview of how machine learning is rapidly advancing
    clinical translational imaging in ways that will aid in the early detection, prediction,
    and treatment of diseases that threaten brain health. Towards this goal, we aresharing
    the information presented at a symposium, “Neuroimaging Indicators of Brain Structure
    and Function - Closing the Gap Between Research and Clinical Application”, co-hosted
    by the McCance Center for Brain Health at Mass General Hospital and the MIT HST
    Neuroimaging Training Program on February 12, 2021. The symposium focused on the
    potential for machine learning approaches, applied to increasingly large-scale
    neuroimaging datasets, to transform healthcare delivery and change the trajectory
    of brain health by addressing brain care earlier in the lifespan. While not exhaustive,
    this overview uniquely addresses many of the technical challenges from image formation,
    to analysis and visualization, to synthesis and incorporation into the clinical
    workflow. Some of the ethical challenges inherent to this work are also explored,
    as are some of the regulatory requirements for implementation. We seek to educate,
    motivate, and inspire graduate students, postdoctoral fellows, and early career
    investigators to contribute to a future where neuroimaging meaningfully contributes
    to the maintenance of brain health.
