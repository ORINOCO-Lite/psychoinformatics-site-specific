  value: Künstliche Intelligenz in der Behandlung von Diabetes bei minderjährigen
    Patienten – Ethische Aspekte
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: In diesem Kapitel befassen wir uns mit Kindern, die an Diabetes erkrankt
    sind, und der Rolle, die künstliche Intelligenz (KI) auf deren Weg als Patienten
    spielen kann. Als Ethiker nutzen wir diesen Fall, um die wichtigsten ethischen
    Fragen zu untersuchen, die sich aus dem Einsatz medizinischer künstlicher Intelligenz
    zur Unterstützung der Diagnose und Behandlung von Diabetes ergeben. Die Einführung
    von KI in die Pädiatrie ist bereits im Gange und lässt sich nicht mehr aufhalten.
    Wir zeigen auf, welche die wichtigsten ethischen Kriterien sind, die beachtet
    werden sollten, und kommen zu dem Schluss, dass die Anwendung von KI-Technologien
    in der Pädiatrie wahrscheinlich sehr positive Auswirkungen haben wird, wenn die
    Anforderungen der Moral erfüllt werden.
