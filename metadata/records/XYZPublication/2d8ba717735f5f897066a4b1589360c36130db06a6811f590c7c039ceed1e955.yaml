  value: 'GAN-MAT: Generative adversarial network-based microstructural profile covariance
    analysis toolbox'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Multimodal magnetic resonance imaging (MRI) provides complementary information
    for investigating brain structure and function; for example, an in vivo microstructure-sensitive
    proxy can be estimated using the ratio between T1- and T2-weighted structural
    MRI. However, acquiring multiple imaging modalities is challenging in patients
    with inattentive disorders. In this study, we proposed a comprehensive framework
    to provide multiple imaging features related to the brain microstructure using
    only T1-weighted MRI. Our toolbox consists of (i) synthesizing T2-weighted MRI
    from T1-weighted MRI using a conditional generative adversarial network; (ii)
    estimating microstructural features, including intracortical covariance and moment
    features of cortical layer-wise microstructural profiles; and (iii) generating
    a microstructural gradient, which is a low-dimensional representation of the intracortical
    microstructure profile. We trained and tested our toolbox using T1- and T2-weighted
    MRI scans of 1,104 healthy young adults obtained from the Human Connectome Project
    database. We found that the synthesized T2-weighted MRI was very similar to the
    actual image and that the synthesized data successfully reproduced the microstructural
    features. The toolbox was validated using an independent dataset containing healthy
    controls and patients with episodic migraine as well as the atypical developmental
    condition of autism spectrum disorder. Our toolbox may provide a new paradigm
    for analyzing multimodal structural MRI in the neuroscience community.
