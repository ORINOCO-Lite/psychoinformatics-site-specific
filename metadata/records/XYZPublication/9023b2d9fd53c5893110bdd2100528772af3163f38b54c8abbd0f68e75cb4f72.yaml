  value: Lightweight data publishing on Jülich Data with DataLad
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Jülich DATA is the central institutional repository for research data of
    the Research Center Jülich and supports sharing, preserving, citing, exploring,
    and analyzing research data with descriptive metadata, without hosting large files.
    In this tutorial, participants will discover how DataLad can integrate with Dataverse
    and have the best of both worlds: Discoverability and metadata with Jülich DATA,
    and actionable data tracking with DataLad. With conceptual and hands-on elements,
    we will learn how to publish or clone lightweight DataLad datasets to and from
    Jülich DATA.'
