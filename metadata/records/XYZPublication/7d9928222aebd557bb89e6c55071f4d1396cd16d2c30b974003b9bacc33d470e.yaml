  value: Is the Current Informed Consent Model Flawed?
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Informed consent is a widely acknowledged ethical principle that plays a
    crucial role, both in research ethics and medical ethics. However, empirical findings
    as well as theoretical considerations suggest that the current model of informed
    consent might be flawed. In particular, the understanding of information disclosed
    to patients and research participants during the consent process proves to be
    limited. This, in turn, casts serious doubt on the validity of the consent. In
    this paper, we will review the current state of research on informed consent and
    discuss the charge of inadequacy. Subsequently, we will examine some suggestions
    that have been presented in the literature to improve the current model of informed
    consent. At the end, we will summarize the current state of the discussion and
    give a brief outlook on future developments.
