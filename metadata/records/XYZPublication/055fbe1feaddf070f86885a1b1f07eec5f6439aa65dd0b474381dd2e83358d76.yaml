attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Inter‐ and intra‐subject similarity in network functional connectivity across
    a full narrative movie
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Naturalistic paradigms, such as watching movies during functional magnetic
    resonance imaging, are thought to prompt the emotional and cognitive processes
    typically elicited in real life situations. Therefore, naturalistic viewing (NV)
    holds great potential for studying individual differences. Previous studies have
    primarily focused on using shorter movie clips, geared toward eliciting specific
    and often isolated emotions, while the potential behind using full narratives
    depicted in commercial movies as a proxy for real-life experiences has barely
    been explored. Here, we offer preliminary evidence that a full narrative movie
    (FNM), that is, a movie covering a complete narrative arc, can capture complex
    socio-affective dynamics and their links to individual differences. Using the
    studyforrest dataset, we investigated inter- and intra-subject similarity in network
    functional connectivity (NFC) of 14 meta-analytically defined networks across
    a full narrative, audio-visual movie split into eight consecutive movie segments.
    We characterized the movie segments by valence and arousal portrayed within the
    sequences, before utilizing a linear mixed model to analyze which factors explain
    inter- and intra-subject similarity. Our results show that the model best explaining
    inter-subject similarity comprised network, movie segment, valence and a movie
    segment by valence interaction. Intra-subject similarity was influenced significantly
    by the same factors and an additional three-way interaction between movie segment,
    valence and arousal. Overall, inter- and intra-subject similarity in NFC were
    sensitive to the ongoing narrative and emotions in the movie. We conclude that
    FNMs offer complex content and dynamics that might be particularly valuable for
    studying individual differences. Further characterization of movie features, such
    as the overarching narratives, that enhance individual differences is needed for
    advancing the potential of NV research.Keywords: individual differences; meta‐analytical
    networks; movie fMRI; naturalistic viewing; network functional connectivity.'
