attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Co-representation of functional brain networks is shaped by cortical myeloarchitecture
    and reveals individual behavioral ability
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Large-scale functional networks are spatially distributed in the human brain.
    Despite recent progress in differentiating the functional roles of specific brain
    networks, how the brain navigates the spatial coordination among them and the
    biological relevance of this coordination is still not fully understood. Capitalizing
    on canonical individualized networks derived from functional MRI data, we proposed
    a new concept, i.e., co-representation of functional brain networks, to delineate
    the spatial coordination among them. To further quantify the co-representation
    pattern, we defined two indexes, i.e., the co-representation specificity (CoRS)
    and intensity (CoRI), for separately measuring the extent of specific and average
    expression of functional networks at each brain location by using the data from
    both sexes. We found that the identified pattern of co-representation was anchored
    by cortical regions with three types of cytoarchitectural classes along a sensory-fugal
    axis, including, at the first end, primary (idiotypic) regions showing high CoRS,
    at the second end, heteromodal regions showing low CoRS and high CoRI, at the
    third end, paralimbic regions showing low CoRI. Importantly, we demonstrated the
    critical role of myeloarchitecture in sculpting the spatial distribution of co-representation
    by assessing the association with the myelin-related neuroanatomical and transcriptomic
    profiles. Furthermore, the significance of manifesting the co-representation was
    revealed in its prediction of individual behavioral ability. Our findings indicated
    that the spatial coordination among functional networks was built upon an anatomically
    configured blueprint to facilitate neural information processing, while advancing
    our understanding of the topographical organization of the brain by emphasizing
    the assembly of functional networks.
