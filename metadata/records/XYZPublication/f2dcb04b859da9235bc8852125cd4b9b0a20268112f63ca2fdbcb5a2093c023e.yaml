attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Impact of sample size and regression of tissue‐specific signals on effective
    connectivity within the core default mode network
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Interactions within brain networks are inherently directional, which are
    inaccessible to classical functional connectivity estimates from resting-state
    functional magnetic resonance imaging (fMRI) but can be detected using spectral
    dynamic causal modeling (DCM). The sample size and unavoidable presence of nuisance
    signals during fMRI measurement are the two important factors influencing the
    stability of group estimates of connectivity parameters. However, most recent
    studies exploring effective connectivity (EC) have been conducted with small sample
    sizes and minimally pre-processed datasets. We explore the impact of these two
    factors by analyzing clean resting-state fMRI data from 330 unrelated subjects
    from the Human Connectome Project database. We demonstrate that both the stability
    of the model selection procedures and the inference of connectivity parameters
    are highly dependent on the sample size. The minimum sample size required for
    stable DCM is approximately 50, which may explain the variability of the DCM results
    reported so far. We reveal a stable pattern of EC within the core default mode
    network computed for large sample sizes and demonstrate that the use of subject-specific
    thresholded whole-brain masks for tissue-specific signals regression enhances
    the detection of weak connections.
