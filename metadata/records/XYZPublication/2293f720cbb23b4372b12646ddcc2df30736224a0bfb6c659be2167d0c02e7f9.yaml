description: 'The studyforrest (http://studyforrest.org) dataset is likely the largest
  neuroimag-ing dataset on natural language and story processing publicly available
  today. In this article, along with a companion publication, we present an update
  of this dataset that extends its scope to vision and multi-sensory research. 15
  participants of the original cohort volunteered for a series of additional studies:
  a clinical examination of visual function, a standard retinotopic mapping procedure,
  and a localization of higher visual areas — such as the fusiform face area. The
  combination of this update, the previous data releases for the dataset, and the
  companion publication, which includes neuroimaging and eye tracking data from natural
  stimulation with a motion picture, form an extremely versatile and comprehensive
  resource for brain imaging research — with almost six hours of functional neuroimaging
  data across five different stimulation paradigms for each participant. Furthermore,
  we describe employed paradigms and present results that document the quality of
  the data for the purpose of characterising major properties of participants’ visual
  processing stream'
