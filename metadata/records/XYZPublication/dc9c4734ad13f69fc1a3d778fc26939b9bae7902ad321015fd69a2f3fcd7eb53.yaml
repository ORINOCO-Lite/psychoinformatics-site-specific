description: 'The HIDA PhD Kick-Off Days in the HIDA Hub are an onboarding event tailored
  to new PhD students from all 7 Helmholtz Information and Data Science Schools: MUDS,
  DASHH, MarDATA, HDS-LEE, HEIBRiDS, HIDSS4Health, and IDEAS. These are the slides
  for Workshop 3: Reproducibility in science: What it is and why to care, with examples
  from the DataLad World (May 6th 2026, 2-4pm)






  A rendering of these slides can be found at files.inm7.de/adina/talks/html/hida2026.html#/.


   










  Abstract:







  The reproproducibilty of findings is the foundation of trustworthy science in every
  data-driven discipline. But beyond what may seem like an abstract quality of scientific
  conduct: Whether it concerns the premises of your PhD thesis or the code that needs
  to be rerun to respond to reviewer 2s comments on your manuscript, reproducibility
  is directly relevant to your work. When done right and from the very beginning,
  reproducible practices make your current and future life easier.This workshops looks
  at reproducibility from a technical perspective, and introduces a range of tools
  and concepts to help you understand why reproducibility is important and how you
  can achieve it. Participants will work through hands-on examples that they should
  easily translate to their own work. A specific but not exclusive focus will lie
  on the DataLad ecosystem (datalad.org).



   


   '
