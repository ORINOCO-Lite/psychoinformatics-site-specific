attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Prediction of response to repetitive transcranial magnetic stimulation in
    phantom sounds based on individual brain anatomy
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Noninvasive brain stimulation can reduce severity of tinnitus phantom sounds
    beyond time of stimulation by inducing regional neuroplastic changes. However,
    there are no good clinical predictors for treatment outcome. We used machine learning
    to investigate whether brain anatomy can predict therapeutic outcome. Sixty-one
    chronic tinnitus patients received repetitive transcranial magnetic stimulation
    of left dorsolateral prefrontal and temporal cortex. Before repetitive transcranial
    magnetic stimulation, a structural magnetic resonance image was obtained from
    all patients. To predict individual treatment response in new subjects, we employed
    a support-vector machine ensemble for individual out-of-sample prediction. In
    the cross-validation, the support-vector machine ensemble based on stratified
    subsampling and feature selection yielded an area under the curve of 0.87 for
    prediction of therapy success in new, previously unseen subjects. This corresponded
    to a balanced accuracy of 83.5%, sensitivity of 77.2%, and specificity of 87.2%.
    Investigating the most selected features showed the involvement of auditory cortex
    but also revealed a network of nonauditory brain areas. These findings suggest
    that idiosyncratic brain patterns accurately predict individual responses to repetitive
    transcranial magnetic stimulation treatment for tinnitus. Our findings may hence
    pave the way for future investigations into precision treatment of tinnitus, involving
    automatic identification of the appropriate treatment method for the individual
    patient.
