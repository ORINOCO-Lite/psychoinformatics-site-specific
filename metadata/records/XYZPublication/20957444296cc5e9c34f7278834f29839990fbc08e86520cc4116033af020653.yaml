  value: Narrows, Detours, and Dead Ends—How Cognitive Scaffolds Can Constrain the
    Mind
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'The chapter challenges the notion that cognitive tools are universally beneficial
    and should always be deeply integrated into cognitive systems. Instead, it proposes
    a taxonomy that recognizes the existence of hostile and detrimental tools and
    suggests that some tools might be better suited remaining on the periphery of
    an extended cognitive system. The chapter explores the moral implications of deep
    integration between cognitive tools and systems, highlighting three potential
    detriments: narrows, detours, and dead ends. These adverse effects present moral
    challenges and call for cautious consideration during technology development.
    The text emphasizes that the list of detrimental effects is likely to expand as
    technology advances and further investigations uncover additional impacts on cognitive
    systems.'
