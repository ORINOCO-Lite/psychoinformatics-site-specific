- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Algorithmic biases that favor majority populations pose a key challenge to
    the application of machine learning for precision medicine. Here, we assessed
    such bias in prediction models of behavioral phenotypes from brain functional
    magnetic resonance imaging. We examined the prediction bias using two independent
    datasets (preadolescent versus adult) of mixed ethnic/racial composition. When
    predictive models were trained on data dominated by white Americans (WA), out-of-sample
    prediction errors were generally higher for African Americans (AA) than for WA.
    This bias toward WA corresponds to more WA-like brain-behavior association patterns
    learned by the models. When models were trained on AA only, compared to training
    only on WA or an equal number of AA and WA participants, AA prediction accuracy
    improved but stayed below that for WA. Overall, the results point to the need
    for caution and further research regarding the application of current brain-behavior
    prediction models in minority populations.
