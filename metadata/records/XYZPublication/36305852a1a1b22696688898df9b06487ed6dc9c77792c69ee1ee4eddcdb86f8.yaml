  value: Towards clinical applications of movie fMRI
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: AbstractAs evidenced by the present special issue, movie fMRI is emerging
    as a powerful tool for exploring brain function and characterizing its variation
    across individuals. Here, we provide a brief perspective on the potential of movie
    fMRI for advancing the discovery of brain imaging-based markers of psychiatric
    illness. We discuss relevant gaps and opportunities in movie fMRI, and propose
    community-level models that might accelerate the pace of discovery of fMRI-based
    biomarkers in psychiatry.
