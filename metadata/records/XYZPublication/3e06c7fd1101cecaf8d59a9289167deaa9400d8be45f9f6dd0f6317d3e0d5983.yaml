  value: Volume of the Dentate Gyrus/CA4 Hippocampal subfield mediates the interplay
    between sleep quality and depressive symptoms
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: BackgroundEmerging evidence increasingly suggests that poor sleep quality
    is associated with depressive symptoms. The hippocampus might play a crucial role
    in the interplay between sleep disturbance and depressive symptomatology, e.g.,
    hippocampal atrophy is typically seen in both insomnia disorder and depression.
    Thus, examining the role of hippocampal volume in the interplay between poor sleep
    quality and depressive symptoms in large healthy populations is vital.MethodsWe
    investigated the association between self-reported sleep quality, depressive symptoms,
    and hippocampal total and subfields’ volumes in 1603 healthy young adults from
    the Behavioral Brain Research Project. Mediation analysis explored the mediating
    role of hippocampal volumes between sleep quality and depressive symptoms.ResultsSelf-reported
    sleep quality and depressive symptoms were positively correlated. In addition,
    it negatively related to three hippocampal subfields but not total hippocampal
    volume. In particular, hippocampal subfield DG and CA4 volumes mediated the interrelationship
    between poor sleep quality and depressive symptoms.ConclusionsOur findings improved
    the current understanding of the relationship between sleep disturbance, depressive
    symptomatology, and hippocampal subfields in healthy populations. Considering
    the crucial role of DG in hippocampal neurogenesis, our results suggest that poor
    sleep quality may contribute to depression through a reduction of DG volume leading
    to impaired neurogenesis which is crucial for the regulation of mood.
