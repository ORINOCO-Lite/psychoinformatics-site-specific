attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Connectivity-Related Roles of Contralesional Brain Regions for Motor Performance
    Early after Stroke
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Hemiparesis after stroke is associated with increased neural activity not
    only in the lesioned but also in the contralesional hemisphere. While most studies
    have focused on the role of contralesional primary motor cortex (M1) activity
    for motor performance, data on other areas within the unaffected hemisphere are
    scarce, especially early after stroke. We here combined functional magnetic resonance
    imaging (fMRI) and transcranial magnetic stimulation (TMS) to elucidate the contribution
    of contralesional M1, dorsal premotor cortex (dPMC), and anterior intraparietal
    sulcus (aIPS) for the stroke-affected hand within the first 10 days after stroke.
    We used "online" TMS to interfere with neural activity at subject-specific fMRI
    coordinates while recording 3D movement kinematics. Interfering with aIPS activity
    improved tapping performance in patients, but not healthy controls, suggesting
    a maladaptive role of this region early poststroke. Analyzing effective connectivity
    parameters using a Lasso prediction model revealed that behavioral TMS effects
    were predicted by the coupling of the stimulated aIPS with dPMC and ipsilesional
    M1. In conclusion, we found a strong link between patterns of frontoparietal connectivity
    and TMS effects, indicating a detrimental influence of the contralesional aIPS
    on motor performance early after stroke.Keywords: DCM; diaschisis; kinematics;
    motor network; recovery.'
