attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Structural brain alterations in anorexia nervosa: A global brain volume
    and anatomical likelihood estimation (ALE) meta-analysis combined with a functional
    decoding approach'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Substantial brain volume loss is well-documented during acute anorexia nervosa
    (AN); however, longitudinal outcomes are unclear. Our comprehensive meta-analysis
    investigated global and regional structural brain alterations in adult and adolescent
    individuals with AN by extracting reported brain volume scores and neuroimaging
    coordinates from the literature. Results showed significant global brain volume
    reductions in gray matter (GM), white matter (WM), and increases in cerebrospinal
    fluid (CSF) in acute AN (N = 1130 patients; N = 40 papers), gradually improving
    upon weight rehabilitation. However, even after 1.5 years of recovery, significantly
    lower global GM volume compared to healthy controls was found (N = 232 patients;
    N = 12 papers). Regarding potential regional changes, our search identified 35
    eligible papers with neuroimaging coordinates for 412 foci as input for our anatomical
    likelihood estimation (ALE) analyses. The results revealed widespread reductions
    of GM volume and cortical thickness, but notably also identified consistently
    affected brain regions including the cingulate gyrus, precentral gyrus, and precuneus.
    Spatial colocalization analyses using the Neurosynth data base indicated brain
    areas associated with eating, food, threat, and reinforcement to be relatively
    preserved. The findings of our meta-analysis contribute to a better understanding
    of the underlying pathophysiology of AN, the time course and residuals of brain
    structural alterations during recovery and clinical implications potentially relevant
    for more-targeted treatment options.
