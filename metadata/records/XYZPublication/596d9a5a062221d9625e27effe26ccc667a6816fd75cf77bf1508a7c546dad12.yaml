attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Not All Stroop-Type Tasks Are Alike: Assessing the Impact of Stimulus Material,
    Task Design, and Cognitive Demand via Meta-analyses Across Neuroimaging Studies'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'The Stroop effect is one of the most often studied examples of cognitive
    conflict processing. Over time, many variants of the classic Stroop task were
    used, including versions with different stimulus material, control conditions,
    presentation design, and combinations with additional cognitive demands. The neural
    and behavioral impact of this experimental variety, however, has never been systematically
    assessed. We used activation likelihood meta-analysis to summarize neuroimaging
    findings with Stroop-type tasks and to investigate whether involvement of the
    multiple-demand network (anterior insula, lateral frontal cortex, intraparietal
    sulcus, superior/inferior parietal lobules, midcingulate cortex, and pre-supplementary
    motor area) can be attributed to resolving some higher-order conflict that all
    of the tasks have in common, or if aspects that vary between task versions lead
    to specialization within this network. Across 133 neuroimaging experiments, incongruence
    processing in the color-word Stroop variant consistently recruited regions of
    the multiple-demand network, with modulation of spatial convergence by task variants.
    In addition, the neural patterns related to solving Stroop-like interference differed
    between versions of the task that use different stimulus material, with the only
    overlap between color-word, emotional picture-word, and other types of stimulus
    material in the posterior medial frontal cortex and right anterior insula. Follow-up
    analyses on behavior reported in these studies (in total 164 effect sizes) revealed
    only little impact of task variations on the mean effect size of reaction time.
    These results suggest qualitative processing differences among the family of Stroop
    variants, despite similar task difficulty levels, and should carefully be considered
    when planning or interpreting Stroop-type neuroimaging experiments.Keywords: Activation
    likelihood estimation; Cognitive control; Interference resolution; Neuroimaging
    meta-analysis; Stroop.'
