attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Linking cerebellar functional gradients to transdiagnostic behavioral dimensions
    of psychopathology
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'High co-morbidity and substantial overlap across psychiatric disorders encourage
    a transition in psychiatry research from categorical to dimensional approaches
    that integrate neuroscience and psychopathology. Converging evidence suggests
    that the cerebellum is involved in a wide range of cognitive functions and mental
    disorders. An important question thus centers on the extent to which cerebellar
    function can be linked to transdiagnostic dimensions of psychopathology. To address
    this question, we used a multivariate data-driven statistical technique (partial
    least squares) to identify latent dimensions linking human cerebellar connectome
    as assessed by functional MRI to a large set of clinical, cognitive, and trait
    measures across 198 participants, including healthy controls (n = 92) as well
    as patients diagnosed with attention-deficit/hyperactivity disorder (n = 35),
    bipolar disorder (n = 36), and schizophrenia (n = 35). Macroscale spatial gradients
    of connectivity at voxel level were used to characterize cerebellar connectome
    properties, which provide a low-dimensional representation of cerebellar connectivity,
    i.e., a sensorimotor-supramodal hierarchical organization. This multivariate analysis
    revealed significant correlated patterns of cerebellar connectivity gradients
    and behavioral measures that could be represented into four latent dimensions:
    general psychopathology, impulsivity and mood, internalizing symptoms and executive
    dysfunction. Each dimension was associated with a unique spatial pattern of cerebellar
    connectivity gradients across all participants. Multiple control analyses and
    10-fold cross-validation confirmed the robustness and generalizability of the
    yielded four dimensions. These findings highlight the relevance of cerebellar
    connectivity as a necessity for the study and classification of transdiagnostic
    dimensions of psychopathology and call on researcher to pay more attention to
    the role of cerebellum in the dimensions of psychopathology, not just within the
    cerebral cortex.'
