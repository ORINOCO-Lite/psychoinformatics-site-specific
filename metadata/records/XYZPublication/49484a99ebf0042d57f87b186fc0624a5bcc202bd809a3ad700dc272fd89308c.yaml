  lateral cerebellum in conjunction with its connectivity with the cerebral cortical
  system may be linked to non-motor functions and mental operation in primates. This
  idea is supported by diverging cerebello-cerebral adaptations that potentially coevolve
  with cognitive abilities across other vertebrates such as dolphins, parrots, and
  elephants. Modular adaptations upon the vertebrate cerebello-cerebral system may
  thus help better understand the neuroevolutionary trajectory of the primate brain
  and its relation to cognition in humans. Lateral cerebellar lobules crura I-II and
  their reciprocal connections to the cerebral cortical association areas appear to
  have substantially expanded in great apes, and humans. This, along with the notable
