- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Intracortical microstructure profiling: a cross-modal method for indexing
    cortical lamination'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Intracortical microstructure profiling represents a powerful, scalable approach
    for investigating the laminar organisation of the human cortex on both in-vivo
    and post-mortem datasets. Building upon a long tradition of histological analysis,
    this method leverages surface-based intracortical sampling to generate profiles
    of tissue properties across cortical depths. The present work outlines a standardised
    workflow for intracortical microstructural profiling, newly packaged as the open-source
    toolbox “CortPro” (https://github.com/caseypaquola/cortpro). Here, we explore
    the utility of central moments as descriptors of profile shape. Using these measures,
    we quantify (i) the extent to which in-vivo MRI can capture laminar differentiation,
    (ii) the test-retest reliability of profiles, and (iii) their replicability across
    sites and studies. Our results demonstrate that intracortical profiles are remarkably
    robust and effectively mitigate bias-field related limitations of non-quantitative
    MRI. As applications of microstructure-sensitive imaging expand across development,
    aging, and disease, microstructure profiling provides a principled means of linking
    microstructural neuroanatomy with systems-level brain organisation.
