  value: Probabilistic cytoarchitectonic map of Area p24c (pACC) (v16.1)
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'This dataset contains the distinct architectonic areas pv24c, pd24cv and
    pd24cd (combined to a single probability map named Area p24c (pACC)) in the individual,
    single subject template of the MNI Colin 27 as well as the MNI ICBM 152 2009c
    nonlinear asymmetric reference space. As part of the Julich-Brain cytoarchitectonic
    atlas, the area was identified using cytoarchitectonic analysis on cell-body-stained
    histological sections of 10 human postmortem brains obtained from the body donor
    program of the University of Düsseldorf. The results of the cytoarchitectonic
    analysis were then mapped to both reference spaces, where each voxel was assigned
    the probability to belong to Area p24c (pACC). The probability map of Area p24c
    (pACC) is provided in the NifTi format for each brain reference space and hemisphere.
    The Julich-Brain atlas relies on a modular, flexible and adaptive framework containing
    workflows to create the probabilistic brain maps for these structures. Note that
    methodological improvements and integration of new brain structures may lead to
    small deviations in earlier released datasets. Other available data versions of
    Area p24c (pACC): Palomero-Gallagher et al. (2019) [Data set, v16.0] [DOI: 10.25493/YSP3-WR3](https://doi.org/10.25493%2FYSP3-WR3)
    The most probable delineation of Area p24c (pACC) derived from the calculation
    of a maximum probability map of all currently released Julich-Brain brain structures
    can be found here: Amunts et al. (2019) [Data set, v1.18] [DOI: 10.25493/8EGG-ZAR](https://doi.org/10.25493%2F8EGG-ZAR)
    Amunts et al. (2020) [Data set, v2.2] [DOI: 10.25493/TAKY-64D](https://doi.org/10.25493%2FTAKY-64D)'
description: 'This dataset contains the distinct architectonic areas pv24c, pd24cv
  and pd24cd (combined to a single probability map named Area p24c (pACC)) in the
  individual, single subject template of the MNI Colin 27 as well as the MNI ICBM
  152 2009c nonlinear asymmetric reference space. As part of the Julich-Brain cytoarchitectonic
  atlas, the area was identified using cytoarchitectonic analysis on cell-body-stained
  histological sections of 10 human postmortem brains obtained from the body donor
  program of the University of Düsseldorf. The results of the cytoarchitectonic analysis
  were then mapped to both reference spaces, where each voxel was assigned the probability
  to belong to Area p24c (pACC). The probability map of Area p24c (pACC) is provided
  in the NifTi format for each brain reference space and hemisphere. The Julich-Brain
  atlas relies on a modular, flexible and adaptive framework containing workflows
  to create the probabilistic brain maps for these structures. Note that methodological
  improvements and integration of new brain structures may lead to small deviations
  in earlier released datasets. Other available data versions of Area p24c (pACC):
  Palomero-Gallagher et al. (2019) [Data set, v16.0] [DOI: 10.25493/YSP3-WR3](https://doi.org/10.25493%2FYSP3-WR3)
  The most probable delineation of Area p24c (pACC) derived from the calculation of
  a maximum probability map of all currently released Julich-Brain brain structures
  can be found here: Amunts et al. (2019) [Data set, v1.18] [DOI: 10.25493/8EGG-ZAR](https://doi.org/10.25493%2F8EGG-ZAR)
  Amunts et al. (2020) [Data set, v2.2] [DOI: 10.25493/TAKY-64D](https://doi.org/10.25493%2FTAKY-64D)'
