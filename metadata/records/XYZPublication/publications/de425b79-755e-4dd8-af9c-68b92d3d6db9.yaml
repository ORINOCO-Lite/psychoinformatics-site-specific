  value: Intermediately Synchronised Brain States optimise trade-off between Subject
    Identifiability and Predictive Capacity
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Functional connectivity (FC) refers to the statistical dependencies between
    activity of distinct brain areas. To study temporal fluctuations in FC within
    the duration of a functional magnetic resonance imaging (fMRI) scanning session,
    researchers have proposed the computation of an edge time series (ETS) and their
    derivatives. Evidence suggests that FC is driven by a few time points of high-amplitude
    co-fluctuation (HACF) in the ETS, which may also contribute disproportionately
    to interindividual differences. However, it remains unclear to what degree different
    time points actually contribute to brain-behaviour associations. Here, we systematically
    evaluate this question by assessing the predictive utility of FC estimates at
    different levels of co-fluctuation using machine learning (ML) approaches. We
    demonstrate that time points of lower and intermediate co-fluctuation levels provide
    overall highest subject specificity as well as highest predictive capacity of
    individual-level phenotypes.
