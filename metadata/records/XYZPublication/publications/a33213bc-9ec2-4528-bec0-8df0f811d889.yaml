  value: Cerebral topographies of perceived and felt emotions
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Emotions modulate behavioral priorities based on exteroceptive and interoceptive
    inputs, and the related central andperipheral changes may be experienced subjectively.
    Yet, it remains unresolved whether the perceptual and subjec-tively felt components
    of the emotion processes rely on shared brain mechanisms. We applied functional
    magneticresonance imaging, a rich set of emotional movies, and high-dimensional,
    continuous ratings of perceived and feltemotions in the movies to investigate
    their cerebral organization. Emotions evoked during natural movie scene per-ception
    were represented in the brain across numerous spatial scales and patterns. Perceived
    and felt emotionsgeneralized both between individuals and between different stimuli
    depicting the same emotions. The neural affectivespace demonstrated an anatomical
    gradient from emotion-general responses in polysensory areas and default moderegions
    to more emotion-specific discrete processing in subcortical regions. Differences
    in brain activation during feltand perceived emotions suggest that temporoparietal
    areas and precuneus have a key role in evaluating the affectivevalue of the sensory
    input, and subjective emotional state generation is associated with further and
    significantly stron-ger recruitment of the temporoparietal junction, anterior
    prefrontal cortices, cerebellum, and thalamus. These datareveal the similarities
    and differences of domain- general and emotion-specific affect networks in the
    brain during awide range of perceived and felt emotions.
