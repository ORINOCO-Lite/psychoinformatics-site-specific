  value: Friedreich's ataxia—a rare multisystem disease
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Friedreich''s ataxia is a rare autosomal recessive neurodegenerative disease.
    Most patients have a homozygous GAA repeat expansion in the FXN gene, resulting
    in a deficiency of the mitochondrial protein frataxin. Disease onset occurs typically
    in adolescence but can vary widely, ranging from early childhood to late adulthood.
    Friedreich''s ataxia is increasingly recognised as a multisystem disorder, affecting
    not only the nervous system, but also the heart and musculoskeletal system, and
    metabolism. Common extraneural manifestations include cardiomyopathy, which is
    the most common cause of mortality, and also scoliosis and diabetes. Despite research
    advances, the phenotypical heterogeneity of patients with Friedrich''s ataxia
    remains inadequately explained by current knowledge of the underlying genetics.
    The approval of omaveloxolone by the US Food and Drug Administration and the European
    Medicines Agency has been a pharmacological milestone; however, further research
    addressing complex interorgan interactions is crucial for a better understanding
    of the multisystem nature of Friedreich''s ataxia and the development of targeted
    treatment approaches. '
