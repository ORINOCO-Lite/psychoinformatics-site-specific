  value: Systematic cross-sectional age-associations in global fMRI signal topography
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The global signal (GS) in resting-state functional MRI (fMRI), known to contain
    artifacts and non-neuronal physiological signals, also contains important neural
    information related to individual state and trait characteristics. Here, we show
    distinct linear and curvilinear relationships between GS topography and age in
    a cross-sectional sample of individuals (6-85 years old) representing a significant
    portion of the lifespan. Subcortical brain regions such as the thalamus and putamen
    show linear associations with the GS across age. The thalamus has stronger contributions
    to the GS in older-age individuals compared with younger-aged individuals, while
    the putamen has stronger contributions in younger individuals compared with older
    individuals. The subcortical nucleus basalis of Meynert shows a u-shaped pattern
    similar to cortical regions within the lateral frontoparietal network and dorsal
    attention network, where contributions of the GS are stronger at early and old
    age, and weaker in middle age. This differentiation between subcortical and cortical
    brain activity across age supports a dual-layer model of GS composition, where
    subcortical aspects of the GS are differentiated from cortical aspects of the
    GS. We find that these subcortical-cortical contributions to the GS depend strongly
    on age across the lifespan of human development. Our findings demonstrate how
    neurobiological information within the GS differs across development and highlight
    the need to carefully consider whether or not to remove this signal when investigating
    age-related functional differences in the brain.
