attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'MRI- or 18F-FDG PET-derived brain age gaps: Associations with markers of
    Alzheimer''s disease'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: When the age of an individual's brain appears older than their chronological
    age, i.e., when the brain age gap (BAG) is positive, it may indicate the presence
    of a neurodegenerative condition, such as Alzheimer’s disease (AD). In this study,
    we evaluated whether BAG, determined by MRI (reflecting atrophy) or 18F-FDG PET
    (reflecting brain metabolism), correlate differentially with cognitive function,
    neuropathological indicators, and disease progression in individuals with normal
    cognitive function (CN), as well as those with subjective cognitive decline (SCD)
    or mild cognitive impairment (MCI).
