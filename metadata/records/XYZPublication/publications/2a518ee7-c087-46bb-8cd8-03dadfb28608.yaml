attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Executive functions predict verbal fluency scores in healthy participants
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: While there is a clear link between impairments of executive functions (EFs),
    i.e. cognitive control mechanisms that facilitate goal-directed behavior, and
    speech problems, it is so far unclear exactly which of the complex subdomains
    of EFs most strongly contribute to speech performance, as measured by verbal fluency
    (VF) tasks. Furthermore, the impact of intra-individual variability is largely
    unknown. This study on healthy participants (n = 235) shows that the use of a
    relevance vector machine approach allows for the prediction of VF performance
    from EF scores. Based on a comprehensive set of EF scores, results identified
    cognitive flexibility and inhibition as well as processing speed as strongest
    predictors for VF performance, but also highlighted a modulatory influence of
    fluctuating hormone levels. These findings demonstrate that speech production
    performance is strongly linked to specific EF subdomains, but they also suggest
    that inter-individual differences should be taken into account.
