attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Charting the brain networks of impulsivity: Meta-analytic synthesis, functional
    connectivity modelling and neurotransmitter associations'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Impulsivity is a multidimensional construct that plays a crucial role in
    human behaviour and is believed to be a transdiagnostic marker of several psychiatric
    disorders. However, given its multifaceted nature, investigations of its neural
    correlates are challenging and systematic comparisons across dimensions are lacking.
    In this study, we used a comprehensive multi-modal approach to investigate the
    functional network organisation of two dimensions in which impulsivity manifests:
    decision-making and response inhibition. ALE meta-analyses of task-based fMRI
    studies within each dimension identified two distinct and non-overlapping functional
    systems. One located in the default-mode network, associated with value-based
    judgments and goal-directed decision-making, and the other distributed across
    higher-order networks associated with cognitive control. Resting-state functional
    connectivity revealed the two systems were organised into four specialised communities
    of default-mode, cingulo-insular, frontoparietal, and temporal regions. Finally,
    given the widespread use of neurotransmitter-acting medication to treat conditions
    with impulsive symptoms, we investigated the association between this organisation
    and neurochemistry and found that integration across communities was associated
    with PET-derived serotonin receptor density. Our findings reinforce insights from
    previous behavioural research and provide substantial evidence for the multidimensional
    nature of impulsivity on the neural level. This highlights the necessity for a
    comprehensive dimensional ontology on all levels of investigation to address impulsivity
    in a transdiagnostic manner.'
