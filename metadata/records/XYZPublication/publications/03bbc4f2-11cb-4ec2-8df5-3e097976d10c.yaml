  value: Künstliche Intelligenz und menschliches Maß
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Die fortschreitende Verwendung von Verfahren künstlicher Intelligenz provoziert
    die Frage, inwiefern bei deren ethischer Bewertung auf anthropologische Reflexionen
    und insbesondere auf ein Kriterium des menschlichen Maßes zurückgegriffen werden
    kann. Der Beitrag thematisiert das schwierige Verhältnis von Ethik und Natur und
    erkundet über die Auseinandersetzung mit maßgeblichen kritischen Herausforderungen
    die Spielräume für den ethischen Rückgriff auf anthropologische Argumente, wobei
    der Einsatz von künstlicher Intelligenz in der Medizin den Anwendungsbezug bildet.
