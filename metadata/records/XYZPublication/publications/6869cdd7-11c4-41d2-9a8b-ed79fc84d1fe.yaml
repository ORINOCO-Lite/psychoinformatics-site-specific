attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Parcellation-based structural and resting-state functional brain connectomes
    of a healthy cohort
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Nowadays, connectivity patterns of brain networks are of special interest,
    as they may reflect communication in the brain at the structural and functional
    levels. Their extraction, however, is a complex process that requires deep knowledge
    of magnetic resonance imaging (MRI) data processing methods. Furthermore, there
    is no consensus as to which parcellation of the brain is most suitable for a given
    analysis. Therefore, 19 different state-of-the-art cortical parcellations were
    used in this dataset to reconstruct the region-based empirical structural connectivity
    (representing the anatomy of axonal tracts) and functional connectivity (representing
    the temporal correlation between neuronal activity of brain regions) from diffusion-weighted
    (dwMRI) and resting-state functional magnetic resonance imaging (fMRI) data, respectively.
    The repository provides individual connectomes for 200 subjects from the Human
    Connectome Project. The data can be used by members of the neuroimaging community
    to investigate structural and functional human connectomes, and to extend the
    investigation to whole-brain models for further analyses of brain structure and
    function.
description: Nowadays, connectivity patterns of brain networks are of special interest,
  as they may reflect communication in the brain at the structural and functional
  levels. Their extraction, however, is a complex process that requires deep knowledge
  of magnetic resonance imaging (MRI) data processing methods. Furthermore, there
  is no consensus as to which parcellation of the brain is most suitable for a given
  analysis. Therefore, 19 different state-of-the-art cortical parcellations were used
  in this dataset to reconstruct the region-based empirical structural connectivity
  (representing the anatomy of axonal tracts) and functional connectivity (representing
  the temporal correlation between neuronal activity of brain regions) from diffusion-weighted
  (dwMRI) and resting-state functional magnetic resonance imaging (fMRI) data, respectively.
  The repository provides individual connectomes for 200 subjects from the Human Connectome
  Project. The data can be used by members of the neuroimaging community to investigate
  structural and functional human connectomes, and to extend the investigation to
  whole-brain models for further analyses of brain structure and function.
