  value: Multimodal Prediction of 3- and 12-Month Outcomes in ICU Patients with Acute
    Disorders of Consciousness
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'In intensive care unit (ICU) patients with coma and other disorders of consciousness
    (DoC), outcome prediction is key to decision-making regarding prognostication,
    neurorehabilitation, and management of family expectations. Current prediction
    algorithms are largely based on chronic DoC, whereas multimodal data from acute
    DoC are scarce. Therefore, the Consciousness in Neurocritical Care Cohort Study
    Using Electroencephalography and Functional Magnetic Resonance Imaging (i.e. CONNECT-ME;
    ClinicalTrials.gov identifier: NCT02644265) investigates ICU patients with acute
    DoC due to traumatic and nontraumatic brain injuries, using electroencephalography
    (EEG) (resting-state and passive paradigms), functional magnetic resonance imaging
    (fMRI) (resting-state) and systematic clinical examinations.'
