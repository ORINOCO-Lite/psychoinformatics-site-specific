attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: '„KI“ in der Rechtsmedizin – von der Forschung in die Praxis: Welche Herausforderungen
    ergeben sich?“AI” in forensic medicine—From research into practice: what are the
    challenges?'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'AbstractHintergrundDie zunehmende Einführung von künstlicher Intelligenz
    (KI) in die Rechtsmedizin, ähnlich wie in anderen Bereichen der Medizin, ist absehbar.
    Vor dem Hintergrund dieser Entwicklung stellt sich die Frage nach den Herausforderungen,
    die mit dem Einsatz von KI in der Rechtsmedizin verbunden sind – eine Thematik,
    die bisher kaum behandelt wurde.Ziel der ArbeitDer Text untersucht zentrale Fragestellungen
    sowie die daraus resultierenden rechtlichen und ethischen Herausforderungen bei
    der Implementierung von KI in die forensische Praxis. Zudem werden Lösungsansätze
    vorgestellt.Material und MethodenDie Publikation basiert auf einer systematischen
    Literaturanalyse zu KI-Anwendungen in der Rechtsmedizin, aber auch der verwandten
    Bereiche, wie der medizinischen Diagnostik und digitalen Forensik. Berücksichtigt
    werden auch rechtliche Rahmenbedingungen, insbesondere die europäische KI-Verordnung
    sowie Perspektiven der KI-Ethik.Ergebnisse und DiskussionFür KI-Anwendungen in
    der Rechtsmedizin werden 6 zentrale Herausforderungen identifiziert: Zuverlässigkeit,
    Transparenz und Nachvollziehbarkeit („Blackbox“-Problematik), Verantwortlichkeit
    für Fehler, Datenquantität und -qualität, Datenbias und Fairness sowie die Akzeptanz
    KI-generierter Diagnosen. Zur Bewältigung der identifizierten Herausforderungen
    werden verschiedene Ansätze vorgeschlagen. Dazu zählen der Einsatz von „explainable
    AI“ (XAI) in Verbindung mit KI-Sachverständigen, die Entwicklung von Standardprotokollen
    sowie multizentrisches Arbeiten zur Sicherung der Datenqualität und Systemzuverlässigkeit.
    Zudem wird eine verstärkte transdisziplinäre Zusammenarbeit zwischen Informatikern,
    Rechtsmedizinern, Juristen und Ethikern empfohlen, um die Akzeptanz und Integration
    von KI-Systemen in die Praxis zu fördern.'
