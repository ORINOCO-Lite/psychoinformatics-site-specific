  value: 'Idiopathic and acquired pedophilia as two distinct disorders: an insight
    from neuroimaging'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Pedophilia is a disorder of public concern because of its association with
    child sexual offense and recidivism. Previous neuroimagingstudies of potential
    brain abnormalities underlying pedophilic behavior, either in idiopathic or acquired
    (i.e., emergingfollowing brain damages) pedophilia, led to inconsistent results.
    This study sought to explore the neural underpinnings ofpedophilic behavior and
    to determine the extent to which brain alterations may be related to distinct
    psychopathological featuresin pedophilia. To this aim, we run a coordinate based
    meta-analysis on previously published papers reporting whole brainanalysis and
    a lesion network analysis, using brain lesions as seeds in a resting state connectivity
    analysis. The behavioralprofiling approach was applied to link identified regions
    with the corresponding psychological processes. While no consistentneuroanatomical
    alterations were identified in idiopathic pedophilia, the current results support
    that all the lesions causingacquired pedophilia are localized within a shared
    resting state network that included posterior midlines structures, right inferiortemporal
    gyrus and bilateral orbitofrontal cortex. These regions are associated with action
    inhibition and social cognition, abilitiesthat are consistently and severely impaired
    in acquired pedophiles. This study suggests that idiopathic and acquired pedophiliamay
    be two distinct disorders, in line with their distinctive clinical features, including
    age of onset, reversibility and modusoperandi. Understanding the neurobiological
    underpinnings of pedophilic behavior may contribute to a more comprehensivecharacterization
    of these individuals on a clinical ground, a pivotal step forward for the development
    of more efficient therapeuticrehabilitation strategies.
