  value: Julich-Brain Atlas, cytoarchitectonic maps
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The Julich-Brain Atlas (RRID:SCR_023277) presents in this dataset cytoarchitectonic
    maps in several coordinate spaces, such as MNI Colin 27, MNI ICBM 152, and Free
    Surfer FsAverage-7. These maps originate from peer-reviewed probability maps (PMs)
    that define both cortical and subcortical brain regions. Notably, these probability
    maps account for the brain's inter-individual variability by analyzing data from
    ten post-mortem samples. For a whole-brain parcellation, the available probability
    maps are combined into a maximum probability map (MPM) by considering for each
    voxel the probability of all cytoarchitectonic brain regions, and determining
    the most probable assignment. The atlas was used as a reference atlas for the
    Human Brain Project and is deeply embedded within the European research infrastructure
    platform, EBRAINS. Furthermore, the atlas is continuously evolving and regularly
    updated with new areas. The [siibra toolsuite](https://siibra-python.readthedocs.io)
    provides an automated access to the Atlas, to speed up your work.
