- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Healthy sleep is a fundamental pillar of various neurophysio-logical, emotional,
    and cognitive processes, including emotionregulation, memory consolidation, and
    brain waste clearance [1–3]. Sleep quality is a multidimensional concept that
    has beenwidely assessed using the Pittsburgh Sleep Quality Index (PSQI)[4, 5].
    It encompasses seven components of self-reported sleepquality, sleep latency,
    sleep duration, habitual sleep efficiency,sleep disturbances, use of sleeping
    medication, and daytime dys-function [5]. However, the neurobiological substrates
    of sleepquality remain elusive.
