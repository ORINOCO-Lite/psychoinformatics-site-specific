attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Empirical facts from search for replicable associations between cortical
    thickness and psychometric variables in healthy adults
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The study of associations between inter-individual differences in brain structure
    and behaviour has a long history in psychology and neuroscience. Many associations
    between psychometric data, particularly intelligence and personality measures
    and local variations of brain structure have been reported. While the impact of
    such reported associations often goes beyond scientific communities, resonating
    in the public mind, their replicability is rarely evidenced. Previously, we have
    shown that associations between psychometric measures and estimates of grey matter
    volume (GMV) result in rarely replicated findings across large samples of healthy
    adults. However, the question remains if these observations are at least partly
    linked to the multidetermined nature of the variations in GMV, particularly within
    samples with wide age-range. Therefore, here we extended those evaluations and
    empirically investigated the replicability of associations of a broad range of
    psychometric variables and cortical thickness in a large cohort of healthy young
    adults. In line with our observations with GMV, our current analyses revealed
    low likelihood of significant associations and their rare replication across independent
    samples. We here discuss the implications of these findings within the context
    of accumulating evidence of the general poor replicability of structural-brain-behaviour
    associations, and more broadly of the replication crisis.
