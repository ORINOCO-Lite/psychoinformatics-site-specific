attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Der vorhersagbare Mensch: Zu Chancen und Risiken der KI-basierten Prädiktion
    von kognitiven Fähigkeiten, Persönlichkeitsmerkmalen und psychischen Erkrankungen'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Neue Ansätze der Nutzung künstlicher Intelligenz (KI) zur Analyse von Daten
    aus der Neurobildgebung, aber auch passiv gesammelter Daten von sog. „Wearables“
    wie Smartphones oder Smartwatches sowie Daten, die sich aus Social-Media- und
    anderen Online-Aktivitäten extrahieren lassen, ermöglichen es bereits heute, kognitive
    Fähigkeiten, Persönlichkeitsmerkmale und psychische Erkrankungen vorherzusagen
    sowie akute mentale Zustände offenzulegen. In diesem Beitrag erläutern wir die
    Hintergründe der aktuellen Entwicklung, leuchten ihre Möglichkeiten und Grenzen
    aus und gehen auf ethische und gesellschaftliche Aspekte ein, die sich aus der
    Nutzung ergeben.
