  value: Emotional Context Sculpts Action Goal Representations in the Lateral Frontal
    Pole
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Emotional states provide an ever-present source of contextual information
    that should inform behavioral goals. Despite the ubiquity of emotional signals
    in our environment, the neural mechanisms underlying their influence on goal-directed
    action remains unclear. Prior work suggests that the lateral frontal pole (FPl)
    is uniquely positioned to integrate affective information into cognitive control
    representations. We used pattern similarity analysis to examine the content of
    representations in FPl and interconnected mid-lateral prefrontal and amygdala
    circuitry. Healthy participants (n = 37; n = 21 females) were scanned while undergoing
    an event-related Affective Go/No-Go task, which requires goal-oriented action
    selection during emotional processing. We found that FPl contained conjunctive
    emotion–action goal representations that were related to successful cognitive
    control during emotional processing. These representations differed from conjunctive
    emotion–action goal representations found in the basolateral amygdala. While robust
    action goal representations were present in mid-lateral prefrontal cortex, they
    were not modulated by emotional valence. Finally, converging results from functional
    connectivity and multivoxel pattern analyses indicated that FPl emotional valence
    signals likely originated from interconnected subgenual anterior cingulate cortex
    (ACC) (BA25), which was in turn functionally coupled with the amygdala. Thus,
    our results identify a key pathway by which internal emotional states influence
    goal-directed behavior.
