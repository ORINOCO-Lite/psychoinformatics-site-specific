attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Common brain networks underlying human social interactions: Evidence from
    large-scale neuroimaging meta-analysis'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Recent overarching frameworks propose that various human social interactions
    are commonly supported by a set of fundamental neuropsychological processes, including
    social cognition, motivation, and cognitive control. However, it remains unclear
    whether brain networks implicated in these functional constructs are consistently
    engaged in diverse social interactions. Based on ample evidence from human brain
    imaging studies (342 contrasts, 7234 participants, 3328 foci), we quantitatively
    synthesized brain areas involved in broad domains of social interactions, including
    social interactions versus non-social contexts, positive/negative aspects of social
    interactions, social learning, and social norms. We then conducted brain network
    analysis on the ensuing brain regions and characterized the psychological function
    profiles of identified brain networks. Our findings revealed that brain regions
    consistently involved in diverse social interactions mapped onto default mode
    network, salience network, subcortical network and central executive network,
    which were respectively implicated in social cognition, motivation and cognitive
    control. These findings implicate a heuristic integrative framework to understand
    human social life from the perspective of component process and network integration.
