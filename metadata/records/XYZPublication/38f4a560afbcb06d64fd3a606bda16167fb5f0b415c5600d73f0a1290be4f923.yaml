  value: Methodik der künstlichen IntelligenzMethodology of artificial intelligence
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: BackgroundAs part of the digitalization of the healthcare system there is
    currently a dynamic technological push through procedures of artificial intelligence
    (AI). In view of the impact on patients and physicians the benefits, risks and
    consequences of AI should be known and understood in order to be able to evaluate
    and to use the techniques.ObjectiveThe fundamentals of AI are presented and an
    overview is given of the different methods of AI and the role of data required
    for this in pediatrics. It also addresses the specific challenges of pediatric
    data for AI.ConclusionThe use of AI will increasingly influence pediatric and
    adolescent medicine. Due to its scope and complexity, medical AI literacy is required
    that includes a basic understanding of AI methodology. Methodologically, a particular
    focus in pediatrics must be on the quality and suitability of the data used for
    AI systems.
