attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'The neural signatures of social hierarchy-related learning and interaction:
    A coordinate- and connectivity-based meta-analysis'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Numerous neuroimaging studies have investigated the neural mechanisms of
    two mutually independent yet closely related cognitive processes aiding humans
    to navigate complex societies: social hierarchy-related learning (SH-RL) and social
    hierarchy-related interaction (SH-RI). To integrate these heterogeneous results
    into a more fine-grained and reliable characterization of the neural basis of
    social hierarchy, we combined coordinate-based meta-analyses with connectivity
    and functional decoding analyses to understand the underlying neuropsychological
    mechanism of SH-RL and SH-RI. We identified the anterior insula and temporoparietal
    junction (dominance detection), medial prefrontal cortex (information updating
    and computation), and intraparietal sulcus region, amygdala, and hippocampus (social
    hierarchy representation) as consistent activated brain regions for SH-RL, but
    the striatum, amygdala, and hippocampus associated with reward processing for
    SH-RI. Our results provide an overview of the neural architecture of the neuropsychological
    processes underlying how we understand, and interact within, social hierarchy.'
description: 'Numerous neuroimaging studies have investigated the neural mechanisms
  of two mutually independent yet closely related cognitive processes aiding humans
  to navigate complex societies: social hierarchy-related learning (SH-RL) and social
  hierarchy-related interaction (SH-RI). To integrate these heterogeneous results
  into a more fine-grained and reliable characterization of the neural basis of social
  hierarchy, we combined coordinate-based meta-analyses with connectivity and functional
  decoding analyses to understand the underlying neuropsychological mechanism of SH-RL
  and SH-RI. We identified the anterior insula and temporoparietal junction (dominance
  detection), medial prefrontal cortex (information updating and computation), and
  intraparietal sulcus region, amygdala, and hippocampus (social hierarchy representation)
  as consistent activated brain regions for SH-RL, but the striatum, amygdala, and
  hippocampus associated with reward processing for SH-RI. Our results provide an
  overview of the neural architecture of the neuropsychological processes underlying
  how we understand, and interact within, social hierarchy.'
