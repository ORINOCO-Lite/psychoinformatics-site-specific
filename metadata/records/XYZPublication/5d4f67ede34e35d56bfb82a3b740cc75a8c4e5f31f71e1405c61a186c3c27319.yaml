attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Brain Imaging of the Cortex in ADHD: A Coordinated Analysis of Large-Scale
    Clinical and Population-Based Samples'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Objective:Neuroimaging studies show structural alterations of various brain
    regions in children and adults with attention deficit hyperactivity disorder (ADHD),
    although nonreplications are frequent. The authors sought to identify cortical
    characteristics related to ADHD using large-scale studies.Methods:Cortical thickness
    and surface area (based on the Desikan–Killiany atlas) were compared between case
    subjects with ADHD (N=2,246) and control subjects (N=1,934) for children, adolescents,
    and adults separately in ENIGMA-ADHD, a consortium of 36 centers. To assess familial
    effects on cortical measures, case subjects, unaffected siblings, and control
    subjects in the NeuroIMAGE study (N=506) were compared. Associations of the attention
    scale from the Child Behavior Checklist with cortical measures were determined
    in a pediatric population sample (Generation-R, N=2,707).Results:In the ENIGMA-ADHD
    sample, lower surface area values were found in children with ADHD, mainly in
    frontal, cingulate, and temporal regions; the largest significant effect was for
    total surface area (Cohen’s d=−0.21). Fusiform gyrus and temporal pole cortical
    thickness was also lower in children with ADHD. Neither surface area nor thickness
    differences were found in the adolescent or adult groups. Familial effects were
    seen for surface area in several regions. In an overlapping set of regions, surface
    area, but not thickness, was associated with attention problems in the Generation-R
    sample.Conclusions:Subtle differences in cortical surface area are widespread
    in children but not adolescents and adults with ADHD, confirming involvement of
    the frontal cortex and highlighting regions deserving further attention. Notably,
    the alterations behave like endophenotypes in families and are linked to ADHD
    symptoms in the population, extending evidence that ADHD behaves as a continuous
    trait in the population. Future longitudinal studies should clarify individual
    lifespan trajectories that lead to nonsignificant findings in adolescent and adult
    groups despite the presence of an ADHD diagnosis.
