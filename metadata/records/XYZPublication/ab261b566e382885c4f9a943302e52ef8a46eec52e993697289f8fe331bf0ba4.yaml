- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Brain connectivity is one of the main objects of brain research reflecting
    the interaction between neuronal populations at a variety of spatial and temporal
    scales and modalities. The main approaches include the extraction and analysis
    of the structural connectivity (SC) representing the anatomical axonal tracts
    and functional connectivity (FC) representing the temporal correlation between
    neuronal activity of brain regions. Extraction of SC and FC is a complex process
    requiring a deep knowledge of the data processing methods. The current project
    is aimed at facilitation of this process and provides an access to the extracted
    brain connectivities ready for further usage. The data includes SC and resting-state
    FC for several brain atlases of different granularity, where the parcellation
    is performed based on functional, anatomical and cytoarchitectonic brain properties.
    The connectivity is extracted and averaged over several hundreds of healthy subjects
    from well-known public repositories of neuroimaging data, including the Human
    Connectome Project (HCP) [Van Essen et al., 2013](https://doi.org/10.1016/j.neuroimage.2013.05.041)
    and Enhanced Nathan Klein Institute Rockland Sample (eNKI) [Nooner et al., 2012](https://dx.doi.org/10.3389/fnins.2012.00152).
    The provided SC and FC can be used for group-level investigations of the connectivities
    and for data-driven mathematical modeling of the resting-state brain dynamics.
