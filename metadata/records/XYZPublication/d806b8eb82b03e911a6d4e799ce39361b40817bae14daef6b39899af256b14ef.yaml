attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Gray matter volume and estimated brain age gap are not linked with sleep-disordered
    breathing
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Alzheimer's disease (AD) and sleep-disordered breathing (SDB) are prevalent
    conditions with a rising burden. It is suggested that SDB may contribute to cognitive
    decline and advanced aging. Here, we assessed the link between self-reported SDB
    and gray matter volume in patients with AD, mild cognitive impairment (MCI) and
    healthy controls (HCs). We further investigated whether SDB was associated with
    advanced brain aging. We included a total of 330 participants, divided based on
    self-reported history of SDB, and matched across diagnoses for age, sex and presence
    of the Apolipoprotein E4 allele, from the Alzheimer's Disease Neuroimaging Initiative
    (ADNI). Gray-matter volume was measured using voxel-wise morphometry and group
    differences in terms of SDB, cognitive status, and their interaction were assessed.
    Further, using an age-prediction model fitted on gray-matter data of external
    datasets, we predicted study participants' age from their structural images. Cognitive
    decline and advanced age were associated with lower gray matter volume in various
    regions, particularly in the bilateral temporal lobes. Brains age was well predicted
    from the morphological data in HCs and, as expected, elevated in MCI and particularly
    in AD subjects. However, there was neither a significant difference between regional
    gray matter volume in any diagnostic group related to the SDB status, nor in SDB-by-cognitive
    status interaction. Moreover, we found no difference in estimated chronological
    age gap related to SDB, or by-cognitive status interaction. Contrary to our hypothesis,
    we were not able to find a general or a diagnostic-dependent association of SDB
    with either gray-matter volumetric or brain aging.
