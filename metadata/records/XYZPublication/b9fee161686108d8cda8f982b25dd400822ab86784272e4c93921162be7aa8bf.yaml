attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'BrainStat: A toolbox for brain-wide statistics and multimodal feature associations'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Analysis and interpretation of neuroimaging datasets has become a multidisciplinary
    endeavor, relying not only on statistical methods, but increasingly on associations
    with respect to other brain-derived features such as gene expression, histological
    data, and functional as well as cognitive architectures. Here, we introduce BrainStat
    - a toolbox for (i) univariate and multivariate linear models in volumetric and
    surface-based brain imaging datasets, and (ii) multidomain feature association
    of results with respect to spatial maps of post-mortem gene expression and histology,
    task-based fMRI meta-analysis, as well as resting-state fMRI motifs across several
    common surface templates. The combination of statistics and feature associations
    into a turnkey toolbox streamlines analytical processes and accelerates cross-modal
    research. The toolbox is implemented in both Python and MATLAB, two widely used
    programming languages in the neuroimaging and neuroinformatics communities. BrainStat
    is openly available and complemented by an expandable documentation.
