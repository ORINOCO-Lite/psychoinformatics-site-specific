- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Psychopathic personality traits such as callousness, manipulativeness, and
    lack of empathy are continuously distributed in non-institutionalized populations.
    Here, we show that brain responses to emotional movies in healthy females vary
    as a function of primary (PP) and secondary psychopathy (SP) traits. Healthy female
    volunteers (n=50) with variable scorings in Levenson Self-Report Psychopathy Scale
    watched a set of emotional movie clips (n=39) during functional magnetic resonance
    imaging of brain activity. We found that participants low on primary and secondary
    psychopathy traits showed higher cortical and subcortical activity when watching
    emotional movies, what possibly indicates the somatosensory simulation and empathizing
    with the emotions of movie characters. On the other hand, the individuals with
    high primary and secondary psychopathy traits presented a lack of vicarious engagement
    during watching movies and they manifested brainstem-based heightened response
    towards thread-related stimuli, which could indicate potent autonomic reactivity.
    Overall, our results indicate that variability in psychopathic traits in the general
    population is manifested as differential neural responses to emotional signals,
    and confirm previous findings of there being separate PP and SP personality characteristics
    due to the dissociable brain activity patterns while viewing emotional movies.
