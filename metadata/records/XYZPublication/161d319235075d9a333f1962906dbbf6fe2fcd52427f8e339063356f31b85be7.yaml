- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Skilled visual object and pattern recognition form the basis of many everyday
    behaviours. The game of chess has often been used as a model case for studying
    how long-term experience aides in perceiving objects and their spatio-functional
    interrelations. Earlier research revealed two brain regions, posterior middle
    temporal gyrus (pMTG) and collateral sulcus (CoS), to be linked to chess experts'
    superior object and pattern recognition, respectively. Here we elucidated the
    brain networks these two expertise-related regions are embedded in, employing
    resting-state functional connectivity analysis and meta-analytic connectivity
    modelling with the BrainMap database. pMTG was preferentially connected with dorsal
    visual stream areas and a parieto-prefrontal network for action planning, while
    CoS was preferentially connected with posterior medial cortex and hippocampus,
    linked to scene perception, perspective-taking and navigation. Functional profiling
    using BrainMap meta-data revealed that pMTG was linked to semantic processing
    as well as inhibition and attention, while CoS was linked to face and shape perception
    as well as passive viewing. Our findings suggest that pMTG subserves skilled object
    recognition by mediating the link between object identity and object affordances,
    while CoS subserves skilled pattern recognition by linking the position of individual
    objects with typical spatio-functional layouts of their environment stored in
    memory.
