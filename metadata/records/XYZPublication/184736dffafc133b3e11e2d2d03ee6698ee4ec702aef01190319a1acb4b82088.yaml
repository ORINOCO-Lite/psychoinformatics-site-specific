  value: Stressor-Specific Sex Differences in Amygdala - Frontal Cortex Networks
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Females and males differ in stress reactivity, coping, and the prevalence
    rates of stress-related disorders. According to a neurocognitive framework of
    stress coping, the functional connectivity between the amygdala and frontal regions
    (including the dorsolateral prefrontal cortex (dlPFC), ventral anterior cingulate
    cortex (vACC), and medial prefrontal cortex (mPFC)) plays a key role in how people
    deal with stress. In the current study, we investigated the effects of sex and
    stressor type in a within-subject counterbalanced design on the resting-state
    functional connectivity (rsFC) of the amygdala and these frontal regions in 77
    healthy participants (40 females). Both stressor types led to changes in subjective
    ratings, with decreasing positive affect and increasing negative affect and anger.
    Females showed higher amygdala-vACC and amygdala-mPFC rsFC for social exclusion
    than for achievement stress, and compared to males. Whereas a higher amygdala-vACC
    rsFC indicates the activation of emotion processing and coping, a higher amygdala-mPFC
    rsFC indicates feelings of reward and social gain, highlighting the positive effects
    of social affiliation. Thus, for females, feeling socially affiliated might be
    more fundamental than for males. Our data indicate interactions of sex and stressor
    in amygdala-frontal coupling, which translationally contributes to a better understanding
    of the sex differences in prevalence rates and stress coping.
