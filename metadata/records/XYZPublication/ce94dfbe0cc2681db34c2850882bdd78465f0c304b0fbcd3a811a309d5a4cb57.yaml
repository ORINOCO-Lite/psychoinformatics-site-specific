attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Künstliche Intelligenz in der Kinder- und Jugendmedizin - Artificial intelligence
    in pediatric and adolescent medicine
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Durch die rasanten Entwicklungen im Bereich der künstlichen Intelligenz (KI)
    ergeben sich zahlreiche neue Diagnostik- und Therapieoptionen in der Kinder- und
    Jugendmedizin. Gleichzeitig werfen diese Entwicklungen aber auch vielfältige Fragen
    auf. In diesem Beitrag beleuchten wir, welche Faktoren für die Akzeptanz von KI
    in der Kinder- und Jugendmedizin wichtig sind, und skizzieren einige ethische
    und rechtliche Fragen. Eine interdisziplinäre Perspektive und ein sorgsamer Umgang
    mit Bedenken oder Ängsten ist unabdingbar, um diesen Herausforderungen zu begegnen
    und die sich durch KI eröffnenden Chancen nutzen zu können.
