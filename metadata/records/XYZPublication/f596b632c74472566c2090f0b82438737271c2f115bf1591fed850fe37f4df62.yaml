attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Comparison of individualized behavioral predictions across anatomical, diffusion
    and functional connectivity MRI
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: A fundamental goal across the neurosciences is the characterization of relationships
    linking brain anatomy, functioning, and behavior. Although various MRI modalities
    have been developed to probe these relationships, direct comparisons of their
    ability to predict behavior have been lacking. Here, we compared the ability of
    anatomical T1, diffusion and functional MRI (fMRI) to predict behavior at an individual
    level. Cortical thickness, area and volume were extracted from anatomical T1 images.
    Diffusion Tensor Imaging (DTI) and approximate Neurite Orientation Dispersion
    and Density Imaging (NODDI) models were fitted to the diffusion images. The resulting
    metrics were projected to the Tract-Based Spatial Statistics (TBSS) skeleton.
    We also ran probabilistic tractography for the diffusion images, from which we
    extracted the stream count, average stream length, and the average of each DTI
    and NODDI metric across tracts connecting each pair of brain regions. Functional
    connectivity (FC) was extracted from both task and resting-state fMRI. Individualized
    prediction of a wide range of behavioral measures were performed using kernel
    ridge regression, linear ridge regression and elastic net regression. Consistency
    of the results were investigated with the Human Connectome Project (HCP) and Adolescent
    Brain Cognitive Development (ABCD) datasets. In both datasets, FC-based models
    gave the best prediction performance, regardless of regression model or behavioral
    measure. This was especially true for the cognitive component. Furthermore, all
    modalities were able to predict cognition better than other behavioral components.
    Combining all modalities improved prediction of cognition, but not other behavioral
    components. Finally, across all behaviors, combining resting and task FC yielded
    prediction performance similar to combining all modalities. Overall, our study
    suggests that in the case of healthy children and young adults, behaviorally-relevant
    information in T1 and diffusion features might reflect a subset of the variance
    captured by FC.
