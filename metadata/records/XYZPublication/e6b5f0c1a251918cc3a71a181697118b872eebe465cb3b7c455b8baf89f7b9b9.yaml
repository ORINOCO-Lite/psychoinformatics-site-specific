- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Deep neural networks currently provide the most advanced and accurate machine
    learning models to distinguish between structural MRI scans of subjects with Alzheimer''s
    disease and healthy controls. Unfortunately, the subtle brain alterations captured
    by these models are difficult to interpret because of the complexity of these
    multi-layer and non-linear models. Several heatmap methods have been proposed
    to address this issue and analyze the imaging patterns extracted from the deep
    neural networks, but no quantitative comparison between these methods has been
    carried out so far. In this work, we explore these questions by deriving heatmaps
    from Convolutional Neural Networks (CNN) trained using T1 MRI scans of the ADNI
    data set and by comparing these heatmaps with brain maps corresponding to Support
    Vector Machine (SVM) activation patterns. Three prominent heatmap methods are
    studied: Layer-wise Relevance Propagation (LRP), Integrated Gradients (IG), and
    Guided Grad-CAM (GGC). Contrary to prior studies where the quality of heatmaps
    was visually or qualitatively assessed, we obtained precise quantitative measures
    by computing overlap with a ground-truth map from a large meta-analysis that combined
    77 voxel-based morphometry (VBM) studies independently from ADNI. Our results
    indicate that all three heatmap methods were able to capture brain regions covering
    the meta-analysis map and achieved better results than SVM activation patte'
