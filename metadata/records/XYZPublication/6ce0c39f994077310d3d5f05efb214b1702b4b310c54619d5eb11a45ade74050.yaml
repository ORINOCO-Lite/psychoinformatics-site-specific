attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Transcutaneous Auricular Vagus Nerve Stimulation for the Treatment of Myoarthropathic
    Symptoms Associated With Temporomandibular Disorders—A Pilot Randomised Controlled
    Trial
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'ABSTRACTBackground: Transcutaneous auricular vagus nerve stimulation (taVNS)
    is a safe and feasible treatment for a variety of acuteand chronic pain conditions.
    However, no evidence about taVNS effectiveness in patients with chronic pain associated
    with tem-poromandibular disorders (TMD) is available.Objective: To evaluate the
    feasibility of and compliance with taVNS in participants experiencing chronic
    TMD pain and poten-tial effects on pain, psychological well-being, muscle activity,
    and kinematics.Methods: Twenty adults with chronic TMD pain were randomised to
    receive taVNS (n = 10) or sham (n = 10). In the taVNSgroup, stimulation was performed
    on the left tragus for 4 h daily (25 Hz, pulse width 250 μs, 28 s on/32 s off).
    In the sham group,an inactive non-functional sham electrode was used. Patient-reported
    outcome measures (GCPS, PHQ-9, GAD-7, PHQ-15, andOHIP- G14), muscle activity,
    and kinematics were assessed at baseline, 4 weeks, and 8 weeks. Compliance was
    assessed using asmartphone app, which recorded daily stimulation time and intensity.Results:
    Recruitment and retention rates were high (100% and 90%, respectively), with 83%
    adherence to the intervention.Participants receiving taVNS showed a large effect
    on oral health-related quality of life, and at least a small but potentially impor-tant
    effect on pain intensity, anxiety, depression, severity of somatic symptoms, muscle
    activity, and kinematics. However, noneof these differences were statistically
    significant. No serious adverse events were identified.'
