  value: 'Brain areas associated with clinical and cognitive insight in psychotic
    disorders: A systematic review and meta-analysis'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: n the past years, ample interest in brain abnormalities related to clinical
    and cognitive insight in psychosis has contributed several neuroimaging studies
    to the literature. In the current study, published findings on the neural substrates
    of clinical and cognitive insight in psychosis are integrated by performing a
    systematic review and meta-analysis.Coordinate-based meta-analyses were performed
    with the parametric coordinate-based meta-analysis approach, non-coordinate based
    meta-analyses were conducted with the metafor package in R. Papers that could
    not be included in the meta-analyses were systematically reviewed.Thirty-seven
    studies were retrieved, of which 21 studies were included in meta-analyses. Poorer
    clinical insight was related to smaller whole brain gray and white matter volume
    and gray matter volume of the frontal gyri. Cognitive insight was predominantly
    positively associated with structure and function of the hippocampus and ventrolateral
    prefrontal cortex.Impaired clinical insight is not associated with abnormalities
    of isolated brain regions, but with spatially diffuse global and frontal abnormalities
    suggesting it might rely on a range of cognitive and self-evaluative processes.
    Cognitive insight is associated with specific areas and appears to rely more on
    retrieving and integrating self-related information.
