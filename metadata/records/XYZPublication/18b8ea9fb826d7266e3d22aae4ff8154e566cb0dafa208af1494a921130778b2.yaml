- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Changes in patterns of age-related network connectivity are associated with
    risk for schizophrenia
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Alterations in fMRI-based brain functional network connectivity (FNC) are
    associated with schizophrenia (SCZ) and the genetic risk or subthreshold clinical
    symptoms preceding the onset of SCZ, which often occurs in early adulthood. Thus,
    age-sensitive FNC changes may be relevant to SCZ risk-related FNC. We used independent
    component analysis to estimate FNC from childhood to adulthood in 9,236 individuals.
    To capture individual brain features more accurately than single-session fMRI,
    we studied an average of three fMRI scans per individual. To identify potential
    familial risk–related FNC changes, we compared age-related FNC in first-degree
    relatives of SCZ patients mostly including unaffected siblings (SIB) with neurotypical
    controls (NC) at the same age stage. Then, we examined how polygenic risk scores
    for SCZ influenced risk-related FNC patterns. Finally, we investigated the same
    risk-related FNC patterns in adult SCZ patients (oSCZ) and young individuals with
    subclinical psychotic symptoms (PSY). Age-sensitive risk-related FNC patterns
    emerge during adolescence and early adulthood, but not before. Young SIB always
    followed older NC patterns, with decreased FNC in a cerebellar–occipitoparietal
    circuit and increased FNC in two prefrontal–sensorimotor circuits when compared
    to young NC. Two of these FNC alterations were also found in oSCZ, with one exhibiting
    reversed pattern. All were linked to polygenic risk for SCZ in unrelated individuals
    (R2 varied from 0.02 to 0.05). Young PSY showed FNC alterations in the same direction
    as SIB when compared to NC. These results suggest that age-related neurotypical
    FNC correlates with genetic risk for SCZ and is detectable with MRI in young participants.
