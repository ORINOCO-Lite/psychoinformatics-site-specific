  value: Exploring the neural correlates of (altered) moral cognition in psychopaths
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Research into the neurofunctional mechanisms of psychop-athy has gathered
    momentum over the last years. Previous neuroimaging studies have identified general
    changes in brain activity of psychopaths. In an exploratory meta-analysis,  we
    here investigated the neural correlates of impaired moral  cognition in psychopaths.
    Our analyses replicated general effects in the dorsomedial prefrontal cortex,
    lateral pre-frontal cortex, fronto-insular cortex, and amygdala, which have been
    reported recently. In addition, we found aberrant brain activity in the midbrain
    and inferior parietal cortex. Our preliminary findings suggest that alterations
    in both re-gions may represent more specific functional brain changes related
    to (altered) moral cognition in psychopaths. Further-more, future studies including
    a more comprehensive corpus of neuroimaging studies on moral cognition in psychopaths
    should re-examine this notion.
