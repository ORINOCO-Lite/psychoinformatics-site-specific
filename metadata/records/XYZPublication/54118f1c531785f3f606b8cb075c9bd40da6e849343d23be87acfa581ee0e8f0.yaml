- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Research in cognitive neuroscience employing resting-state functional magnetic
    resonance imaging (rs-fMRI) has experienced an exponential boom since Biswal et
    al.’s pioneering work in the mid-nineties of the last century, when it was demonstrated
    that rs-fMRI is capable to reveal enhanced functional connectivity within functional
    subsystems of the human brain (Biswal et al., 1997, Biswal et al., 1995). Rs-fMRI
    derives its name from the fact that hemodynamic activity is recorded while participants
    lie in the MR scanner without any experimental task. Instead, participants are
    usually instructed to let their minds wander freely and not fall asleep. Under
    these conditions, the body obviously is in a “resting position”; the brain, however,
    is never at rest but rather enters a so-called default mode involving increased
    activity in a set of brain areas that are usually deactivated during externally
    structured tasks ...
