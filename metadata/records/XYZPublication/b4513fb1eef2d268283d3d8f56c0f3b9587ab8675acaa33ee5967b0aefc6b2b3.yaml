attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'Subcortical Brain Volume, Regional Cortical Thickness, and Cortical Surface
    Area Across Disorders: Findings From the ENIGMA ADHD, ASD, and OCD Working Groups'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Objective: Attention-deficit/hyperactivity disorder (ADHD), autism spectrum
    disorder (ASD), andobsessive-compulsive disorder (OCD) are common neurodevelopmental
    disorders that frequently cooccur.We aimed to directly compare all three disorders.
    The ENIGMA consortium is ideally positionedto investigate structural brain differences
    across these disorders.Methods: Structural T1-weighted whole-brain MRI of controls
    (n=5,827) and patients with ADHD(n=2,271), ASD (n=1,777), and OCD (n=2,323) from
    151 cohorts worldwide were analyzed usingstandardized processing protocols. We
    examined subcortical volume, cortical thickness and surface areadifferences within
    a mega-analytical framework, pooling measures extracted from each cohort.Analyses
    were performed separately for children, adolescents, and adults using linear mixed-effectsmodels
    adjusting for age, sex and site (and intra-cranial volume (ICV) for subcortical
    and surface areameasures).Results: We found no shared differences among all three
    disorders, while shared differences betweenany two disorders did not survive multiple
    comparisons correction. Children with ADHD compared tothose with OCD had smaller
    hippocampal volumes, possibly influenced by IQ. Children andadolescents with ADHD
    also had smaller ICV than controls and those with OCD or ASD. Adults withASD showed
    thicker frontal cortices compared to adult controls and other clinical groups.
    No OCDspecificdifferences across different age-groups and surface area differences
    among all disorders inchildhood and adulthood were observed.'
