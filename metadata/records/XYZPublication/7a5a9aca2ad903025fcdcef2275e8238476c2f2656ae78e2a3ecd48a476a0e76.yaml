- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Within- and across-network alterations of the sensorimotor network in Parkinson’s
    disease
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Purpose: Parkinson''s disease (PD) is primarily defined by motor symptoms
    and is associated with alterations of sensorimotor areas. Evidence for network
    changes of the sensorimotor network (SMN) in PD is inconsistent and a systematic
    evaluation of SMN in PD yet missing. We investigate functional connectivity changes
    of the SMN in PD, both, within the network, and to other large-scale connectivity
    networks.Methods: Resting-state fMRI was assessed in 38 PD patients under long-term
    dopaminergic treatment and 43 matched healthy controls (HC). Independent component
    analysis (ICA) into 20 components was conducted and the SMN was identified within
    the resulting networks. Functional connectivity within the SMN was analyzed using
    a dual regression approach. Connectivity between the SMN and the other networks
    from group ICA was investigated with FSLNets. We investigated for functional connectivity
    changes between patients and controls as well as between medication states (OFF
    vs. ON) in PD and for correlations with clinical parameters.Results: There was
    decreased functional connectivity within the SMN in left inferior parietal and
    primary somatosensory cortex in PD OFF. Across networks, connectivity between
    SMN and two motor networks as well as two visual networks was diminished in PD
    OFF. All connectivity decreases partially normalized in PD ON.Conclusion: PD is
    accompanied by functional connectivity losses of the SMN, both, within the network
    and in interaction to other networks. The connectivity changes in short- and long-range
    connections are probably related to impaired sensory integration for motor function
    in PD. SMN decoupling can be partially compensated by dopaminergic therapy.'
