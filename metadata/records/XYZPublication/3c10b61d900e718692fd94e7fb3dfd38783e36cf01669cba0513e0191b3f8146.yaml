  value: 'The Emerging Neuroscience of Social Punishment: Meta-Analytic Evidence'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Social punishment (SOP)-third-party punishment (TPP) and second-party punishment
    (SPP)-sanctions norm-deviant behavior. The hierarchical punishment model (HPM)
    posits that TPP is an extension of SPP and both recruit common processes engaging
    large-scale domain-general brain networks. Here, we provided meta-analytic evidence
    to the HPM by combining the activation likelihood estimation approach with connectivity
    analyses and hierarchical clustering analyses. Although both forms of SOP engaged
    the dorsolateral prefrontal cortex and bilateral anterior insula (AI), a functional
    differentiation also emerged with TPP preferentially engaging social cognitive
    regions (temporoparietal junction) and SPP affective regions (AI). Further, although
    both TPP and SPP recruit domain-general networks (salience, default-mode, and
    central-executive networks), some specificity in network organization was observed.
    By revealing differences and commonalities of the neural networks consistently
    activated by different types of SOP, our findings contribute to a better understanding
    of the neuropsychological mechanisms of social punishment behavior--one of the
    most peculiar human behaviors.
