attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: 'What predicts individual brain health?: a machine learning study spanning
    the exposome'
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Promoting brain health is vital for well-being and reducing healthcare burdens.
    Individual brain health asmeasured with the Brain Age Gap (BAG) - the difference
    between chronological and predicted brain age-relates to many factors. However,
    an holistic view, integrating the range of factors an individual brain isexposed
    to, is missing for understanding how the exposome shapes brain health. After computing
    BAGas an indicator of individual grey matter (GM) health, we predicted it using
    machine learning based on261 exposome variables (spanning biomedical, environmental,
    lifestyle, socio-affective, and early lifedomains) in UK Biobank participants.
    Exposome data can predict GM health with factors pertaining tocardiovascular and
    bone health, along with alcohol and smoking, nutrition and diabetes showing greatercontribution
    to the prediction. In such domains, life period and duration of exposure appeared
    crucial.This calls for early prevention in cardiovascular and metabolic health
    to promote life-long brain health.
