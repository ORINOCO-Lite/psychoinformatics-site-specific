  value: Mind blanking is a distinct mental state linked to a recurrent brain profile
    of globally positive connectivity during ongoing mentation
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Mind blanking (MB) is a waking state during which we do not report any mental
    content. The phenomenology of MB challenges the view of a constantly thinking
    mind. Here, we comprehensively characterize the MB’s neurobehavioral profile with
    the aim to delineate its role during ongoing mentation. Using functional MRI experience
    sampling, we show that the reportability of MB is less frequent, faster, and with
    lower transitional dynamics than other mental states, pointing to its role as
    a transient mental relay. Regarding its neural underpinnings, we observed higher
    global signal amplitude during MB reports, indicating a distinct physiological
    state. Using the time-varying functional connectome, we show that MB reports can
    be classified with high accuracy, suggesting that MB has a unique neural composition.
    Indeed, a pattern of global positive-phase coherence shows the highest similarity
    to the connectivity patterns associated with MB reports. We interpret this pattern’s
    rigid signal architecture as hindering content reportability due to the brain’s
    inability to differentiate signals in an informative way. Collectively, we show
    that MB has a unique neurobehavioral profile, indicating that nonreportable mental
    events can happen during wakefulness. Our results add to the characterization
    of spontaneous mentation and pave the way for more mechanistic investigations
    of MB’s phenomenology.
