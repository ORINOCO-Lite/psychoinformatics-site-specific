attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: The functional neural architecture of dysfunctional reward processing in
    autism
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Functional imaging studies have found differential neural activation patterns
    during reward-paradigms in patients with autism spectrum disorder (ASD) compared
    to neurotypical controls. However, publications report conflicting results on
    the directionality and location of these aberrant activations. We here quantitatively
    summarized relevant fMRI papers in the field using the anatomical likelihood estimation
    (ALE) algorithm. Patients with ASD consistently showed hypoactivations in the
    striatum across studies, mainly in the right putamen and accumbens. These regions
    are functionally involved in the processing of rewards and are enrolled in extensive
    neural networks involving limbic, cortical, thalamic and mesencephalic regions.
    The striatal hypo-activations found in our ALE meta-analysis, which pooled over
    contrasts derived from the included studies on reward-processing in ASD, highlight
    the role of the striatum as a key neural correlate of impaired reward processing
    in autism. These changes were present for studies using social and non-social
    stimuli alike. The involvement of these regions in extensive networks associated
    with the processing of both positive and negative emotion alike might hint at
    broader impairments of emotion processing in the disorder.
