attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Hippocampus co-atrophy pattern in dementia deviates from covariance patterns
    across the lifespan
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The hippocampus is a plastic region and highly susceptible to ageing and
    dementia. Previous studies explicitly imposed a priori models of hippocampus when
    investigating ageing and dementia-specific atrophy but led to inconsistent results.
    Consequently, the basic question of whether macrostructural changes follow a cytoarchitectonic
    or functional organization across the adult lifespan and in age-related neurodegenerative
    disease remained open. The aim of this cross-sectional study was to identify the
    spatial pattern of hippocampus differentiation based on structural covariance
    with a data-driven approach across structural MRI data of large cohorts (n = 2594).
    We examined the pattern of structural covariance of hippocampus voxels in young,
    middle-aged, elderly, mild cognitive impairment and dementia disease samples by
    applying a clustering algorithm revealing differentiation in structural covariance
    within the hippocampus. In all the healthy and in the mild cognitive impaired
    participants, the hippocampus was robustly divided into anterior, lateral and
    medial subregions reminiscent of cytoarchitectonic division. In contrast, in dementia
    patients, the pattern of subdivision was closer to known functional differentiation
    into an anterior, body and tail subregions. These results not only contribute
    to a better understanding of co-plasticity and co-atrophy in the hippocampus across
    the lifespan and in dementia, but also provide robust data-driven spatial representations
    (i.e. maps) for structural studies.
