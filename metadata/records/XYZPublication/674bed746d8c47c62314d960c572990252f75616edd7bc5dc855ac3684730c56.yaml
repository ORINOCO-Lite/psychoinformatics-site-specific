- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: The concept of autonomy is indispensable in the history of Western thought.
    At least that’s how it seems to us nowadays. However, the notion has not always
    had the outstanding significance that we ascribe to it today and its exact meaning
    has also changed considerably over time. In this paper, we want to shed light
    on different understandings of autonomy and clearly distinguish them from each
    other. Our main aim is to contribute to conceptual clarity in (interdisciplinary)
    discourses and to point out possible pitfalls of conceptual pluralism.
