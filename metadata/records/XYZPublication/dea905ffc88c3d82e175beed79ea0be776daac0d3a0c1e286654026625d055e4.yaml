  value: The global pandemic presented new challenges and op-portunities for organizing
    conferences, and OHBM 2021was no exception. The OHBM Brainhack is an event thatoccurs
    just prior to the OHBM meeting, typically in-per-son, where scientists of all
    levels of expertise and interestgather to work and learn together for a few days
    in a col-laborative hacking-style environment on projects of com-mon interest
    (1). Building off the success of the OHBM2020 Hackathon (2), the 2021 Open Science
    SpecialInterest Group came together online to organize a largecoordinated Brainhack
    event that would take place overthe course of 4 days. The OHBM 2021 Brainhack
    eventwas organized along two guiding principles, providinga highly inclusive collaborative
    environment for inter-action between scientists across disciplines and levelsof
    expertise to push forward important projects thatneed support, also known as the
    “Hack-Track” of theBrainhack. The second aim of the OHBM Brainhack is toempower
    scientists to improve the quality of their sci-entific endeavors by providing
    high-quality hands-ontraining on best practices in open-science approaches.This
    is best exemplified by the training events providedby the “Train-Track” at the
    OHBM 2021 Brainhack. Here,we briefly explain both of these elements of the OHBM2021
    Brainhack, before continuing on to the Brainhackproceedings.
