description: Previously published results indicate that the accuracy of decoding visual
  orientation from 7 Tesla fMRI data of V1 peaks at spatial acquisition resolutions
  that are routinely accessible with more conventional 3 Tesla scanners. This study
  directly compares the decoding performance between a 3 Tesla and a 7 Tesla dataset
  that were acquired using the same stimulation paradigm by applying an identical
  analysis procedure. The results indicate that decoding models built on 3 Tesla data
  are comparatively impaired. Moreover, we found no evidence for a strong coupling
  of BOLD signal change magnitude or temporal signal to noise ratio (tSNR) with decoding
  performance. Direct enhancement of tSNR via multiband fMRI acquisition at the same
  resolution did not translate into improved decoding performance. Additional voxel
  selection can boost 3 Tesla decoding performance to the 7 Tesla level only at a
  3 mm acquisition resolution. In both datasets the BOLD signal available for orientation
  decoding is spatially broadband, but, consistent with the size of the BOLD point-spread-function,
  decoding models at 3 Tesla utilize spatially coarser image components.
