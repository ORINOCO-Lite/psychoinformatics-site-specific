  value: Functional parcellation of human and macaque striatum reveals human-specific
    connectivity in the dorsal caudate
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: A wide homology between human and macaque striatum is often assumed as in
    both the striatum is involved in cognition, emotion and executive functions. However,
    differences in functional and structural organization between human and macaque
    striatum may reveal evolutionary divergence and shed light on human vulnerability
    to neuropsychiatric diseases. For instance, dopaminergic dysfunction of the human
    striatum is considered to be a pathophysiological underpinning of different disorders,
    such as Parkinson's disease (PD) and schizophrenia (SCZ). Previous investigations
    have found a wide similarity in structural connectivity of the striatum between
    human and macaque, leaving the cross-species comparison of its functional organization
    unknown. In this study, resting-state functional connectivity (RSFC) derived striatal
    parcels were compared based on their homologous cortico-striatal connectivity.
    The goal here was to identify striatal parcels whose connectivity is human-specific
    compared to macaque parcels. Functional parcellation revealed that the human striatum
    was split into dorsal, dorsomedial, and rostral caudate and ventral, central,
    and caudal putamen, while the macaque striatum was divided into dorsal, and rostral
    caudate and rostral, and caudal putamen. Cross-species comparison indicated dissimilar
    cortico-striatal RSFC of the topographically similar dorsal caudate. We probed
    clinical relevance of the striatal clusters by examining differences in their
    cortico-striatal RSFC and gray matter (GM) volume between patients (with PD and
    SCZ) and healthy controls. We found abnormal RSFC not only between dorsal caudate,
    but also between rostral caudate, ventral, central and caudal putamen and widespread
    cortical regions for both PD and SCZ patients. Also, we observed significant structural
    atrophy in rostral caudate, ventral and central putamen for both PD and SCZ while
    atrophy in the dorsal caudate was specific to PD. Taken together, our cross-species
    comparative results revealed shared and human-specific RSFC of different striatal
    clusters reinforcing the complex organization and function of the striatum. In
    addition, we provided a testable hypothesis that abnormalities in a region with
    human-specific connectivity, i.e., dorsal caudate, might be associated with neuropsychiatric
    disorders.
