- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Signal diffusion along connectome gradients and inter-hub routing differentially
    contribute to dynamic human brain function
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: 'Human cognition is dynamic, alternating over time between externally-focused
    states and more abstract, often self-generated, patterns of thought. Although
    cognitive neuroscience has documented how networks anchor particular modes of
    brain function, mechanisms that describe transitions between distinct functional
    states remain poorly understood. Here, we examined how time-varying changes in
    brain function emerge within the constraints imposed by macroscale structural
    network organization. Studying a large cohort of healthy adults (n = 326), we
    capitalized on manifold learning techniques that identify low dimensional representations
    of structural connectome organization and we decomposed neurophysiological activity
    into distinct functional states and their transition patterns using Hidden Markov
    Models. Structural connectome organization predicted dynamic transitions anchored
    in sensorimotor systems and those between sensorimotor and transmodal states.
    Connectome topology analyses revealed that transitions involving sensorimotor
    states traversed short and intermediary distances and adhered strongly to communication
    mechanisms of network diffusion. Conversely, transitions between transmodal states
    involved spatially distributed hubs and increasingly engaged long-range routing.
    These findings establish that the structure of the cortex is optimized to allow
    neural states the freedom to vary between distinct modes of processing, and so
    provides a key insight into the neural mechanisms that give rise to the flexibility
    of human cognition.Keywords: Hidden Markov Model; diffusion MRI; functional dynamics;
    gradients; multimodal imaging; structural connectome.'
