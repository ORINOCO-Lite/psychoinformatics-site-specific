attributes:
- predicate: dcterms:title
  schema_type: dlthings:AttributeSpecification
  value: Local synchronicity in dopamine-rich caudate nucleus influences Huntington’s
    disease motor phenotype
- predicate: dcterms:abstract
  schema_type: dlthings:AttributeSpecification
  value: Structural grey and white matter changes precede the manifestation of clinical
    signs of Huntington's disease by many years. Conversion to clinically manifest
    disease therefore likely reflects not merely atrophy but a more wide-spread breakdown
    of brain function. Here, we investigated the structure - function relationship
    close to and after the clinical onset testing for its co-localization with specific
    neurotransmitter/receptor systems and important regional brain hubs, in particular
    caudate nucleus and putamen that are central to maintain normal motor behavior.
    In two independent cohorts of patients with premanifest Huntington's disease close
    to onset and very early manifest Huntington's disease (total n = 84; n = 88 matched
    controls) we used structural and resting state functional MRI. We show that measures
    of functional activity and local synchronicity within cortical and subcortical
    regions remain normal in the premanifest Huntington's disease phase despite clear
    evidence of brain atrophy. In manifest Huntington's disease, homeostasis of synchronicity
    was disrupted in subcortical hub regions such as caudate nucleus and putamen,
    but also in cortical hub regions, for instance the parietal lobe. Cross-modal
    spatial correlations of functional MRI data with receptor/neurotransmitter distribution
    maps showed that Huntington's disease specific alterations co-localize with dopamine
    receptors D1, D2, as well as dopamine and serotonin transporters. Caudate nucleus
    synchronicity significantly improved models predicting the severity of the motor
    phenotype or predicting the classification into premanifest Huntington's disease
    or motor manifest Huntington's disease. Our data suggest that the functional integrity
    of the dopamine receptor rich caudate nucleus is key to maintain network function.
    The loss of caudate nucleus functional integrity affects network function to a
    degree that causes a clinical phenotype. These insights into what happens in Huntington's
    disease could serve as a model for what might be a more general relationship between
    brain structure and function in neurodegenerative diseases in which other brain
    regions are vulnerable.
