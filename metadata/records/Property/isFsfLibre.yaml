description: Specifies whether the Free Software Foundation (FSF) has listed a License
  as "free" in their commentary on licenses, located at the time of this writing at
  Various Licenses and Comments about Them. A value of "true" indicates that the license
  is in the list of licenses that FSF publishes as libre. A value of "false" indicates
  that the license is explicitly not in the corresponding list of FSF libre licenses
  (e.g., FSF has the license on a non-free list).
